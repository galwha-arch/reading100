h a big smile.","그는 항상 환하게 웃으며 승객들에게 인사한다."],["One rainy day, an old woman got on the bus with many bags.","비 오는 어느 날, 한 할머니가 많은 가방을 들고 버스에 탔다."],["Mr. Kim stood up and {1} her bags.","김 씨는 일어나서 할머니의 가방을 들어 드렸다."],["He also waited until she sat down.","그는 할머니가 자리에 앉을 때까지 기다려 주기도 했다."],["Many people in my town know him.","우리 동네 많은 사람들이 그를 안다."],["Children call him \"the smile driver.\"","아이들은 그를 '미소 기사님'이라고 부른다."],["He makes our town a {2} place.","그는 우리 동네를 더 좋은 곳으로 만든다."]],"b":[[["carry","carried","carries"],1,"앞의 stood up과 같은 과거 이야기이므로 carried가 알맞습니다."],[["worse","better","colder"],1,"친절한 기사님이 동네를 '더 좋은' 곳으로 만든다는 뜻이므로 better입니다."]],"g":[["5형식 call/make + 목적어 + 보어","Children call him \"the smile driver.\"","call A B는 'A를 B라고 부르다', make A B는 'A를 B로 만들다'라는 뜻입니다.","We call our dog Max."],["접속사 until","He waited until she sat down.","until은 '~할 때까지'라는 뜻으로 어떤 일이 계속되는 끝 시점을 나타냅니다.","Wait here until I come back."]],"k":[["driver","My uncle is a taxi driver.","우리 삼촌은 택시 기사다."],["passenger","The bus has ten passengers.","그 버스에는 승객이 열 명 있다."],["get on","Get on the bus quickly.","빨리 버스에 타."],["carry","Can you carry this box?","이 상자 들어 줄 수 있니?"],["town","This is a quiet town.","이곳은 조용한 동네다."]],"c":{}},{"id":97,"lv":"상","type":"p","topic":"문화","title":"Why Do People Shake Hands?","s":[["Shaking hands is the most common greeting in many countries, but where did it come from?","악수는 많은 나라에서 가장 흔한 인사이지만, 그것은 어디서 왔을까?"],["Historians believe that it started thousands of years ago as a sign of peace.","역사가들은 악수가 수천 년 전 평화의 표시로 시작되었다고 믿는다."],["In the past, people often carried weapons {1} they met strangers.","과거에는 사람들이 낯선 사람을 만날 때 무기를 지니고 다니는 경우가 많았다."],["By holding out an empty right hand, a person could show that he was not holding a sword.","빈 오른손을 내밂으로써 사람은 자신이 칼을 쥐고 있지 않다는 것을 보여 줄 수 있었다."],["Shaking the hands up and down may have been a way to check that nothing was hidden in the sleeves.","손을 위아래로 흔드는 것은 소매에 아무것도 숨겨져 있지 않은지 확인하는 방법이었을지도 모른다."],["Over time, the handshake became a way of showing trust and {2}.","시간이 지나면서 악수는 신뢰와 존중을 보여 주는 방법이 되었다."],["Today, it is used not only to say hello but also to make agreements.","오늘날 악수는 인사할 때뿐만 아니라 합의를 할 때도 사용된다."],["However, customs differ from culture to culture.","하지만 관습은 문화마다 다르다."],["In some countries, a strong handshake is polite, while in others, a {3} one is preferred.","어떤 나라에서는 힘찬 악수가 예의 바른 것이지만, 다른 나라에서는 부드러운 악수가 선호된다."]],"b":[[["when","unless","until"],0,"낯선 사람을 '만날 때' 무기를 지녔다는 뜻이므로 when입니다."],[["respect","fear","anger"],0,"trust(신뢰)와 나란히 오는 긍정적인 말 '존중(respect)'이 알맞습니다."],[["gentle","strong","dirty"],0,"while이 대조를 나타내므로 strong과 반대인 gentle(부드러운)입니다."]],"g":[["not only A but also B","It is used not only to say hello but also to make agreements.","not only A but also B는 'A뿐만 아니라 B도'라는 뜻입니다. A와 B는 같은 형태(여기서는 to부정사)로 씁니다.","She is not only smart but also kind."],["by + 동명사 (수단)","By holding out an empty right hand, a person could show ...","by + -ing는 '~함으로써'라는 수단·방법을 나타냅니다.","You can improve your English by reading every day."]],"k":[["historian","The historian wrote a book about Joseon.","그 역사가는 조선에 관한 책을 썼다."],["weapon","Soldiers carry weapons.","군인들은 무기를 지닌다."],["stranger","Don't talk to strangers.","낯선 사람과 이야기하지 마라."],["trust","Trust is important in friendship.","우정에서 신뢰는 중요하다."],["custom","It is a Korean custom to bow.","절하는 것은 한국의 관습이다."]],"c":{"may":"may have been = ~이었을지도 모른다","sleeves":"소매","agreements":"합의, 계약"}},{"id":98,"lv":"상","type":"p","topic":"편지","title":"A Letter from the Future","s":[["Dear fourteen-year-old me,","열네 살의 나에게,"],["I'm writing this letter from the year 2045, when you are thirty-three years old.","나는 네가 서른세 살이 된 2045년에서 이 편지를 쓰고 있어."],["I know you are worried about many things right now, like exams, friends, and what you will become in the future.","지금 너는 시험, 친구, 그리고 앞으로 무엇이 될지 같은 많은 것들을 걱정하고 있겠지."],["I want to tell you that most of the things you are worried about will never {1}.","네가 걱정하는 것들 대부분은 절대 일어나지 않을 거라고 말해 주고 싶어."],["You will fail some tests, and some friends will leave, but you will also meet people who will become a part of your life forever.","너는 몇몇 시험에서 떨어지고 몇몇 친구는 떠나겠지만, 평생 네 삶의 일부가 될 사람들도 만나게 될 거야."],["One thing I {2} is that I didn't try more new things when I was young.","내가 후회하는 한 가지는 어렸을 때 새로운 것을 더 많이 시도하지 않았다는 거야."],["So don't be afraid of making mistakes.","그러니 실수하는 것을 두려워하지 마."],["Join that club, learn that instrument, and talk to that new student.","그 동아리에 들어가고, 그 악기를 배우고, 그 새로 온 친구에게 말을 걸어 봐."],["Also, be {3} to Mom and Dad. They won't be young forever.","그리고 엄마 아빠께 잘해 드려. 부모님이 영원히 젊으시진 않을 거야."],["I'm proud of you.","나는 네가 자랑스러워."],["Love, Future Me","사랑을 담아, 미래의 내가"]],"b":[[["happen","disappear","stop"],0,"걱정하는 일들 대부분은 '일어나지(happen)' 않을 것이라는 뜻입니다."],[["regret","enjoy","remember"],0,"새로운 것을 더 시도하지 않은 것을 '후회한다(regret)'는 뜻입니다."],[["nice","rude","late"],0,"부모님께 '잘해 드려라(be nice to)'라는 조언입니다."]],"g":[["관계부사 when (계속적 용법)","the year 2045, when you are thirty-three years old","쉼표 뒤의 when은 앞의 시간(2045년)에 대해 '그때 ~'라고 설명을 덧붙입니다.","I visited Paris in 2020, when I was ten."],["목적격 관계대명사 생략","most of the things you are worried about / One thing I regret","the things (that) you are worried about, One thing (that) I regret에서 목적격 관계대명사가 생략되었습니다.","The man I met yesterday was kind."]],"k":[["exam","I have an exam tomorrow.","나는 내일 시험이 있다."],["fail","I failed the driving test.","나는 운전면허 시험에 떨어졌다."],["forever","I will love you forever.","너를 영원히 사랑할게."],["regret","I regret saying that.","그 말을 한 것을 후회한다."],["proud","I'm proud of my team.","나는 우리 팀이 자랑스럽다."]],"c":{"me":"나 (편지의 받는 사람인 '과거의 나')"}},{"id":99,"lv":"하","type":"p","topic":"환경","title":"Save Water at Home","s":[["Water is very important for all living things.","물은 모든 생물에게 매우 중요하다."],["But we often waste it at home.","하지만 우리는 종종 집에서 물을 낭비한다."],["Here are some easy ways to save water.","여기 물을 아끼는 몇 가지 쉬운 방법이 있다."],["First, turn off the water when you brush your teeth.","첫째, 이를 닦을 때 물을 잠가라."],["Use a cup {1}.","대신 컵을 사용해라."],["Second, take short showers.","둘째, 샤워를 짧게 해라."],["A five-minute shower is enough.","5분 샤워면 충분하다."],["Third, do not throw away water after you wash fruit.","셋째, 과일을 씻은 후 물을 버리지 마라."],["You can use it to water plants.","그 물을 식물에 주는 데 쓸 수 있다."],["Small actions can make a big {2}.","작은 행동이 큰 변화를 만들 수 있다."]],"b":[[["instead","again","too"],0,"물을 틀어 두는 대신 컵을 쓰라는 뜻이므로 instead가 알맞습니다."],[["mistake","difference","noise"],1,"make a difference는 '변화를 가져오다, 차이를 만들다'라는 뜻입니다."]],"g":[["부정 명령문 do not","Do not throw away water.","Do not(Don't) + 동사원형은 '~하지 마라'라는 부정 명령문입니다.","Don't run in the hallway."],["to부정사의 부사적 용법(목적)","You can use it to water plants.","to + 동사원형이 '~하기 위해'라는 목적을 나타냅니다.","I went to the store to buy milk."]],"k":[["waste","Don't waste your time.","시간을 낭비하지 마라."],["save","We should save energy.","우리는 에너지를 아껴야 한다."],["turn off","Turn off the light, please.","불 좀 꺼 줘."],["enough","Ten minutes is enough.","10분이면 충분하다."],["throw away","Don't throw away the box.","그 상자를 버리지 마."]],"c":{"water":"물; (식물에) 물을 주다"}},{"id":100,"lv":"중","type":"d","topic":"길 묻기","title":"Lost in the Subway","s":[["Tourist","Excuse me. Could you tell me how to get to Gyeongbokgung?","실례합니다. 경복궁에 어떻게 가는지 알려 주시겠어요?"],["Yuri","Sure. You need to take Line 3.","물론이죠. 3호선을 타셔야 해요."],["Tourist","Which way is Line 3? This station is so big.","3호선은 어느 쪽인가요? 이 역은 너무 커요."],["Yuri","Follow the orange signs. Then get off at Gyeongbokgung Station.","주황색 표지판을 따라가세요. 그리고 경복궁역에서 내리세요."],["Tourist","How many stops is {1}?","몇 정거장이에요?"],["Yuri","It's four stops from here. Use exit 5 when you get there.","여기서 네 정거장이에요. 도착하면 5번 출구를 이용하세요."],["Tourist","Is it far from the exit?","출구에서 먼가요?"],["Yuri","No, it's {2} a five-minute walk.","아니요, 걸어서 5분밖에 안 걸려요."],["Tourist","Thank you. Your English is very good.","감사합니다. 영어를 아주 잘하시네요."],["Yuri","{3} Enjoy your visit to Seoul!","고마워요. 서울 여행 즐겁게 하세요!"]],"b":[[["it","that","this"],0,"거리나 정거장 수를 물을 때 비인칭 주어 it을 씁니다."],[["only","never","still"],0,"'겨우 5분 거리'라는 뜻이므로 only가 알맞습니다."],[["Thanks for saying so.","You'r (function(){
var $=function(id){return document.getElementById(id);};
var KEY="reading100.v1", st={cur:1,ans:{}};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv&&sv.ans)st=sv;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
var P=null, filt="all";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function lines(p){return p.s.map(function(r){return p.type==="d"?{sp:r[0],en:r[1],ko:r[2]}:{sp:"",en:r[0],ko:r[1]};});}
function ansText(p,n){var b=p.b[n-1];return b[0][b[1]];}
function filled(p,en){return en.replace(/\{(\d+)\}/g,function(m,n){return ansText(p,+n);});}
function answers(id){return st.ans[id]||(st.ans[id]={});}
// 주요 구문 강조: 문장 속에서 확인된 다어절 문법 표현만 표시
var PHRASE_RULES=[
 /\\b(?:in order to|so as to|as soon as|as long as|even though|even if|as if|not only|but also|because of|instead of|in spite of|according to|in addition to|as a result of|be able to|used to|have to|has to|had to|would like to|look forward to|take care of|pay attention to|be interested in|be good at|be afraid of|be proud of|be different from|be similar to|be responsible for|be made of|be made from|be known for|be famous for|such as|for example|rather than|more than|less than|at least|at first|in fact|on the other hand|in other words|by the way|in the end|at the same time|each other|one another)\\b/gi,
 /\\b(?:too\\s+\\w+\\s+to|\\w+\\s+enough\\s+to|so\\s+\\w+\\s+that|such\\s+(?:a|an)\\s+\\w+\\s+that|the\\s+more\\s+\\w+\\s+the\\s+more)\\b/gi
];
function phraseMarkedTokens(tokens){
 var words=tokens.filter(function(t){return t.t==="word";}), str=words.map(function(t){return t.v;}).join(" "), marks=new Set();
 PHRASE_RULES.forEach(function(rule){rule.lastIndex=0;var m;while((m=rule.exec(str))){var before=str.slice(0,m.index).trim(), start=before?before.split(/\\s+/).length:0, count=m[0].trim().split(/\\s+/).length;for(var j=start;j<start+count;j++)marks.add(j);}});
 var k=0;tokens.forEach(function(t){if(t.t==="word")t.major=marks.has(k++);});return tokens;
}
function wordsHtml(s,li){
  return phraseMarkedTokens(tokenize(s)).map(function(t){
    if(t.t==="word")return '<button type="button" class="w"+(t.major?" major-phrase":"")+" data-w="'+esc(t.v)+'" data-l="'+li+'">'+esc(t.v)+'</button>';
    if(t.t==="sep")return esc(t.v);
    return "";}).join("");
}
function lineHtml(p,en,li){
  var a=answers(p.id);
  return phraseMarkedTokens(tokenize(en)).map(function(t){
    if(t.t==="word")return '<button type="button" class="w"+(t.major?" major-phrase":"")+" data-w="'+esc(t.v)+'" data-l="'+li+'">'+esc(t.v)+'</button>';
    if(t.t==="sep")return esc(t.v);
    var n=t.n;
    if(a[n]===undefined)return '<button type="button" class="blank" data-q="'+n+'">('+n+') ______</button>';
    var ok=a[n]===p.b[n-1][1];
    return '<span class="fill '+(ok?"ok":"bad")+'"><sup>('+n+')</sup>'+wordsHtml(ansText(p,n),li)+'</span>';
  }).join("");
}
function renderText(){
  var p=P, ls=lines(p), h;
  if(p.type==="d")h=ls.map(function(l,i){return '<div class="line"><div class="spk">'+esc(l.sp)+'</div><div>'+lineHtml(p,l.en,i)+'</div></div>';}).join("");
  else h='<p>'+ls.map(function(l,i){return lineHtml(p,l.en,i);}).join(" ")+'</p>';
  $("text").innerHTML=h;
}
function renderQs(){
  var p=P,a=answers(p.id);
  $("qs").innerHTML=p.b.map(function(b,i){
    var n=i+1, ch=a[n], done=ch!==undefined;
    var o=b[0].map(function(op,j){
      var cls="opt"+(done&&j===b[1]?" right":"")+(done&&j===ch&&ch!==b[1]?" wrong":"");
      return '<button type="button" class="'+cls+'" data-n="'+n+'" data-j="'+j+'"'+(done?" disabled":"")+'><span class="al">'+"ABC"[j]+'</span><span>'+esc(op)+'</span></button>';}).join("");
    var fb=done?'<div class="fb">'+(ch===b[1]?'<b class="ok">정답!</b> ':'<b class="bad">아쉬워요.</b> 정답은 '+"ABC"[b[1]]+' <i>'+esc(b[0][b[1]])+'</i>. ')+esc(b[2])+'</div>':"";
    return '<div class="q" id="q'+n+'"><div class="q-h">('+n+')</div><div class="opts">'+o+'</div>'+fb+'</div>';}).join("");
}
function renderAll(){
  var p=P;
  $("no").innerHTML='<b>'+p.id+'</b> / '+DATA.length;
  $("meta").innerHTML='<span class="chip lv lv-'+p.lv+'">난이도 '+p.lv+'</span><span class="chip">'+(p.type==="d"?"대화문":"글")+'</span><span class="chip">'+esc(p.topic)+'</span>';
  $("title").textContent=p.title;
  $("tabEach").textContent=p.type==="d"?"화자별":"문장별";
  renderText();renderQs();
  $("gram").innerHTML=p.g.map(function(g,i){return '<div class="g"><div class="g-n"><span>'+(i+1)+'</span>'+esc(g[0])+'</div><div class="g-s">'+esc(g[1])+'</div><div>'+esc(g[2])+'</div><div class="g-x">예문 · <i>'+esc(g[3])+'</i></div></div>';}).join("");
  $("keys").innerHTML=p.k.map(function(k){return '<li><div class="kw">'+esc(k[0])+'</div><div><div class="ke">'+esc(k[1])+'</div><div class="kk">'+esc(k[2])+'</div></div></li>';}).join("");
  $("prev").disabled=p.id===1;$("next").disabled=p.id===DATA.length;
  renderScore();closeSheet();
}
function renderScore(){
  var tot=0,ok=0,done=0;
  DATA.forEach(function(p){var a=st.ans[p.id]||{},c=0;p.b.forEach(function(b,i){if(a[i+1]!==undefined){tot++;c++;if(a[i+1]===b[1])ok++;}});if(c===p.b.length)done++;});
  $("score").innerHTML='<b>'+done+'</b>/'+DATA.length+' 지문 완료<br>정답률 '+(tot?Math.round(ok/tot*100):0)+'%';
}
function go(id){
  id=Math.max(1,Math.min(DATA.length,id));P=DATA[id-1];st.cur=id;save();
  if(location.hash!=="#p"+id){try{history.replaceState(null,"","#p"+id);}catch(e){location.hash="p"+id;}}
  renderAll();window.scrollTo(0,0);
}

function openWord(btn){
  var w=btn.getAttribute("data-w"), li=+btn.getAttribute("data-l"), p=P;
  var r=resolveWord(DICT,w)||{b:w,pos:"",m:"(사전에 없는 단어)",f:""};
  var key=w.toLowerCase().replace(/’/g,"'"), ctx=p.c[key]||p.c[r.b];
  document.querySelectorAll(".w.on").forEach(function(x){x.classList.remove("on");});btn.classList.add("on");
  $("shW").textContent=w;$("shP").textContent=r.pos?posLabel(r.pos):"";$("shP").hidden=!r.pos;
  $("shM").textContent=r.m.replace(/;/g,", ");
  var l=lines(p)[li], d="";
  if(r.b.toLowerCase()!==key||r.f)d+='<dt>원형</dt><dd class="en">'+esc(r.b)+'</dd>';
  if(r.f)d+='<dt>변형</dt><dd>'+esc(r.f)+'</dd>';
  if(ctx)d+='<dt>이 지문에서</dt><dd>'+esc(ctx)+'</dd>';
  if(l)d+='<dt>지문 속 문장</dt><dd><div class="en">'+esc(filled(p,l.en))+'</div><div style="color:var(--muted)">'+esc(l.ko)+'</div></dd>';
  $("shD").innerHTML=d;$("sheet").hidden=false;
}
function closeSheet(){$("sheet").hidden=true;document.querySelectorAll(".w.on").forEach(function(x){x.classList.remove("on");});}
// 해석 팝업
var trTab="full";
function renderTr(){
  var p=P, ls=lines(p);
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.getAttribute("data-tab")===trTab);});
  if(trTab==="full"){
    $("trBody").innerHTML=p.type==="d"?ls.map(function(l){return '<p class="tr-full"><b style="color:var(--accent)">'+esc(l.sp)+'</b> '+esc(l.ko)+'</p>';}).join(""):'<p class="tr-full">'+esc(ls.map(function(l){return l.ko;}).join(" "))+'</p>';
  }else{
    $("trBody").innerHTML=ls.map(function(l){return '<div class="tr-row"><div class="tr-en">'+(l.sp?'<b>'+esc(l.sp)+'</b>':"")+esc(filled(p,l.en))+'</div><div class="tr-ko">'+esc(l.ko)+'</div></div>';}).join("");

// 목록
function renderList(){
  var fs=[["all","전체"],["하","하"],["중","중"],["상","상"],["d","대화문"],["todo","안 푼 지문"]];
  $("filters").innerHTML=fs.map(function(f){return '<button type="button" class="fchip'+(filt===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>';}).join("");
  $("grid").innerHTML=DATA.filter(function(p){
    var a=st.ans[p.id]||{},done=p.b.every(function(b,i){return a[i+1]!==undefined;});
    return filt==="all"||p.lv===filt||(filt==="d"&&p.type==="d")||(filt==="todo"&&!done);
  }).map(function(p){
    var a=st.ans[p.id]||{},c=0,ok=0;p.b.forEach(function(b,i){if(a[i+1]!==undefined){c++;if(a[i+1]===b[1])ok++;}});
    var mark=c===p.b.length?'<span class="done">'+ok+'/'+p.b.length+'</span>':(c?c+'/'+p.b.length:"");
    return '<button type="button" class="it'+(p.id===P.id?" cur":"")+'" data-id="'+p.id+'"><span class="n">'+p.id+'</span><span class="t">'+esc(p.title)+'</span><span class="s"><span class="dot lv-'+p.lv+'"></span>'+p.lv+(p.type==="d"?" · 대화":"")+(mark?" · "+mark:"")+'</span></button>';
  }).join("");
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!t){if(!e.target.closest(".sh"))closeSheet();return;}
  if(t.classList.contains("w")){openWord(t);return;}
  if(t.classList.contains("blank")){var q=$("q"+t.getAttribute("data-q"));if(q)q.scrollIntoView({behavior:"smooth",block:"center"});return;}
  if(t.classList.contains("opt")){var n=+t.getAttribute("data-n");answers(P.id)[n]=+t.getAttribute("data-j");save();renderText();renderQs();renderScore();return;}
  if(t.classList.contains("tab")){trTab=t.getAttribute("data-tab");renderTr();return;}
  if(t.classList.contains("fchip")){filt=t.getAttribute("data-f");renderList();return;}
  if(t.classList.contains("it")){$("listOv").hidden=true;go(+t.getAttribute("data-id"));return;}
  if(t.hasAttribute("data-close")){$(t.getAttribute("data-close")).hidden=true;return;}
  if(t.id==="shX"){closeSheet();return;}
  if(t.id==="prev")go(P.id-1);else if(t.id==="next")go(P.id+1);
  else if(t.id==="openTr"){closeSheet();trTab="full";renderTr();$("trOv").hidden=false;}
  else if(t.id==="openList"){closeSheet();renderList();$("listOv").hidden=false;}
  else if(t.id==="retry"){delete st.ans[P.id];save();renderAll();}
  else if(t.id==="resetAll"){if(t.getAttribute("data-sure")){st.ans={};save();renderAll();renderList();}else{t.setAttribute("data-sure","1");t.textContent="한 번 더 누르면 모두 지워집니다";}}
});
document.querySelectorAll(".ov").forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)o.hidden=true;});});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeSheet();$("trOv").hidden=true;$("listOv").hidden=true;}
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(!$("trOv").hidden||!$("listOv").hidden)return;
  if(e.key==="ArrowRight"&&P.id<DATA.length)go(P.id+1);
  if(e.key==="ArrowLeft"&&P.id>1)go(P.id-1);
});
function fromHash(){var m=/^#p(\d+)$/.exec(location.hash);return m?+m[1]:0;}
window.addEventListener("hashchange",function(){var h=fromHash();if(h&&h!==P.id)go(h);});
go(fromHash()||st.cur||1);
})();
</script>
