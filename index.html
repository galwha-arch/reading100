<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>중학 영어 독해 100</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: 한 장짜리 독해 학습지. 상단 고정 바 + 가운데 한 단(최대 760px), 단어·해석·목록은 시트/팝업 */
:root{
  --bg:#EEF2F5; --paper:#FFFFFF; --ink:#18212C; --muted:#5A6676; --line:#D8DFE6;
  --accent:#1E5AA0; --accent-soft:#E3EDF8; --mark:#FFE7A0;
  --easy:#23855A; --mid:#B07800; --hard:#C0461B;
  --ok:#1F8A4C; --ok-soft:#E2F4EA; --bad:#C2352B; --bad-soft:#FBE7E5;
  --shadow:0 10px 30px rgba(20,35,55,.16);
  --f-en:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --paper:#18202A; --ink:#E5EAF0; --muted:#9AA6B5; --line:#2B3541;
  --accent:#7FB2EE; --accent-soft:#1E2D40; --mark:#5A4A12;
  --easy:#5FCB93; --mid:#E2B04A; --hard:#F08A62;
  --ok:#5FCB93; --ok-soft:#173326; --bad:#F2877E; --bad-soft:#3A1E1C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151B; --paper:#18202A; --ink:#E5EAF0; --muted:#9AA6B5; --line:#2B3541;
  --accent:#7FB2EE; --accent-soft:#1E2D40; --mark:#5A4A12;
  --easy:#5FCB93; --mid:#E2B04A; --hard:#F08A62;
  --ok:#5FCB93; --ok-soft:#173326; --bad:#F2877E; --bad-soft:#3A1E1C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-size:15px;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.score{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink);font-size:15px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
main{max-width:760px;margin:0 auto;padding-block:16px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.nav{display:flex;align-items:center;gap:8px}
.nav .no{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.nav .no b{color:var(--ink);font-size:20px;font-family:var(--f-en)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);letter-spacing:.02em}
.lv{color:var(--paper);border:0;font-weight:700}
.lv-하{background:var(--easy)}.lv-중{background:var(--mid)}.lv-상{background:var(--hard)}
h1{font-family:var(--f-en);font-weight:600;font-size:clamp(22px,4.5vw,28px);line-height:1.25;margin:0 0 4px;text-wrap:balance}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.text{font-family:var(--f-en);font-size:18px;line-height:1.95}
.text p{margin:0}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.spk{font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--accent);padding-top:6px;min-width:52px}
.w{background:none;border:0;padding:0 1px;margin:0;border-radius:3px;font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
.w:hover{background:var(--accent-soft)}
.w.on{background:var(--mark)}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;
  padding:0 8px;font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--accent);line-height:1.6;vertical-align:baseline}
.fill{border-radius:4px;padding:0 2px}
.fill.ok{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.fill.bad{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad)}
.fill sup{font-family:var(--f-ui);font-size:10px;font-weight:700;color:var(--muted);margin-right:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q-h{font-weight:700;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px;font-family:var(--f-en);font-size:15.5px;line-height:1.35;min-width:0}
.opt .al{font-family:var(--f-ui);font-weight:700;font-size:12px;color:var(--muted);padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:8px;font-size:14px;padding:8px 11px;border-radius:8px;background:var(--bg)}
.fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}
.gram{display:grid;gap:12px}
.g{border:1px solid var(--line);border-radius:10px;padding:14px}
.g-n{display:flex;gap:8px;align-items:baseline;font-weight:700;margin-bottom:6px}
.g-n span{font-family:var(--f-en);color:var(--accent);font-size:20px;line-height:1}
.g-s{font-family:var(--f-en);font-size:16px;background:var(--bg);border-radius:6px;padding:7px 10px;margin:6px 0}
.g-x{font-size:13.5px;color:var(--muted)}
.g-x i{font-family:var(--f-en);font-style:normal;color:var(--ink)}
.keys{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.keys li{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.keys li:first-child{border-top:0;padding-top:0}
.keys .kw{font-family:var(--f-en);font-weight:600;color:var(--accent)}
.keys .ke{font-family:var(--f-en)}
.keys .kk{font-size:13px;color:var(--muted)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,18,28,.45);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;min-width:0}
.m-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.m-h h3{margin:0 auto 0 0;font-size:16px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.m-b{overflow:auto;padding:16px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13.5px}
.tab.on{background:var(--paper);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tr-full{font-size:16px;line-height:1.85;margin:0}
.tr-row{padding:10px 0;border-top:1px solid var(--line)}
.tr-row:first-child{border-top:0;padding-top:0}
.tr-en{font-family:var(--f-en);font-size:15.5px}
.tr-en b{font-family:var(--f-ui);font-size:12.5px;color:var(--accent);margin-right:6px}
.tr-ko{color:var(--muted);font-size:14.5px}
/* word sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sh{pointer-events:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:14px 16px 16px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.sh-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh-w{font-family:var(--f-en);font-size:24px;font-weight:600}
.sh-pos{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.sh-top .x{margin-left:auto}
.sh-m{font-size:17px;font-weight:500;margin:6px 0 4px}
.sh-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:8px 0 0}
.sh-dl dt{color:var(--muted)}.sh-dl dd{margin:0;min-width:0}
.sh-dl .en{font-family:var(--f-en)}
/* list */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0;position:relative}
.it:hover{border-color:var(--accent)}
.it.cur{outline:2px solid var(--accent)}
.it .n{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums;grid-row:span 2}
.it .t{font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.it .s{font-size:11px;color:var(--muted)}
.it .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.lv-하{background:var(--easy)}.dot.lv-중{background:var(--mid)}.dot.lv-상{background:var(--hard)}
.it .done{color:var(--ok);font-weight:700}
.reset{margin-top:16px;font-size:13px;color:var(--muted)}
.reset button{border:0;background:none;text-decoration:underline;color:var(--muted);padding:0}
.w.major-phrase{color:#d2232a!important;font-weight:700!important;text-decoration-color:#d2232a!important}\n</style>

<header class="top"><div class="top-in">
  <div class="brand">중학 영어 독해 100<small>중1·2 · 빈칸 · 단어 · 문법</small></div>
  <div class="score" id="score"></div>
  <button class="btn" id="openList" type="button">목록</button>
</div></header>

<main>
  <div class="nav">
    <button class="btn" id="prev" type="button">← 이전</button>
    <div class="no" id="no"></div>
    <button class="btn" id="next" type="button">다음 →</button>
  </div>
  <article class="card">
    <div class="meta" id="meta"></div>
    <h1 id="title"></h1>
    <p class="hint">모든 단어를 누르면 뜻이 나와요. 빈칸은 아래 문제에서 골라 채우세요.</p>
    <div class="text" id="text"></div>
    <div class="actions">
      <button class="btn primary" id="openTr" type="button">해석 보기</button>
      <button class="btn" id="retry" type="button">이 지문 다시 풀기</button>
    </div>
  </article>
  <section class="card" aria-labelledby="hq"><h2 id="hq">빈칸 문제</h2><div id="qs"></div></section>
  <section class="card" aria-labelledby="hg"><h2 id="hg">핵심 문법 2가지</h2><div class="gram" id="gram"></div></section>
  <section class="card" aria-labelledby="hk"><h2 id="hk">핵심 단어 예문</h2><ul class="keys" id="keys"></ul></section>
</main>

<div class="ov" id="trOv" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="trT">
  <div class="m-h"><h3 id="trT">해석</h3>
    <div class="tabs"><button class="tab on" data-tab="full" type="button">전체</button><button class="tab" data-tab="each" type="button" id="tabEach">문장별</button></div>
    <button class="x" data-close="trOv" type="button" aria-label="닫기">×</button></div>
  <div class="m-b" id="trBody"></div>
</div></div>

<div class="ov" id="listOv" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lsT" style="max-width:820px">
  <div class="m-h"><h3 id="lsT">지문 목록</h3><button class="x" data-close="listOv" type="button" aria-label="닫기">×</button></div>
  <div class="m-b">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <p class="reset">기록은 이 기기의 브라우저에만 저장됩니다. <button type="button" id="resetAll">전체 기록 지우기</button></p>
  </div>
</div></div>

<div class="sheet" id="sheet" hidden><div class="sh" role="dialog" aria-labelledby="shW">
  <div class="sh-top"><span class="sh-w" id="shW"></span><span class="sh-pos" id="shP"></span><button class="x" id="shX" type="button" aria-label="닫기">×</button></div>
  <div class="sh-m" id="shM"></div>
  <dl class="sh-dl" id="shD"></dl>
</div></div>

<script>
// 단어 해석기: 사전(D)에서 원형을 찾고 규칙 변화(-s, -ed, -ing, -er, -est)를 풀어 준다.
var POS = {n:"명사",v:"동사",a:"형용사",ad:"부사",prep:"전치사",conj:"접속사",pron:"대명사",art:"관사",aux:"조동사",int:"감탄사",num:"수사",det:"한정사",name:"고유명사",phr:"표현"};
function posLabel(p){return p.split(",").map(function(x){return POS[x]||x;}).join(" · ");}
function parseEntry(D, key){
  var e = D[key]; if(!e) return null;
  var f = e.split("|");
  if(f[0].charAt(0)==="="){
    var base=f[0].slice(1), be=D[base]; if(!be) return null;
    var bf=be.split("|");
    return {b:base,pos:bf[0],m:bf[1],f:f[1]||""};
  }
  return {b:key,pos:f[0],m:f[1],f:f[2]||""};
}
function has(pos,x){return pos.split(",").indexOf(x)>=0;}
var VOW="aeiou";
function rules(w){
  var c=[], L=w.length;
  function add(base,kind){if(base.length>=2)c.push([base,kind]);}
  function dbl(stem){var n=stem.length;return n>=3&&stem[n-1]===stem[n-2]&&VOW.indexOf(stem[n-1])<0?stem.slice(0,-1):null;}
  if(/ies$/.test(w))add(w.slice(0,-3)+"y","S");
  if(/s$/.test(w)&&!/ss$/.test(w))add(w.slice(0,-1),"S");
  if(/es$/.test(w))add(w.slice(0,-2),"S");
  if(/ied$/.test(w))add(w.slice(0,-3)+"y","ED");
  if(/ed$/.test(w)){var s=w.slice(0,-2);add(s,"ED");add(w.slice(0,-1),"ED");var d=dbl(s);if(d)add(d,"ED");}
  if(/ing$/.test(w)){var s2=w.slice(0,-3);add(s2,"ING");add(s2+"e","ING");var d2=dbl(s2);if(d2)add(d2,"ING");if(/y$/.test(s2))add(s2.slice(0,-1)+"ie","ING");}
  if(/ier$/.test(w))add(w.slice(0,-3)+"y","ER");
  if(/er$/.test(w)){var s3=w.slice(0,-2);add(s3,"ER");add(w.slice(0,-1),"ER");var d3=dbl(s3);if(d3)add(d3,"ER");}
  if(/iest$/.test(w))add(w.slice(0,-4)+"y","EST");
  if(/est$/.test(w)){var s4=w.slice(0,-3);add(s4,"EST");add(w.slice(0,-2),"EST");var d4=dbl(s4);if(d4)add(d4,"EST");}
  return c;
}
function resolveWord(D, tok){
  var w = tok.toLowerCase().replace(/’/g,"'");
  var r = parseEntry(D,w);
  if(r) return r;
  if(/^\d+(\.\d+)?$/.test(w)) return {b:tok,pos:"num",m:"숫자 "+tok,f:""};
  if(/'s$/.test(w)){var p=resolveWord(D,w.slice(0,-2)); if(p) return {b:p.b,pos:p.pos,m:p.m,f:(p.f?p.f+", ":"")+"소유격('s: ~의)"};}
  if(/s'$/.test(w)){var p2=resolveWord(D,w.slice(0,-1)); if(p2) return {b:p2.b,pos:p2.pos,m:p2.m,f:"복수형 소유격(~들의)"};}
  var cs=rules(w);
  for(var i=0;i<cs.length;i++){
    var base=cs[i][0], kind=cs[i][1], e=parseEntry(D,base);
    if(!e||e.b!==base) continue;
    var pos=e.pos, f=null;
    if(kind==="S"){ if(has(pos,"n")&&has(pos,"v")) f="복수형 / 3인칭 단수 현재형"; else if(has(pos,"n")) f="복수형"; else if(has(pos,"v")) f="3인칭 단수 현재형"; }
    else if(kind==="ED"&&has(pos,"v")) f="과거형 · 과거분사";
    else if(kind==="ING"&&has(pos,"v")) f="-ing형 (현재분사 · 동명사)";
    else if(kind==="ER"&&has(pos,"a")) f="비교급";
    else if(kind==="EST"&&has(pos,"a")) f="최상급";
    if(f) return {b:base,pos:pos,m:e.m,f:f};
  }
  if(w.indexOf("-")>0){
    var parts=w.split("-"), ms=[];
    for(var j=0;j<parts.length;j++){var q=resolveWord(D,parts[j]); if(!q) return null; ms.push(parts[j]+"("+q.m.split(";")[0]+")");}
    return {b:w,pos:"a",m:ms.join(" + "),f:"하이픈 연결어"};
  }
  return null;
}
var TOKEN_RE=/(\{\d+\})|([A-Za-z0-9]+(?:[-'’][A-Za-z0-9]+)*'?)|([^A-Za-z0-9{]+)/g;

tudying.","그녀는 매우 가난해서 가끔 먹을 것이 충분하지 않았지만 공부를 결코 멈추지 않았다."],["With her husband, Pierre, she discovered two new elements.","남편 피에르와 함께 그녀는 두 가지 새로운 원소를 발견했다."],["She became the first woman to {2} a Nobel Prize.","그녀는 노벨상을 받은 최초의 여성이 되었다."],["Later, she won a second Nobel Prize in a different field.","나중에 그녀는 다른 분야에서 두 번째 노벨상을 받았다."],["Her hard work opened the door for many women {3} wanted to become scientists.","그녀의 노력은 과학자가 되고 싶어 하는 많은 여성들에게 문을 열어 주었다."]],"b":[[["to","for","so"],0,"'~하기 위해'라는 목적을 나타내는 to부정사의 to입니다."],[["win","won","winning"],0,"the first woman to + 동사원형은 '~한 최초의 여성'이므로 동사원형 win입니다."],[["who","what","where"],0,"사람(women)을 꾸미며 뒤에 동사 wanted가 오므로 주격 관계대명사 who입니다."]],"g":[["stop + 동명사 vs. stop + to부정사","She never stopped studying.","stop -ing는 '~하는 것을 멈추다', stop to ~는 '~하기 위해 멈추다'입니다.","He stopped to buy water."],["주격 관계대명사 who","many women who wanted to become scientists","who가 사람 선행사를 꾸미며 관계사절의 주어 역할을 합니다. 관계사절 동사의 수는 선행사에 맞춥니다.","I know a boy who speaks three languages."]],"k":[["scientist","She wants to be a scientist.","그녀는 과학자가 되고 싶어 한다."],["university","My sister goes to university.","언니는 대학에 다닌다."],["discover","Columbus discovered America.","콜럼버스는 아메리카를 발견했다."],["element","Gold is an element.","금은 원소다."],["field","He works in the field of art.","그는 예술 분야에서 일한다."]],"c":{"field":"분야","door":"(기회의) 문"}},{"id":6,"lv":"하","type":"p","topic":"음식","title":"How to Make Kimchi Fried Rice","s":[["Kimchi fried rice is easy and delicious.","김치볶음밥은 쉽고 맛있다."],["You need rice, kimchi, an onion, an egg, and some oil.","밥, 김치, 양파, 달걀, 그리고 기름이 조금 필요하다."],["First, cut the kimchi and the onion into small pieces.","먼저 김치와 양파를 작게 썬다."],["Next, put some oil in a pan and heat it.","다음으로 팬에 기름을 조금 두르고 달군다."],["Fry the kimchi and onion for three minutes.","김치와 양파를 3분 동안 볶는다."],["Then add the rice and mix everything {1}.","그런 다음 밥을 넣고 모든 것을 잘 섞는다."],["In another pan, fry an egg.","다른 팬에 달걀을 하나 부친다."],["Finally, put the egg {2} the rice.","마지막으로 달걀을 밥 위에 올린다."],["Now your 사원형","We were not allowed to take pictures inside.","be allowed to ~는 '~하는 것이 허락되다'라는 수동 표현입니다. not을 붙이면 금지의 뜻이 됩니다.","Students are allowed to use the gym."],["full of + 명사","It was a day full of learning.","full of ~는 '~로 가득한'이라는 뜻입니다. 명사 뒤에서 그 명사를 꾸밀 수 있습니다.","The box is full of toys."]],"k":[["field trip","We went on a field trip to a farm.","우리는 농장으로 현장 학습을 갔다."],["arrive","The train arrived late.","기차가 늦게 도착했다."],["crown","The queen wore a crown.","여왕은 왕관을 썼다."],["workshop","I joined a cooking workshop.","나는 요리 체험 수업에 참여했다."],["pottery","She makes pottery.","그녀는 도자기를 만든다."]],"c":{"item":"유물, 물품","showed":"show around = ~을 둘러보도록 안내하다"}},{"id":8,"lv":"하","type":"d","topic":"전화","title":"A Phone Call","s":[["Jisu","Hello? This is Jisu. Can I speak to Ben?","여보세요? 저 지수예요. 벤이랑 통화할 수 있을까요?"],["Ben","Hi, Jisu. It's me. What's up?","안녕, 지수야. 나야. 무슨 일이야?"],["Jisu","Are you free this Saturday?","이번 토요일에 시간 있어?"],["Ben","Yes, I am. Why?","응, 있어. 왜?"],["Jisu","{1} go to the new science museum?","새로 생긴 과학관에 가는 게 어때?"],["Ben","That sounds great! What time should we meet?","좋아! 몇 시에 만날까?"],["Jisu","Let's meet at ten in front of the museum.","10시에 과학관 앞에서 만나자."],["Ben","Okay. Can my sister come, too?","알았어. 내 여동생도 같이 가도 돼?"],["Jisu","{2} The more, the better.","물론이지. 많을수록 좋지."],["Ben","Great. See you then!","좋아. 그때 보자!"]],"b":[[["Why don't we","What do you","How was it"],0,"Why don't we + 동사원형?은 '우리 ~하는 게 어때?'라는 제안 표현입니다."],[["Of course.","No, she can't.","I don't know."],0,"'많을수록 좋다'는 말이 이어지므로 허락하는 Of course.가 알맞습니다."]],"g":[["제안하기 Why don't we ~? / Let's ~","Why don't we go to the new science museum?","Why don't we + 동사원형?과 Let's + 동사원형은 '~하자'는 제안입니다. 대답은 That sounds great. / Sorry, I can't. 등으로 합니다.","Why don't we play soccer after school?"],["전화 표현 This is ~","Hello? This is Jisu.","전화로 자기를 소개할 때는 I am이 아니라 This is + 이름을 씁니다. '~와 통화할 수 있나요?'는 Can I speak to ~?입니다.","Hello, this is Minho. Can I speak to Sora?"]],"k":[["free","Are you free tonight?","오늘 밤 시간 있니?"],["museum","The museum opens at nine.","그 박물관은 9시에 연다."],["sound","Your plan sounds good.","네 계획 좋은 것 같아."],["in front of","Wait in front of the gate.","정문 앞에서 기다려."],["meet","Nice to meet you.","만나서 반가워."]],"c":{"up":"What's up? = 무슨 일이야?, 잘 지내?"}},{"id":9,"lv":"상","type":"p","topic":"학교","title":"Should Homework Be Banned?","s":[["In some countries, schools have stopped giving homework to young students.","일부 나라의 학교들은 어린 학생들에게 숙제를 내주는 것을 중단했다."],["People who support this idea say that students already spend enough time studying at school.","이 생각을 지지하는 사람들은 학생들이 이미 학교에서 충분한 시간을 공부하며 보낸다고 말한다."],["They believe that children need free time to play, rest, and spend time with their families.","그들은 아이들이 놀고, 쉬고, 가족과 시간을 보낼 자유 시간이 필요하다고 믿는다."],["Too much homework can also cause stress and make students {1} interested in learning.","너무 많은 숙제는 스트레스를 유발하고 학생들이 배움에 흥미를 덜 갖게 만들 수도 있다."],["On the other hand, many teachers think that homework is necessary.","반면에 많은 교사들은 숙제가 필요하다고 생각한다."],["It gives students a chance to review {2} they learned in class.","숙제는 학생들에게 수업 시간에 배운 것을 복습할 기회를 준다."],["It also teaches them how to manage their time and work {3}.","숙제는 또한 그들에게 시간을 관리하고 혼자 공부하는 법을 가르쳐 준다."],["Perhaps the answer is not to ban homework completely but to give less of it and make it more meaningful.","아마도 정답은 숙제를 완전히 없애는 것이 아니라 양을 줄이고 더 의미 있게 만드는 것일지도 모른다."],["What kind of homework do you think is the most helpful?","당신은 어떤 종류의 숙제가 가장 도움이 된다고 생각하는가?"]],"b":[[["less","more","most"],0,"스트레스 때문에 흥미를 '덜(less)' 갖게 된다는 뜻입니다."],[["what","that","which"],0,"선행사가 없고 '~하는 것'이라는 뜻이므로 관계대명사 what입니다."],[["independently","together","noisily"],0,"시간 관리와 함께 '혼자서(independently)' 공부하는 법을 배운다는 뜻입니다."]],"g":[["관계대명사 what","It gives students a chance to review what they learned in class.","what은 선행사를 포함하여 '~하는 것'이라는 뜻의 명사절을 이끕니다.","I can't believe what he said."],["not A but B","The answer is not to ban homework completely but to give less of it.","not A but B는 'A가 아니라 B'라는 뜻입니다. A와 B는 같은 형태로 씁니다.","He is not a doctor but a nurse."]],"k":[["ban","Smoking is banned here.","이곳은 흡연이 금지되어 있다."],["support","I support your decision.","나는 네 결정을 지지해."],["necessary","Sleep is necessary for health.","잠은 건강에 필요하다."],["review","Review your notes before the test.","시험 전에 노트를 복습해라."],["manage","She manages her time well.","그녀는 시간 관리를 잘한다."]],"c":{"chance":"기회","less":"더 적은 양 (less of it = 숙제를 더 적게)"}},{"id":10,"lv":"중","type":"p","topic":"학교","title":"Joining the School Band","s":[["In March, I saw a poster for the school band.","3월에 나는 학교 밴드 포스터를 보았다."],["I wanted to join it, but I was afraid because I could not play any instruments.","나는 들어가고 싶었지만 악기를 하나도 다룰 줄 몰라서 두려웠다."],["My friend Dami said, \"Don't worry. They teach beginners, too.\"","친구 다미가 \"걱정하지 마. 초보자도 가르쳐 줘.\"라고 말했다."],["So I decided {1} the drums.","그래서 나는 드럼을 배우기로 결심했다."],["At first, keeping the beat was really hard.","처음에는 박자를 맞추는 것이 정말 어려웠다."],["My arms hurt after practice, and I often made mistakes.","연습 후에는 팔이 아팠고 자주 실수를 했다."],["However, our band leader was kind and {2}.","하지만 우리 밴드 리더는 친절하고 잘 도와주었다."],["She showed me easy ways to practice.","그녀는 쉬운 연습 방법을 알려 주었다."],["After three months, I played in the school festival with the band.","석 달 뒤 나는 밴드와 함께 학교 축제에서 공연했다."],["When the audience clapped, I felt very {3} of myself.","관객이 박수를 쳤을 때 나는 내 자신이 무척 자랑스러웠다."],["Trying something new is scary, but it is worth it.","새로운 것을 시도하는 건 무섭지만 그만한 가치가 있다."]],"b":[[["learning","to learn","learn"],1,"decide는 to부정사를 목적어로 취하므로 to learn입니다."],[["helpful","careless","lazy"],0,"쉬운 연습 방법을 알려 주었으므로 '도움이 되는(helpful)'이 알맞습니다."],[["proud","afraid","tired"],0,"be/feel proud of ~는 '~을 자랑스러워하다'라는 뜻입니다."]],"g":[["동명사 주어","Trying something new is scary.","동사-ing가 문장 맨 앞에서 '~하는 것은'이라는 주어 역할을 합니다. 동명사 주어는 단수 취급하므로 is를 씁니다.","Reading books is my hobby."],["접속사 because","I was afraid because I could not play any instruments.","because + 주어 + 동사는 '~ 때문에'라는 이유를 나타냅니다. because of 뒤에는 명사가 옵니다.","I stayed home because I was sick."]],"k":[["instrument","Can you play an instrument?","악기 하나 연주할 수 있니?"],["beginner","This class is for beginners.","이 수업은 초보자용이다."],["mistake","Everyone makes mistakes.","누구나 실수를 한다."],["audience","The audience laughed.","관객이 웃었다."],["worth","The movie is worth watching.","그 영화는 볼 만하다."]],"c":{"beat":"(음악의) 박자"}},{"id":11,"lv":"중","type":"p","topic":"과학","title":"Earthquakes","s":[["An earthquake is a sudden shaking of the ground.","지진은 땅이 갑자기 흔들리는 것이다."],["The Earth's surface is made up of large pieces called plates.","지구의 표면은 판이라고 불리는 큰 조각들로 이루어져 있다."],["These plates move very slowly, about a few centimeters a year.","이 판들은 1년에 몇 센티미터 정도로 아주 천천히 움직인다."],["Sometimes they get stuck and then suddenly {1}.","때때로 판들이 걸려 있다가 갑자기 미끄러진다."],["This sends strong waves through the ground and causes an earthquake.","이것이 땅을 통해 강한 파동을 보내 지진을 일으킨다."],["If an earthquake happens, you should stay calm.","지진이 일어나면 침착함을 유지해야 한다."],["Get under a strong table and hold on to it {2} your head is protected.","튼튼한 탁자 밑으로 들어가 머리가 보호되도록 탁자를 꽉 잡아라."],["Stay away from windows because the glass can break.","유리가 깨질 수 있으니 창문에서 멀리 떨어져라."],["When the shaking stops, go outside carefully and move to an open area.","흔들림이 멈추면 조심해서 밖으로 나가 넓은 곳으로 이동해라."],["Don't use the elevator. Use the {3} instead.","엘리베이터를 타지 말고 대신 계단을 이용해라."]],"b":[[["slip","sleep","sing"],0,"걸려 있던 판이 갑자기 '미끄러진다(slip)'는 내용입니다."],[["so that","even though","as soon as"],0,"머리가 보호되'도록' 하라는 목적이므로 so that입니다."],[["stairs","window","roof"],0,"엘리베이터 대신 '계단(stairs)'을 이용합니다."]],"g":[["be made up of ~","The Earth's surface is made up of large pieces called plates.","be made up of ~는 '~로 구성되어 있다'라는 뜻입니다. called plates는 '판이라고 불리는'으로 앞 명사를 꾸밉니다.","Our class is made up of 25 students."],["조동사 should로 행동 요령 말하기","If an earthquake happens, you should stay calm.","should + 동사원형으로 해야 할 일을 조언합니다. 부정은 should not(shouldn't)입니다.","You shouldn't run in the hallway."]],"k":[["sudden","There was a sudden noise.","갑자기 소리가 났다."],["stuck","The door is stuck.","문이 꽉 끼어 안 열린다."],["cause","Smoking causes cancer.","흡연은 암을 일으킨다."],["calm","Stay calm and listen.","침착하게 들어라."],["hold on to","Hold on to the rope.","밧줄을 꽉 잡아."]],"c":{"plates":"(지각) 판","waves":"(지진) 파동","area":"장소, 지역"}},{"id":12,"lv":"상","type":"p","topic":"이야기","title":"The Gift of the Magi","s":[["Della and Jim were a young couple who loved each other very much, but they were very poor.","델라와 짐은 서로를 무척 사랑하는 젊은 부부였지만 매우 가난했다."],["The day before Christmas, Della had only one dollar and eighty-seven cents.","크리스마스 전날, 델라에게는 1달러 87센트밖에 없었다."],["She wanted to buy Jim a chain for his gold watch, which was his most {1} possession.","그녀는 짐이 가장 아끼는 소유물인 금시계에 달 줄을 사 주고 싶었다."],["So she went to a shop and sold her beautiful long hair, which she was very proud of.","그래서 그녀는 가게에 가서 자신이 무척 자랑스러워하던 아름다운 긴 머리카락을 팔았다."],["With the money, she bought a fine chain.","그 돈으로 그녀는 멋진 시곗줄을 샀다."],["When Jim came home that evening, he stared at her short hair {2} saying a word.","그날 저녁 집에 온 짐은 한마디도 하지 않은 채 그녀의 짧은 머리를 바라보았다."],["Then he gave her his present: a set of beautiful combs for her long hair.","그러고 나서 그는 그녀에게 선물을 주었는데, 그것은 그녀의 긴 머리를 위한 아름다운 빗 한 세트였다."],["He had sold his watch to buy {3}.","그는 그 빗들을 사기 위해 자신의 시계를 팔았던 것이다."],["Their gifts were useless now, but they realized that their love was more valuable than anything they owned.","그들의 선물은 이제 쓸모없었지만, 그들은 자신들의 사랑이 그들이 가진 어떤 것보다도 더 소중하다는 것을 깨달았다."]],"b":[[["precious","cheap","broken"],0,"짐이 가장 '소중히 여기는(precious)' 소유물이라는 뜻입니다."],[["without","with","by"],0,"without -ing는 '~하지 않은 채로'라는 뜻입니다."],[["them","it","her"],0,"앞의 combs(복수)를 가리키므로 them입니다."]],"g":[["과거완료 had + p.p.","He had sold his watch to buy them.","had + 과거분사는 과거의 어느 시점(선물을 준 때)보다 더 이전에 일어난 일을 나타냅니다.","When I arrived, the movie had already started."],["비교급 + than anything","Their love was more valuable than anything they owned.","비교급 + than anything (else)는 '그 무엇보다도 더 ~한'이라는 뜻으로 최상급의 의미를 나타냅니다.","Health is more important than anything else."]],"k":[["couple","The couple got married last year.","그 부부는 작년에 결혼했다."],["possession","This ring is my most valuable possession.","이 반지는 나의 가장 소중한 소유물이다."],["stare","Don't stare at people.","사람들을 빤히 쳐다보지 마라."],["comb","She brushed her hair with a comb.","그녀는 빗으로 머리를 빗었다."],["valuable","Time is valuable.","시간은 소중하다."]],"c":{"fine":"좋은, 멋진","chain":"(시계) 줄","magi":"동방 박사들 (책 제목)"}},{"id":13,"lv":"상","type":"p","topic":"건강","title":"Smartphones and Your Eyes","s":[["Teenagers today spend an average of seven hours a day looking at screens.","오늘날 십 대들은 하루 평균 7시간을 화면을 보며 보낸다."],["This has caused a big increase in the number of young people who are nearsighted, which means they cannot see things that are far away {1}.","이로 인해 근시인 젊은이들의 수가 크게 늘었는데, 근시란 멀리 있는 것을 또렷하게 보지 못하는 것을 뜻한다."],["When you look at a phone for a long time, your eyes have to work harder than usual, and you blink less.","휴대폰을 오래 보면 눈은 평소보다 더 열심히 일해야 하고, 눈을 덜 깜빡이게 된다."],["As a result, your eyes may feel dry, tired, or even {2}.","그 결과 눈이 건조하거나 피곤하거나 심지어 아플 수도 있다."],["Eye doctors recommend following the \"20-20-20 rule.\"","안과 의사들은 '20-20-20 규칙'을 따르라고 권한다."],["Every twenty minutes, look at something twenty feet away for twenty seconds.","20분마다 20피트(약 6미터) 떨어진 것을 20초 동안 바라보아라."],["This gives your eye muscles a chance to {3}.","이것은 눈 근육에 쉴 기회를 준다."],["Spending time outdoors is also helpful, because natural light is good for children's developing eyes.","야외에서 시간을 보내는 것도 도움이 되는데, 자연광이 성장 중인 아이들의 눈에 좋기 때문이다."],["Your eyes are precious, so take care of them before it's too late.","눈은 소중하니 너무 늦기 전에 잘 돌보아라."]],"b":[[["clearly","darkly","loudly"],0,"멀리 있는 것을 '또렷하게(clearly)' 보지 못하는 것이 근시입니다."],[["painful","bright","happy"],0,"건조하고 피곤한 것보다 더 심한 증상인 '아픈(painful)'이 알맞습니다."],[["relax","work","close"],0,"눈 근육에 '쉴(relax)' 기회를 준다는 뜻입니다."]],"g":[["spend + 시간 + -ing","Teenagers spend an average of seven hours a day looking at screens.","spend + 시간 + -ing는 '~하는 데 시간을 보내다'입니다. Spending time outdoors처럼 동명사가 주어가 될 수도 있습니다.","He spends his weekends playing soccer."],["recommend + 동명사","Eye doctors recommend following the 20-20-20 rule.","recommend, suggest, enjoy 등은 동명사를 목적어로 취합니다.","I recommend reading this book."]],"k":[["average","The average age is fifteen.","평균 나이는 15세다."],["increase","There was an increase in prices.","가격이 올랐다."],["nearsighted","I'm nearsighted, so I wear glasses.","나는 근시라서 안경을 쓴다."],["blink","Don't blink!","눈 깜빡이지 마!"],["precious","Time with family is precious.","가족과의 시간은 소중하다."]],"c":{"feet":"피트 (길이 단위, 1피트 = 약 30cm)","developing":"성장 중인, 발달 중인"}},{"id":14,"lv":"상","type":"p","topic":"과학","title":"The Secret of Honey","s":[["Did you know that honey never goes bad?","꿀이 절대 상하지 않는다는 것을 알고 있었는가?"],["Archaeologists have found pots of honey in ancient Egyptian tombs that are more than 3,000 years old.","고고학자들은 3천 년이 넘은 고대 이집트 무덤에서 꿀단지를 발견했다."],["Surprisingly, the honey was still {1} to eat.","놀랍게도 그 꿀은 여전히 먹어도 안전했다."],["Why does honey last so long?","꿀은 왜 그렇게 오래갈까?"],["First, honey contains very little water.","첫째, 꿀은 수분을 아주 조금만 포함하고 있다."],["Bacteria need water to grow, so they cannot survive in honey.","세균은 자라기 위해 물이 필요해서 꿀 속에서는 살아남을 수 없다."],["Second, honey is {2} acidic, which makes it even harder for germs to live.","둘째, 꿀은 꽤 산성이어서 세균이 살기가 훨씬 더 어렵다."],["Finally, bees add a special substance to the nectar they collect.","마지막으로 벌은 자신이 모은 꿀에 특별한 물질을 더한다."],["This substance produces a tiny amount of hydrogen peroxide, which kills bacteria.","이 물질은 아주 적은 양의 과산화수소를 만들어 내는데, 그것이 세균을 죽인다."],["Because of these qualities, honey has been used as medicine for thousands of years.","이런 특성 때문에 꿀은 수천 년 동안 약으로 사용되어 왔다."],["People put it on cuts to help them {3} faster.","사람들은 상처가 더 빨리 낫도록 상처에 꿀을 발랐다."],["However, you should keep the lid closed, or the honey will absorb water from the air.","하지만 뚜껑은 닫아 두어야 한다. 그렇지 않으면 꿀이 공기 중의 수분을 흡수할 것이다."]],"b":[[["safe","dangerous","hard"],0,"오래되었지만 '여전히 먹어도 안전했다'는 뜻이므로 safe입니다."],[["quite","never","hardly"],0,"꿀이 '꽤(quite)' 산성이라는 뜻이 자연스럽습니다. hardly는 '거의 ~않다'라는 부정의 뜻입니다."],[["heal","hurt","bleed"],0,"상처가 더 빨리 '낫도록(heal)' 바른 것입니다."]],"g":[["계속적 용법 관계대명사 , which (앞 문장 전체)","Honey is quite acidic, which makes it even harder for germs to live.","쉼표 뒤의 which는 앞 문장 전체를 받아 '그리고 그것은 ~'이라고 덧붙여 설명할 수 있습니다.","He passed the test, which made his mom happy."],["명령문/조언 + or ~","Keep the lid closed, or the honey will absorb water.","명령문(조언) + or + 주어 + will ~은 '~해라, 그렇지 않으면 …할 것이다'라는 뜻입니다.","Wear a coat, or you will catch a cold."]],"k":[["ancient","We studied ancient Rome.","우리는 고대 로마를 공부했다."],["contain","This drink contains sugar.","이 음료에는 설탕이 들어 있다."],["survive","Plants can't survive without water.","식물은 물 없이 살아남을 수 없다."],["substance","Water is a common substance.","물은 흔한 물질이다."],["absorb","Sponges absorb water.","스펀지는 물을 흡수한다."]],"c":{"goes":"go bad = (음식이) 상하다","last":"오래가다, 지속되다","cuts":"베인 상처","qualities":"특성, 성질"}},{"id":15,"lv":"상","type":"d","topic":"병원","title":"A Sprained Ankle","s":[["Doctor","Hello, Yejin. What happened to your ankle?","안녕, 예진아. 발목이 어떻게 된 거니?"],["Yejin","I twisted it while I was playing basketball yesterday.","어제 농구하다가 삐었어요."],["Doctor","Let me see. Does it hurt when I press here?","어디 보자. 여기 누르면 아프니?"],["Yejin","Ouch! Yes, it hurts a lot. Is it broken?","아야! 네, 많이 아파요. 부러졌나요?"],["Doctor","I don't think so. The X-ray shows that your bone is fine. You've just {1} your ankle.","그렇지 않은 것 같아. 엑스레이를 보니 뼈는 괜찮아. 발목을 삔 것뿐이야."],["Yejin","That's a relief. How long will it take to get better?","다행이네요. 낫는 데 얼마나 걸릴까요?"],["Doctor","It should heal in about two weeks if you rest it well.","잘 쉬면 2주 정도면 나을 거야."],["Yejin","Two weeks? But we have an important game next Saturday.","2주요? 하지만 다음 주 토요일에 중요한 경기가 있어요."],["Doctor","I'm afraid you can't play in it. If you play too {2}, it could get worse.","안타깝지만 그 경기는 못 뛰어. 너무 빨리 뛰면 더 나빠질 수 있어."],["Yejin","I understand. What should I do in the meantime?","알겠어요. 그동안 뭘 해야 하나요?"],["Doctor","Put ice on it for twenty minutes several times a day, and keep your foot {3} when you sit.","하루에 여러 번 20분씩 얼음찜질을 하고, 앉을 때는 발을 높이 올려 두렴."],["Yejin","Okay. {4} I'll follow your advice.","알겠습니다. 감사해요. 말씀대로 할게요."]],"b":[[["sprained","broken","cleaned"],0,"뼈는 괜찮고 발목을 '삔(sprained)' 것입니다. 현재완료 have p.p.로 씁니다."],[["soon","late","slowly"],0,"다 낫기 전에 '너무 일찍(too soon)' 뛰면 악화될 수 있다는 뜻입니다."],[["raised","lowered","wet"],0,"부기를 줄이기 위해 발을 '높이 올려(raised)' 두라는 조언입니다."],[["Thank you, doctor.","That's not fair.","I don't care."],0,"조언에 감사하는 Thank you, doctor.가 알맞습니다."]],"g":[["현재완료 완료 have just p.p.","You've just sprained your ankle.","have + just + 과거분사는 '막 ~했다' 또는 '(단지) ~한 것뿐이다'라는 완료의 뜻입니다.","I have just finished my homework."],["keep + 목적어 + 과거분사","Keep your foot raised when you sit.","keep A + 과거분사는 'A를 ~된 상태로 유지하다'라는 뜻입니다. 발이 '올려진' 상태이므로 raised를 씁니다.","Keep the door locked."]],"k":[["ankle","She hurt her ankle.","그녀는 발목을 다쳤다."],["twist","I twisted my wrist.","나는 손목을 삐었다."],["press","Press the button.","버튼을 눌러라."],["bone","Milk is good for your bones.","우유는 뼈에 좋다."],["in the meantime","In the meantime, please wait here.","그동안 여기서 기다려 주세요."]],"c":{"rest":"(다친 곳을) 쉬게 하다","get":"get worse = 악화되다, get better = 나아지다"}},{"id":16,"lv":"중","type":"p","topic":"과학","title":"Robots in Our Lives","s":[["Robots are no longer only in science fiction movies.","로봇은 더 이상 공상 과학 영화 속에만 있지 않다."],["They are already a part of our daily lives.","로봇은 이미 우리 일상의 일부이다."],["Robot vacuum cleaners clean our floors while we are out.","로봇 청소기는 우리가 외출한 동안 바닥을 청소한다."],["In some restaurants, robots {1} food to customers.","어떤 식당에서는 로봇이 손님에게 음식을 가져다준다."],["In hospitals, robots help doctors perform difficult operations.","병원에서는 로봇이 의사들의 어려운 수술을 돕는다."],["Robots are also used in places that are too dangerous {2} people, like deep oceans or space.","로봇은 깊은 바다나 우주처럼 사람에게 너무 위험한 곳에서도 사용된다."],["However, some people worry that robots will take away human jobs.","하지만 어떤 사람들은 로봇이 인간의 일자리를 빼앗을까 봐 걱정한다."],["Others believe robots will create new kinds of jobs.","다른 사람들은 로봇이 새로운 종류의 일자리를 만들 것이라고 믿는다."],["One thing is {3}.","한 가지는 확실하다."],["Robots will play a bigger role in the future.","로봇은 미래에 더 큰 역할을 할 것이다."]],"b":[[["serve","eat","cook"],0,"로봇이 손님에게 음식을 '서빙한다(serve)'는 뜻입니다."],[["for","to","with"],0,"too dangerous for + 사람은 '~에게 너무 위험한'입니다."],[["certain","wrong","boring"],0,"'한 가지는 확실하다'는 뜻이므로 certain입니다."]],"g":[["no longer","Robots are no longer only in science fiction movies.","no longer는 '더 이상 ~이 아니다'라는 뜻으로 be동사 뒤, 일반동사 앞에 옵니다.","He no longer lives here."],["Some ~, Others ...","Some people worry ... Others believe ...","Some ~, others ...는 '어떤 사람들은 ~하고, 다른 사람들은 …하다'라고 여러 의견을 나눌 때 씁니다.","Some like summer. Others like winter."]],"k":[["fiction","I like science fiction.","나는 공상 과학을 좋아한다."],["daily","Exercise is part of my daily life.","운동은 내 일상의 일부다."],["customer","The customer is always right.","손님은 항상 옳다."],["operation","The operation was successful.","수술은 성공적이었다."],["role","She played the main role.","그녀는 주인공 역할을 했다."]],"c":{"out":"외출한","perform":"(수술을) 하다, 수행하다"}},{"id":17,"lv":"하","type":"p","topic":"음식","title":"Bibimbap","s":[["Bibimbap is a famous Korean dish.","비빔밥은 유명한 한국 요리이다."],["The word means \"mixed rice.\"","이 말은 '섞은 밥'이라는 뜻이다."],["It has rice and many kinds of vegetables, like carrots, spinach, and bean sprouts.","비빔밥에는 밥과 당근, 시금치, 콩나물 같은 여러 종류의 채소가 들어간다."],["People often add an egg and some meat on top.","사람들은 흔히 위에 달걀과 고기를 조금 얹는다."],["Then they put in red pepper paste and {1} everything together.","그런 다음 고추장을 넣고 모든 것을 함께 비빈다."],["Bibimbap is colorful and good for your {2}.","비빔밥은 색이 화려하고 건강에 좋다."],["Many foreigners love it, too.","많은 외국인들도 비빔밥을 좋아한다."],["Have you ever tried it?","먹어 본 적이 있는가?"]],"b":[[["mix","fry","cut"],0,"'섞은 밥'이라는 이름처럼 모든 것을 '섞는다(mix)'가 알맞습니다."],[["health","healthy","healthily"],0,"good for 뒤에는 명사가 오므로 health입니다."]],"g":[["현재완료 경험 Have you ever ~?","Have you ever tried it?","Have you ever + 과거분사?는 '~해 본 적 있니?'라는 경험을 묻습니다.","Have you ever been to Jeju?"],["like (예를 들어)","many kinds of vegetables, like carrots, spinach, and bean sprouts","명사 뒤의 like는 '~ 같은'이라는 뜻으로 예를 들 때 씁니다.","I like fruits like apples and grapes."]],"k":[["famous","He is a famous singer.","그는 유명한 가수다."],["dish","This dish is spicy.","이 요리는 맵다."],["kind","What kind of music do you like?","어떤 종류의 음악을 좋아하니?"],["colorful","The garden is colorful.","정원이 알록달록하다."],["foreigner","Many foreigners visit Seoul.","많은 외국인이 서울을 방문한다."]],"c":{"like":"~ 같은 (예시)"}},{"id":18,"lv":"중","type":"p","topic":"환경","title":"Plastic in the Ocean","s":[["Every year, about eight million tons of plastic ends up in the ocean.","매년 약 800만 톤의 플라스틱이 결국 바다로 흘러간다."],["Plastic doesn't break down easily.","플라스틱은 쉽게 분해되지 않는다."],["A plastic bottle can stay in the sea for 450 years.","플라스틱 병 하나는 바다에서 450년 동안 남아 있을 수 있다."],["Over time, it breaks into tiny pieces {1} microplastics.","시간이 지나면서 그것은 미세 플라스틱이라고 불리는 아주 작은 조각으로 부서진다."],["Fish and sea birds often eat these pieces because they look like food.","물고기와 바닷새들은 이 조각들이 먹이처럼 보여서 자주 먹는다."],["Then the plastic can enter our bodies when we eat fish.","그러면 우리가 생선을 먹을 때 플라스틱이 우리 몸에 들어올 수 있다."],["To solve this problem, we need to use {2} plastic.","이 문제를 해결하기 위해 우리는 플라스틱을 덜 써야 한다."],["Carry your own bottle and shopping bag.","자신의 물병과 장바구니를 가지고 다녀라."],["Say no to plastic straws.","플라스틱 빨대를 거절해라."],["Also, {3} recycle plastic correctly.","또한 플라스틱을 꼭 올바르게 재활용해라."],["If we all work together, we can keep the ocean clean.","우리 모두가 함께 노력하면 바다를 깨끗하게 지킬 수 있다."]],"b":[[["called","calling","calls"],0,"'~라고 불리는'이라는 수동의 의미이므로 과거분사 called입니다."],[["less","more","many"],0,"문제를 해결하려면 플라스틱을 '덜(less)' 써야 합니다."],[["make sure to","forget to","stop to"],0,"make sure to ~는 '반드시 ~하다'라는 뜻입니다."]],"g":[["to부정사의 부사적 용법 (목적)","To solve this problem, we need to use less plastic.","문장 앞의 To + 동사원형은 '~하기 위해'라는 목적을 나타냅니다.","To stay healthy, I exercise every day."],["look like + 명사","They look like food.","look like + 명사는 '~처럼 보이다'입니다. look 뒤에 형용사가 오면 like를 쓰지 않습니다(look happy).","That cloud looks like a rabbit."]],"k":[["ocean","The Pacific is the biggest ocean.","태평양은 가장 큰 바다다."],["end up","He ended up staying home.","그는 결국 집에 있게 되었다."],["break down","Leaves break down in the soil.","잎은 흙에서 분해된다."],["straw","I drink juice with a straw.","나는 빨대로 주스를 마신다."],["recycle","We recycle paper and cans.","우리는 종이와 캔을 재활용한다."]],"c":{"ends":"end up = 결국 ~하게 되다","say":"say no to = ~을 거절하다"}},{"id":19,"lv":"상","type":"p","topic":"문화","title":"The Silk Road","s":[["Long before airplanes and the internet, people from East and West were connected by a network of trade routes called the Silk Road.","비행기와 인터넷이 생기기 훨씬 전, 동양과 서양 사람들은 실크로드라고 불리는 무역로 연결망으로 이어져 있었다."],["It stretched for more than 6,000 kilometers, from China to the Mediterranean Sea.","그 길은 중국에서 지중해까지 6천 킬로미터 넘게 뻗어 있었다."],["It got its name from Chinese silk, which was so valuable in Rome that only rich people could {1} it.","실크로드라는 이름은 중국 비단에서 왔는데, 비단은 로마에서 너무 귀해서 부자들만 살 수 있었다."],["Merchants traveled in groups with camels across deserts and mountains, which was both difficult and {2}.","상인들은 낙타와 함께 무리를 지어 사막과 산을 건넜는데, 이는 힘들고 위험한 일이었다."],["Besides silk, they traded spices, paper, glass, and horses.","비단 외에도 그들은 향신료, 종이, 유리, 말을 거래했다."],["However, the Silk Road was more than a road for goods.","하지만 실크로드는 물건을 위한 길 그 이상이었다."],["Religions, languages, and inventions such as paper making also {3} along it.","종교, 언어, 그리고 제지술 같은 발명품도 그 길을 따라 퍼져 나갔다."],["In this way, the Silk Road helped different cultures learn from each other, and its influence can still be seen today.","이런 방식으로 실크로드는 서로 다른 문화가 서로에게서 배우도록 도왔으며, 그 영향은 오늘날에도 여전히 볼 수 있다."]],"b":[[["afford","forget","throw"],0,"너무 비싸서 부자들만 '살 여유가 있었다(afford)'는 뜻입니다."],[["dangerous","boring","cheap"],0,"사막과 산을 건너는 일은 힘들고 '위험한(dangerous)' 일이었습니다."],[["spread","stopped","slept"],0,"종교, 언어, 발명품이 길을 따라 '퍼졌다(spread)'는 뜻입니다. spread는 과거형도 spread입니다."]],"g":[["조동사 수동태 can be seen","its influence can still be seen today","can + be + 과거분사는 '~될 수 있다'라는 뜻입니다. 영향이 '보이는' 대상이므로 수동태를 씁니다.","Stars can be seen at night."],["so ~ that 주어 could ...","so valuable in Rome that only rich people could afford it","so + 형용사 + that ~은 '너무 ~해서 …하다'입니다. 과거 문장에서는 could를 씁니다.","The box was so heavy that I couldn't lift it."]],"k":[["trade","The two countries trade oil.","두 나라는 석유를 거래한다."],["route","This is the fastest route.","이것이 가장 빠른 길이다."],["merchant","The merchant sold silk.","그 상인은 비단을 팔았다."],["spice","Pepper is a spice.","후추는 향신료다."],["influence","My dad has a big influence on me.","아빠는 나에게 큰 영향을 준다."]],"c":{"stretched":"(길이) 뻗어 있었다","goods":"상품, 물건","making":"paper making = 종이 만들기, 제지술"}},{"id":20,"lv":"상","type":"d","topic":"전화","title":"Calling About a Lost Wallet","s":[["Staff","Hello, City Bus Lost and Found. How can I help you?","안녕하세요, 시내버스 분실물 센터입니다. 무엇을 도와드릴까요?"],["Eunji","Hi. I think I left my wallet on the number 15 bus this morning.","안녕하세요. 오늘 아침 15번 버스에 지갑을 두고 내린 것 같아요."],["Staff","I'm sorry to hear that. Can you describe it?","안타깝네요. 어떻게 생겼는지 설명해 주시겠어요?"],["Eunji","It's a small brown leather wallet with a star-shaped key ring attached to it.","별 모양 열쇠고리가 달린 작은 갈색 가죽 지갑이에요."],["Staff","What was inside it?","안에 뭐가 들어 있었나요?"],["Eunji","My student ID card, a transportation card, and about twenty thousand won.","학생증, 교통 카드, 그리고 2만 원 정도요."],["Staff","What time did you {1} the bus?","몇 시에 버스에서 내리셨어요?"],["Eunji","Around 8:10, at the stop in front of Hanbit Middle School.","8시 10분쯤이요, 한빛중학교 앞 정류장에서요."],["Staff","Let me check our list. Good news! A wallet that {2} your description was turned in by the driver an hour ago.","목록을 확인해 볼게요. 좋은 소식이에요! 설명하신 것과 일치하는 지갑을 한 시간 전에 기사님이 맡기셨어요."],["Eunji","Really? That's such a relief! When can I pick it up?","정말요? 정말 다행이에요! 언제 찾으러 갈 수 있어요?"],["Staff","Our office is open until six. Please bring something that {3} your identity.","저희 사무실은 6시까지 열어요. 신분을 증명할 수 있는 것을 가져오세요."],["Eunji","{4} I'll be there after school.","알겠습니다. 방과 후에 갈게요."]],"b":[[["get off","get on","look at"],0,"버스에서 '내린' 시간을 묻는 것이므로 get off입니다."],[["matches","loses","breaks"],0,"설명과 '일치하는(matches)' 지갑이라는 뜻입니다."],[["proves","hides","forgets"],0,"신분을 '증명하는(proves)' 것을 가져오라는 뜻입니다."],[["I will.","I won't.","I didn't."],0,"가져오겠다고 답하는 I will.이 알맞습니다."]],"g":[["과거분사의 후치 수식 attached to","a wallet with a star-shaped key ring attached to it","attached to it은 '그것에 달린'이라는 뜻으로 key ring을 뒤에서 꾸밉니다. 열쇠고리가 '달린' 것이므로 과거분사를 씁니다.","I got a letter written in English."],["수동태 was turned in by","A wallet ... was turned in by the driver an hour ago.","turn in은 '제출하다, (분실물을) 맡기다'이며, 수동태 be turned in은 '맡겨지다'입니다. 구동사는 수동태에서도 함께 움직입니다.","The homework was handed in on time."]],"k":[["describe","Can you describe the man?","그 남자의 생김새를 설명할 수 있니?"],["leather","This bag is made of leather.","이 가방은 가죽으로 만들어졌다."],["transportation","Public transportation is cheap here.","이곳은 대중교통이 저렴하다."],["relief","What a relief!","정말 다행이다!"],["identity","Show me your ID to prove your identity.","신분 증명을 위해 신분증을 보여 주세요."]],"c":{"found":"Lost and Found = 분실물 보관소","id":"신분증 (ID card)","turned":"turn in = 맡기다, 제출하다"}},{"id":21,"lv":"하","type":"p","topic":"편지","title":"A Letter to My Teacher","s":[["Dear Mr. Lee,","이 선생님께,"],["I am writing to say thank you.","감사하다는 말씀을 드리려고 편지를 씁니다."],["Last year, I was not good at math.","작년에 저는 수학을 잘하지 못했어요."],["I often felt sad in math class.","수학 시간에 자주 슬펐어요."],["But you were always {1} with me.","하지만 선생님께서는 항상 저를 참을성 있게 대해 주셨어요."],["You explained the problems again and again.","문제를 몇 번이고 다시 설명해 주셨지요."],["Now I like math, and my grades are much {2}.","이제 저는 수학이 좋고, 성적도 훨씬 좋아졌어요."],["I want to be a math teacher like you someday.","저도 언젠가 선생님처럼 수학 선생님이 되고 싶어요."],["Please stay healthy.","건강하세요."],["Love,","사랑을 담아,"],["Yuna","유나 올림"]],"b":[[["patient","angry","busy"],0,"문제를 여러 번 설명해 주셨다는 내용이므로 '참을성 있는(patient)'이 알맞습니다."],[["worse","better","lower"],1,"수학이 좋아졌다는 흐름이므로 성적도 '더 좋아졌다(better)'가 맞습니다."]],"g":[["be good at ~","I was not good at math.","be good at + 명사/동명사는 '~을 잘하다'라는 뜻입니다. 부정은 be not good at입니다.","She is good at drawing."],["비교급 강조 much","My grades are much better.","much, a lot, even, far를 비교급 앞에 쓰면 '훨씬 더 ~한'이라는 뜻이 됩니다. very는 비교급을 꾸미지 못합니다.","This bag is much lighter than that one."]],"k":[["explain","Can you explain this word?","이 단어를 설명해 줄 수 있니?"],["problem","This problem is easy.","이 문제는 쉽다."],["grade","I got a good grade in English.","나는 영어에서 좋은 성적을 받았다."],["someday","I want to visit Paris someday.","나는 언젠가 파리에 가 보고 싶다."],["healthy","Eat vegetables to stay healthy.","건강을 유지하려면 채소를 먹어라."]],"c":{}},{"id":22,"lv":"상","type":"p","topic":"과학","title":"Why Do We Dream?","s":[["Every night, most people have several dreams, even if they don't remember them in the morning.","대부분의 사람들은 아침에 기억하지 못하더라도 매일 밤 여러 개의 꿈을 꾼다."],["Most dreams happen during a stage of sleep called REM, when our eyes move quickly under the eyelids.","대부분의 꿈은 렘(REM)이라고 불리는 수면 단계에서 일어나는데, 이때 우리의 눈은 눈꺼풀 아래에서 빠르게 움직인다."],["Scientists have been studying dreams for more than a hundred years, but they still don't know exactly why we have them.","과학자들은 백 년 넘게 꿈을 연구해 왔지만 우리가 왜 꿈을 꾸는지 아직 정확히 알지 못한다."],["One idea is that dreaming helps the brain {1} memories.","한 가지 견해는 꿈꾸는 것이 뇌가 기억을 정리하도록 돕는다는 것이다."],["While we sleep, the brain decides which information to keep and which to {2}.","잠자는 동안 뇌는 어떤 정보를 간직하고 어떤 정보를 버릴지 결정한다."],["Another idea is that dreams let us practice dealing with dangerous situations in a safe way.","또 다른 견해는 꿈이 우리로 하여금 위험한 상황에 대처하는 연습을 안전하게 하도록 해 준다는 것이다."],["That may be the reason why many people dream about being chased.","그것이 많은 사람들이 쫓기는 꿈을 꾸는 이유일지도 모른다."],["Some people can even control their dreams.","어떤 사람들은 꿈을 조종할 수도 있다."],["These are called lucid dreams, and they happen when the dreamer {3} that he or she is dreaming.","이것을 자각몽이라고 부르는데, 꿈꾸는 사람이 자신이 꿈을 꾸고 있다는 것을 알아차릴 때 일어난다."]],"b":[[["organize","destroy","copy"],0,"뇌가 기억을 '정리하도록(organize)' 돕는다는 뜻입니다."],[["throw away","pick up","take care of"],0,"keep(간직하다)과 반대되는 '버리다(throw away)'가 알맞습니다."],[["realizes","forgets","denies"],0,"자신이 꿈꾸고 있다는 것을 '알아차릴(realizes)' 때 자각몽이 됩니다."]],"g":[["현재완료진행 have been -ing","Scientists have been studying dreams for more than a hundred years.","have been + -ing는 과거에 시작해 지금까지 계속되고 있는 일을 나타냅니다.","It has been raining since morning."],["관계부사 why / when","the reason why many people dream about being chased","the reason why ~는 '~하는 이유'라는 뜻입니다. 앞 문장의 , when은 '그때 ~하다'라고 시간을 덧붙여 설명합니다.","Tell me the reason why you were late."]],"k":[["stage","We are in the first stage of the project.","우리는 프로젝트의 첫 단계에 있다."],["eyelid","My eyelids feel heavy.","눈꺼풀이 무겁다."],["exactly","That's exactly right.","바로 그거야."],["deal with","How do you deal with stress?","너는 스트레스를 어떻게 다루니?"],["chase","The dog chased the cat.","개가 고양이를 쫓았다."]],"c":{"rem":"렘수면 (Rapid Eye Movement, 눈이 빠르게 움직이는 수면 단계)","lucid":"명료한 (lucid dream = 자각몽)","idea":"(과학적) 견해, 생각"}},{"id":23,"lv":"상","type":"p","topic":"인물","title":"Lee Tae-seok, the Doctor of Sudan","s":[["Lee Tae-seok was a Korean doctor and priest who devoted his life to the people of Tonj, a poor village in South Sudan.","이태석은 가난한 남수단 마을인 톤즈의 사람들에게 일생을 바친 한국인 의사이자 신부였다."],["When he arrived there in 2001, there was no hospital, and many people were suffering from diseases that could easily be {1}.","그가 2001년 그곳에 도착했을 때 병원은 없었고, 많은 사람들이 쉽게 치료할 수 있는 병으로 고통받고 있었다."],["He built a small clinic with the help of the villagers and treated more than two hundred patients a day.","그는 마을 사람들의 도움으로 작은 진료소를 지었고 하루에 200명이 넘는 환자를 치료했다."],["He also built a school because he believed that education could change the children's future.","그는 교육이 아이들의 미래를 바꿀 수 있다고 믿었기 때문에 학교도 지었다."],["Knowing that the children loved music, he started a brass band, which soon became {2} throughout the country.","아이들이 음악을 좋아한다는 것을 알고 그는 브라스 밴드를 시작했는데, 그 밴드는 곧 전국적으로 유명해졌다."],["Sadly, he died of cancer in 2010 at the age of forty-eight.","슬프게도 그는 2010년 48세의 나이에 암으로 세상을 떠났다."],["However, his love has not been forgotten.","하지만 그의 사랑은 잊히지 않았다."],["Many of the children he taught have become doctors and teachers {3} now help others, just as he did.","그가 가르친 많은 아이들이 그가 그랬던 것처럼 지금 다른 사람을 돕는 의사와 교사가 되었다."]],"b":[[["cured","caused","spread"],0,"'쉽게 치료될(cured)' 수 있는 병이라는 수동의 뜻입니다."],[["famous","quiet","empty"],0,"밴드가 전국적으로 '유명해졌다(famous)'는 뜻입니다."],[["who","which","what"],0,"사람(doctors and teachers)을 꾸미는 주격 관계대명사 who입니다."]],"g":[["조동사 수동태 could be p.p.","diseases that could easily be cured","조동사 + be + 과거분사는 '~될 수 있다' 같은 수동의 뜻을 나타냅니다.","This problem can be solved easily."],["분사구문 Knowing that ~","Knowing that the children loved music, he started a brass band.","Knowing ~은 Because he knew ~를 줄인 분사구문으로 '~을 알았기 때문에'라는 이유를 나타냅니다.","Feeling tired, I went to bed early."]],"k":[["devote","She devoted her life to music.","그녀는 음악에 일생을 바쳤다."],["disease","Washing hands prevents disease.","손 씻기는 질병을 예방한다."],["clinic","The clinic opens at nine.","그 진료소는 9시에 문을 연다."],["treat","The doctor treated my cold.","의사가 내 감기를 치료했다."],["education","Education is important.","교육은 중요하다."]],"c":{"brass":"금관 악기 (brass band = 브라스 밴드)","priest":"신부, 사제","did":"(앞의 help others를 대신하는) 그랬다"}},{"id":24,"lv":"중","type":"p","topic":"인물","title":"Sejong the Great","s":[["King Sejong is one of the most respected kings in Korean history.","세종대왕은 한국 역사에서 가장 존경받는 왕 중 한 명이다."],["He ruled Joseon from 1418 to 1450.","그는 1418년부터 1450년까지 조선을 다스렸다."],["At that time, Koreans used Chinese characters to write.","그 당시 한국인들은 글을 쓰기 위해 한자를 사용했다."],["{1} Chinese characters were very difficult, most ordinary people could not read or write.","한자가 매우 어려웠기 때문에 대부분의 평범한 사람들은 읽거나 쓸 수 없었다."],["Sejong felt sorry for them.","세종은 그들을 안타깝게 여겼다."],["He worked with scholars and created Hangeul in 1443.","그는 학자들과 함께 일해 1443년에 한글을 만들었다."],["Hangeul is so easy that people can learn it in a few days.","한글은 너무 쉬워서 사람들이 며칠 만에 배울 수 있다."],["Sejong also {2} science.","세종은 과학에도 관심이 많았다."],["He supported inventors like Jang Yeong-sil, who made a rain gauge and a water clock.","그는 측우기와 물시계를 만든 장영실 같은 발명가들을 지원했다."],["Thanks to him, Koreans can {3} their thoughts easily today.","그 덕분에 오늘날 한국인들은 자신의 생각을 쉽게 표현할 수 있다."]],"b":[[["Because","Although","Before"],0,"한자가 어려웠던 것이 사람들이 읽고 쓰지 못한 이유이므로 Because입니다."],[["cared about","was bored with","was afraid of"],0,"과학자들을 지원했으므로 과학에 '관심을 가졌다(cared about)'가 알맞습니다."],[["express","hide","forget"],0,"한글 덕분에 생각을 쉽게 '표현할(express)' 수 있다는 뜻입니다."]],"g":[["one of the + 최상급 + 복수명사","one of the most respected kings","one of the + 최상급 + 복수명사는 '가장 ~한 … 중 하나'라는 뜻입니다. 명사는 반드시 복수형으로 씁니다.","She is one of the best players on the team."],["계속적 용법 관계대명사 , who","inventors like Jang Yeong-sil, who made a rain gauge","쉼표 뒤의 who는 앞의 사람에 대해 정보를 덧붙입니다. '그리고 그는 ~'으로 해석합니다.","I met Tom, who is my new neighbor."]],"k":[["respect","We respect our teachers.","우리는 선생님들을 존경한다."],["rule","The king ruled for 30 years.","그 왕은 30년 동안 다스렸다."],["ordinary","He was an ordinary boy.","그는 평범한 소년이었다."],["create","She created a new game.","그녀는 새 게임을 만들었다."],["inventor","Edison was a great inventor.","에디슨은 위대한 발명가였다."]],"c":{"characters":"글자, 문자","gauge":"측정기 (rain gauge = 측우기)","sorry":"feel sorry for = ~을 안타깝게 여기다"}},{"id":25,"lv":"하","type":"d","topic":"학교","title":"Lost Pencil Case","s":[["Amy","Did you see my pencil case?","내 필통 봤니?"],["Kevin","What does it look like?","어떻게 생겼는데?"],["Amy","It's yellow and has a cat on it.","노란색이고 고양이가 그려져 있어."],["Kevin","When did you last use it?","마지막으로 언제 썼어?"],["Amy","In art class. I think I {1} it in the art room.","미술 시간에. 미술실에 두고 온 것 같아."],["Kevin","Let's go and look for it together.","같이 가서 찾아보자."],["Amy","Thanks. Oh, look! It's under the desk.","고마워. 아, 봐! 책상 밑에 있어."],["Kevin","Good. You should write your name on it.","잘됐다. 거기에 이름을 써 두는 게 좋겠어."],["Amy","{2} I'll do that right now.","좋은 생각이야. 지금 바로 그렇게 할게."]],"b":[[["left","leave","leaving"],0,"미술 시간(과거)에 두고 온 것이므로 leave의 과거형 left입니다."],[["That's a good idea.","I don't think so.","It's not mine."],0,"뒤에 '지금 바로 할게'라고 했으므로 동의하는 That's a good idea.가 맞습니다."]],"g":[["모양 묻기 What does it look like?","What does it look like?","What does ~ look like?는 '~은 어떻게 생겼니?'라는 뜻으로 생김새를 묻습니다. 대답은 It's ~ / It has ~로 합니다.","What does your brother look like?"],["의문사 when + 과거시제","When did you last use it?" science project.","우리는 과학 과제를 끝냈다."],["due","The homework is due tomorrow.","숙제는 내일까지다."],["survey","We did a survey about food.","우리는 음식에 대한 설문 조사를 했다."],["habit","Reading is a good habit.","독서는 좋은 습관이다."],["report","I wrote a report on whales.","나는 고래에 대한 보고서를 썼다."]],"c":{"due":"~까지 해야 하는 (마감인)","put":"put together = 합치다, 모으다"}},{"id":27,"lv":"중","type":"p","topic":"이야기","title":"The Honest Woodcutter","s":[["Once upon a time, a poor woodcutter was cutting trees near a lake.","옛날 옛적에 가난한 나무꾼이 호숫가에서 나무를 베고 있었다."],["Suddenly, his old axe slipped out of his hands and {1} into the water.","갑자기 그의 낡은 도끼가 손에서 미끄러져 물속으로 떨어졌다."],["He sat down and began to cry.","그는 주저앉아 울기 시작했다."],["Then a spirit came out of the lake holding a golden axe.","그때 호수에서 금도끼를 든 신령이 나타났다."],["\"Is this your axe?\" asked the spirit.","\"이것이 네 도끼냐?\"라고 신령이 물었다."],["\"No, it isn't,\" said the woodcutter.","\"아니요, 아닙니다.\"라고 나무꾼이 말했다."],["Next, the spirit showed him a silver axe, but he said no {2}.","다음으로 신령이 은도끼를 보여 주었지만 그는 또 아니라고 했다."],["Finally, the spirit brought out his old axe.","마지막으로 신령은 그의 낡은 도끼를 꺼내 왔다."],["\"Yes! That's mine,\" he said happily.","\"네! 그게 제 것입니다.\"라고 그는 기쁘게 말했다."],["The spirit was so pleased with his {3} that it gave him all three axes.","신령은 그의 정직함에 무척 기뻐서 도끼 세 자루를 모두 주었다."]],"b":[[["fell","fall","falls"],0,"과거 이야기이므로 fall의 과거형 fell입니다."],[["again","before","never"],0,"'또다시' 아니라고 했으므로 again입니다."],[["honesty","laziness","anger"],0,"자기 도끼가 아니라고 정직하게 말했으므로 '정직함(honesty)'입니다."]],"g":[["현재분사의 후치 수식","a spirit came out of the lake holding a golden axe","holding a golden axe는 '금도끼를 든 채로'라는 뜻으로, 현재분사가 주어의 동작을 덧붙여 설명합니다.","A girl came in carrying a big box."],["begin + to부정사","He sat down and began to cry.","begin은 to부정사와 동명사를 모두 목적어로 쓸 수 있습니다. began to cry = began crying","It began to snow."]],"k":[["once upon a time","Once upon a time, there lived a king.","옛날 옛적에 한 왕이 살았다."],["poor","The poor boy had no shoes.","그 가난한 소년은 신발이 없었다."],["axe","He cut the tree with an axe.","그는 도끼로 나무를 베었다."],["silver","She has a silver ring.","그녀는 은반지를 가지고 있다."],["pleased","I'm pleased with the result.","나는 결과에 만족한다."]],"c":{"spirit":"(호수의) 신령","no":"say no = 아니라고 말하다"}},{"id":28,"lv":"중","type":"p","topic":"환경","title":"Why Bees Are Important","s":[["When you think of bees, you may think of honey or painful stings.","벌을 생각하면 꿀이나 아픈 벌침이 떠오를지도 모른다."],["But bees do much more for us.","하지만 벌은 우리를 위해 훨씬 더 많은 일을 한다."],["As they fly from flower to flower, they carry pollen.","벌은 이 꽃에서 저 꽃으로 날아다니면서 꽃가루를 옮긴다."],["This helps plants {1} fruits and seeds.","이것은 식물이 열매와 씨앗을 맺도록 돕는다."],["About one third of the food we eat depends on bees.","우리가 먹는 음식의 약 3분의 1이 벌에 의존한다."],["Without them, we would have fewer apples, strawberries, and almonds.","벌이 없다면 우리는 사과, 딸기, 아몬드를 더 적게 먹게 될 것이다."],["Sadly, the number of bees is {2} because of chemicals and climate change.","슬프게도 화학 물질과 기후 변화 때문에 벌의 수가 줄어들고 있다."],["What can we do?","우리는 무엇을 할 수 있을까?"],["Planting flowers in our gardens is a good start.","정원에 꽃을 심는 것이 좋은 시작이다."],["We can also avoid {3} chemicals on plants.","식물에 화학 물질을 쓰지 않도록 할 수도 있다."],["Small actions can protect these tiny workers.","작은 행동이 이 작은 일꾼들을 지킬 수 있다."]],"b":[[["produce","producing","produced"],0,"help + 목적어 + 동사원형 구조이므로 produce입니다."],[["growing","dropping","rising"],1,"화학 물질과 기후 변화 '때문에' 벌의 수가 '줄어들고(dropping)' 있다는 흐름입니다."],[["using","to use","use"],0,"avoid는 동명사를 목적어로 취하므로 using입니다."]],"g":[["동명사를 목적어로 쓰는 동사","We can also avoid using chemicals.","avoid, enjoy, finish, mind, give up 뒤에는 to부정사가 아니라 동명사(-ing)가 옵니다.","I enjoy swimming in the sea."],["시간·동시 접속사 as","As they fly from flower to flower, they carry pollen.","as는 '~하면서, ~할 때'라는 뜻으로 두 동작이 동시에 일어남을 나타냅니다.","As she sang, everyone listened."]],"k":[["sting","A bee sting can hurt.","벌침은 아플 수 있다."],["pollen","Bees collect pollen.","벌은 꽃가루를 모은다."],["depend on","Kids depend on their parents.","아이들은 부모에게 의지한다."],["avoid","Avoid eating too much sugar.","설탕을 너무 많이 먹지 마라."],["protect","Sunscreen protects your skin.","선크림은 피부를 보호한다."]],"c":{"may":"~일지도 모른다","third":"3분의 1 (one third)","would":"(~라면) …할 것이다"}},{"id":29,"lv":"중","type":"p","topic":"건강","title":"Breakfast Matters","s":[["Do you skip breakfast in the morning?","당신은 아침을 거르는가?"],["Many students do because they are too busy or not hungry.","많은 학생들이 너무 바쁘거나 배가 고프지 않아서 아침을 거른다."],["However, eating breakfast is a great way {1} your day.","하지만 아침을 먹는 것은 하루를 시작하는 좋은 방법이다."],["When you sleep, your body doesn't get any food for about eight hours.","잠자는 동안 몸은 약 8시간 동안 음식을 전혀 얻지 못한다."],["Breakfast gives your brain the energy it needs.","아침 식사는 뇌에 필요한 에너지를 준다."],["Studies show that students who eat breakfast {2} better in class.","연구에 따르면 아침을 먹는 학생들이 수업 시간에 더 잘 집중한다."],["They also feel less tired in the afternoon.","그들은 오후에 덜 피곤함을 느끼기도 한다."],["You don't need a big meal.","거창한 식사가 필요하지는 않다."],["A banana, a glass of milk, or some toast is {3}.","바나나 하나, 우유 한 잔, 또는 토스트 조금이면 충분하다."],["Try to eat something every morning, and you will feel the difference.","매일 아침 무언가를 먹으려고 노력하면 차이를 느낄 것이다."]],"b":[[["to start","starting","started"],0,"a great way to + 동사원형은 '~하는 좋은 방법'으로 to부정사가 명사를 꾸밉니다."],[["concentrate","sleep","talk"],0,"아침을 먹은 학생들이 수업에 더 잘 '집중한다(concentrate)'는 내용입니다."],[["enough","too much","nothing"],0,"간단한 음식이면 '충분하다(enough)'는 뜻입니다."]],"g":[["목적격 관계대명사 생략","the energy it needs","the energy (that/which) it needs에서 목적격 관계대명사 that이 생략되었습니다. '그것이 필요로 하는 에너지'라는 뜻입니다.","This is the book I bought yesterday."],["명령문 + and ~","Try to eat something every morning, and you will feel the difference.","명령문 + and + 주어 + will ~은 '~해라, 그러면 …할 것이다'라는 뜻입니다. and 대신 or를 쓰면 '그렇지 않으면'입니다.","Hurry up, or you will be late."]],"k":[["skip","Don't skip class.","수업 빼먹지 마."],["energy","Kids have a lot of energy.","아이들은 에너지가 넘친다."],["study","A new study shows that tea is healthy.","새로운 연구에 따르면 차는 건강에 좋다."],["concentrate","I can't concentrate.","나는 집중이 안 된다."],["difference","Can you see the difference?","차이가 보이니?"]],"c":{"studies":"연구, 조사"}},{"id":30,"lv":"상","type":"p","topic":"과학","title":"Can Plants Talk?","s":[["Plants cannot speak or move like animals, but scientists have found that they can communicate in surprising ways.","식물은 동물처럼 말하거나 움직일 수 없지만, 과학자들은 식물이 놀라운 방식으로 소통할 수 있다는 것을 발견했다."],["When a plant is attacked by insects, it releases special chemicals into the air.","식물은 곤충의 공격을 받으면 공기 중으로 특별한 화학 물질을 내보낸다."],["Nearby plants {1} these chemicals and start to produce substances that make their leaves taste bad.","근처의 식물들이 이 화학 물질을 감지하고 잎의 맛을 나쁘게 만드는 물질을 만들기 시작한다."],["In this way, they can protect themselves before the insects even arrive.","이런 방식으로 그들은 곤충이 도착하기도 전에 스스로를 보호할 수 있다."],["Trees in a forest are also connected underground by a network of fungi, which is sometimes called the \"Wood Wide Web.\"","숲속의 나무들은 땅속에서 균류의 연결망으로도 이어져 있는데, 이는 때때로 '우드 와이드 웹'이라고 불린다."],["Through this network, older trees can send water and nutrients to younger ones that are growing in the {2}.","이 연결망을 통해 나이 든 나무는 그늘에서 자라는 어린 나무에게 물과 영양분을 보낼 수 있다."],["Some studies even suggest that trees can warn their neighbors {3} danger.","일부 연구는 나무가 이웃 나무에게 위험을 경고할 수 있다고까지 말한다."],["Plants may be quieter than animals, but they are definitely not {4}.","식물은 동물보다 조용할지 모르지만 절대 혼자가 아니다."]],"b":[[["detect","ignore","eat"],0,"근처 식물이 화학 물질을 '감지하고(detect)' 방어를 시작합니다."],[["shade","sun","sky"],0,"어린 나무가 햇빛이 부족한 '그늘(shade)'에서 자라기 때문에 도움을 받는다는 뜻입니다."],[["of","with","at"],0,"warn A of B는 'A에게 B를 경고하다'입니다."],[["alone","green","alive"],0,"서로 소통하고 도우므로 '혼자가(alone)' 아니라는 뜻입니다."]],"g":[["재귀대명사","They can protect themselves.","주어와 목적어가 같은 대상일 때 목적어 자리에 -self/-selves를 씁니다. they → themselves","She looked at herself in the mirror."],["수동태 be attacked by / be connected by","When a plant is attacked by insects ...","be + 과거분사 + by는 '~에게 …당하다'입니다. 식물이 공격을 '받는' 쪽이므로 수동태를 씁니다.","The town was hit by a storm."]],"k":[["communicate","Dolphins communicate with sounds.","돌고래는 소리로 소통한다."],["attack","The dog attacked the cat.","개가 고양이를 공격했다."],["nearby","There is a store nearby.","근처에 가게가 있다."],["nutrient","Vegetables have many nutrients.","채소에는 영양소가 많다."],["warn","I warned him about the ice.","나는 그에게 빙판을 조심하라고 경고했다."]],"c":{"fungi":"균류, 곰팡이류 (fungus의 복수)","web":"연결망 (World Wide Web을 빗댄 말)","wide":"넓은 (Wood Wide Web: 숲의 연결망)"}},{"id":31,"lv":"중","type":"d","topic":"일상","title":"Borrowing a Bike","s":[["Sam","Hey, Jina. Can I ask you a favor?","안녕, 지나야. 부탁 하나 해도 될까?"],["Jina","Sure. What is it?","물론이지. 뭔데?"],["Sam","My bike has a flat tire. Can I borrow yours this afternoon?","내 자전거 타이어가 펑크 났어. 오늘 오후에 네 것 좀 빌려도 될까?"],["Jina","Where are you going?","어디 가는데?"],["Sam","I promised {1} my grandma at the hospital.","병원에 계신 할머니를 찾아뵙기로 약속했거든."],["Jina","Oh, I hope she gets better soon. Of course you can use it.","아, 할머니가 빨리 나으시길 바라. 당연히 써도 돼."],["Sam","Thanks a lot. I'll bring it back {2} six.","정말 고마워. 6시까지 돌려줄게."],["Jina","No hurry. Just remember to lock it when you park.","서두를 필요 없어. 주차할 때 자물쇠 채우는 것만 기억해."],["Sam","I will. What's the password for the lock?","그럴게. 자물쇠 비밀번호가 뭐야?"],["Jina","It's 0415, my birthday.","0415야, 내 생일이야."],["Sam","{3} I owe you one.","너 정말 최고야. 신세 한 번 졌다."]],"b":[[["to visit","visiting","visit"],0,"promise는 to부정사를 목적어로 취하므로 to visit입니다."],[["by","until","since"],0,"'6시까지' 돌려주는 동작의 완료 기한은 by를 씁니다. until은 상태가 계속될 때 씁니다."],[["You're the best.","Never mind.","It's too bad."],0,"고마움을 크게 표현하는 You're the best.가 알맞습니다."]],"g":[["소유대명사 yours","Can I borrow yours?","yours는 your bike처럼 '너의 것'을 뜻하는 소유대명사입니다. mine, yours, his, hers, ours, theirs가 있습니다.","This pen is mine, not yours."],["remember + to부정사","Remember to lock it when you park.","remember to ~는 '(앞으로) ~할 것을 기억하다', remember -ing는 '(과거에) ~한 것을 기억하다'입니다.","Remember to call me tonight."]],"k":[["favor","Can you do me a favor?","부탁 하나 들어줄래?"],["flat tire","I got a flat tire on the way.","가는 길에 타이어가 펑크 났다."],["promise","I promise to come.","꼭 올게, 약속해."],["lock","Lock the door.","문을 잠가라."],["owe","I owe you ten dollars.","나 너한테 10달러 빚졌어."]],"c":{"flat":"(타이어가) 바람 빠진","owe":"I owe you one. = 신세 졌어."}},{"id":32,"lv":"상","type":"d","topic":"학교","title":"Preparing for a Debate","s":[["Teacher","Today, we'll have a debate. The topic is \"Should students wear school uniforms?\"","오늘은 토론을 할 거예요. 주제는 '학생들은 교복을 입어야 하는가?'입니다."],["Minsu","I think students should wear uniforms. They make everyone feel equal.","저는 학생들이 교복을 입어야 한다고 생각해요. 교복은 모두를 평등하게 느끼게 해 줘요."],["Teacher","Good point. Can you explain {1}?","좋은 지적이에요. 더 설명해 줄 수 있나요?"],["Minsu","If everyone wears the same clothes, nobody is judged by what they wear.","모두가 같은 옷을 입으면 아무도 입은 옷으로 평가받지 않아요."],["Ara","I see what you mean, but I {2}. Uniforms take away our freedom to express ourselves.","무슨 말인지는 알겠지만 저는 동의하지 않아요. 교복은 우리 자신을 표현할 자유를 빼앗아요."],["Minsu","But uniforms also save time. We don't have to decide what to wear every morning.","하지만 교복은 시간도 아껴 줘요. 매일 아침 무엇을 입을지 고민할 필요가 없잖아요."],["Ara","That's true, but uniforms are often more expensive than regular clothes, and they're not very comfortable.","맞아요, 하지만 교복은 보통 일반 옷보다 비싸고 그다지 편하지도 않아요."],["Teacher","Both of you have made strong arguments. Does anyone have a {3} solution?","두 사람 모두 설득력 있는 주장을 했어요. 다른 해결책이 있는 사람 있나요?"],["Jun","Maybe schools could let students choose between uniforms and comfortable sportswear.","어쩌면 학교가 학생들이 교복과 편한 체육복 중에서 고를 수 있게 해 줄 수도 있어요."],["Teacher","{4} Let's vote on all three opinions.","흥미로운 생각이네요. 세 가지 의견 모두에 대해 투표해 봐요."]],"b":[[["further","never","yesterday"],0,"'더 자세히(further)' 설명해 달라는 뜻입니다."],[["disagree","agree","forget"],0,"but 뒤에 반대 의견이 나오므로 '동의하지 않는다(disagree)'입니다."],[["different","same","wrong"],0,"두 의견 외의 '다른(different)' 해결책을 묻고 있습니다."],[["That's an interesting idea.","That's impossible.","Be quiet."],0,"새로운 의견을 긍정적으로 받아들이고 투표하자고 하므로 That's an interesting idea.입니다."]],"g":[["사역동사 make/let + 목적어 + 동사원형","They make everyone feel equal. / let students choose","make와 let은 목적어 뒤에 동사원형을 씁니다. make는 '~하게 만들다', let은 '~하도록 허락하다'입니다.","My mom let me go to the concert."],["수동태 is judged by + 관계대명사 what","nobody is judged by what they wear","is judged는 '평가받다'라는 수동태이고, what they wear는 '그들이 입는 것'이라는 명사절입니다.","Don't judge a book by its cover."]],"k":[["debate","We had a debate about pets.","우리는 반려동물에 대해 토론했다."],["equal","All people are equal.","모든 사람은 평등하다."],["freedom","Freedom is precious.","자유는 소중하다."],["argument","His argument was strong.","그의 주장은 설득력이 있었다."],["vote","Let's vote on it.","그것에 대해 투표하자."]],"c":{"point":"(좋은) 지적, 요점","regular":"일반적인, 보통의"}},{"id":33,"lv":"중","type":"d","topic":"쇼핑","title":"Exchanging a Shirt","s":[["Clerk","Hi. How can I help you?","안녕하세요. 무엇을 도와드릴까요?"],["Yujin","I bought this shirt yesterday, but it's too small for me.","어제 이 셔츠를 샀는데 저한테 너무 작아요."],["Clerk","I see. Would you like to {1} it for a bigger size?","그렇군요. 더 큰 사이즈로 교환하시겠어요?"],["Yujin","Yes, please. Do you have it in a large?","네. 라지 사이즈 있나요?"],["Clerk","Let me check. I'm sorry, but we only have a large in green.","확인해 볼게요. 죄송하지만 라지는 초록색밖에 없네요."],["Yujin","Hmm, I really wanted the blue one.","음, 저는 파란색을 정말 원했는데요."],["Clerk","We will get more blue shirts next Monday. {2}","다음 주 월요일에 파란 셔츠가 더 들어와요. 그때 다시 오시겠어요?"],["Yujin","That's fine. I'll come back then.","괜찮아요. 그때 다시 올게요."],["Clerk","Please bring the receipt with you.","영수증을 가지고 오세요."],["Yujin","Okay. Can I keep this shirt until then?","네. 그때까지 이 셔츠는 제가 가지고 있어도 되나요?"],["Clerk","Sure. Just don't wear it, {3}.","물론이죠. 다만 입지는 마세요."]],"b":[[["exchange","explain","exercise"],0,"더 큰 사이즈로 '교환하다(exchange)'가 알맞습니다."],[["Can you come back then?","Do you want a green one?","How much is it?"],0,"Yujin이 '그때 다시 올게요'라고 답하므로 다시 오라는 제안이 알맞습니다."],[["please","thanks","sorry"],0,"부탁하는 말투를 부드럽게 하는 please가 알맞습니다."]],"g":[["Would you like to + 동사원형?","Would you like to exchange it?","Would you like to ~?는 '~하시겠어요?'라는 공손한 제안·권유 표현입니다. Do you want to ~?보다 정중합니다.","Would you like to have some tea?"],["부정대명사 one","I really wanted the blue one.","앞에 나온 명사(shirt)를 다시 말할 때 반복하지 않고 one으로 바꿔 씁니다.","I don't like this cap. Show me another one."]],"k":[["exchange","Can I exchange this for a smaller one?","이것을 더 작은 걸로 바꿀 수 있나요?"],["size","What size do you wear?","어떤 사이즈를 입으세요?"],["check","Let me check the time.","시간을 확인해 볼게."],["receipt","Keep the receipt.","영수증을 보관하세요."],["until","Stay here until noon.","정오까지 여기 있어."]],"c":{"large":"(옷의) 라지 사이즈"}},{"id":34,"lv":"상","type":"p","topic":"인물","title":"Wangari Maathai","s":[["Wangari Maathai was a woman from Kenya who changed her country by planting trees.","왕가리 마타이는 나무를 심어 자기 나라를 바꾼 케냐 출신 여성이다."],["When she was young, the land around her village was green and full of streams.","그녀가 어렸을 때 마을 주변의 땅은 푸르고 시냇물이 가득했다."],["However, after many forests were cut down for farms, the soil dried up and the streams {1}.","하지만 농장을 만들기 위해 많은 숲이 베어진 뒤 흙은 메마르고 시냇물은 사라졌다."],["Women had to walk much farther than before to find water and firewood.","여성들은 물과 땔감을 구하기 위해 전보다 훨씬 더 멀리 걸어야 했다."],["In 1977, Maathai started the Green Belt Movement, which paid women {2} plant trees.","1977년 마타이는 여성들에게 돈을 주고 나무를 심게 하는 그린벨트 운동을 시작했다."],["At first, many people laughed at her, and the government even put her in prison.","처음에는 많은 사람들이 그녀를 비웃었고 정부는 그녀를 감옥에 가두기까지 했다."],["But she never gave up.","하지만 그녀는 결코 포기하지 않았다."],["Since then, more than fifty million trees {3} in Kenya.","그 이후로 케냐에는 5천만 그루가 넘는 나무가 심어졌다."],["In 2004, she became the first African woman to receive the Nobel Peace Prize.","2004년 그녀는 노벨 평화상을 받은 최초의 아프리카 여성이 되었다."],["She once said, \"Until you dig a hole and plant a tree, you have done nothing.\"","그녀는 \"구덩이를 파고 나무를 심기 전까지는 아무것도 하지 않은 것이다.\"라고 말한 적이 있다."]],"b":[[["disappeared","appeared","grew"],0,"숲이 사라진 결과 시냇물도 '사라졌다(disappeared)'는 흐름입니다."],[["to","for","with"],0,"pay A to + 동사원형은 'A에게 돈을 주고 ~하게 하다'입니다."],[["have been planted","have planted","were planting"],0,"나무는 '심어지는' 대상이고 since then과 함께 쓰이므로 현재완료 수동태 have been planted입니다."]],"g":[["현재완료 수동태 have been p.p.","Since then, more than fifty million trees have been planted in Kenya.","have/has been + 과거분사는 '(그 이후로 지금까지) ~되었다'라는 현재완료 수동입니다. 주어가 동작을 받는 대상일 때 씁니다.","Many books have been written about him."],["비교급 강조 much farther than","Women had to walk much farther than before.","far의 비교급은 farther(거리)입니다. much, even, far, a lot이 비교급을 강조해 '훨씬 더'라는 뜻을 만듭니다.","Today is much colder than yesterday."]],"k":[["stream","A small stream runs through the village.","작은 시내가 마을을 가로질러 흐른다."],["firewood","We collected firewood for the camp.","우리는 캠프를 위해 땔감을 모았다."],["movement","She joined the peace movement.","그녀는 평화 운동에 참여했다."],["government","The government made a new law.","정부는 새 법을 만들었다."],["prison","He spent ten years in prison.","그는 감옥에서 10년을 보냈다."]],"c":{"belt":"띠, 지대 (Green Belt = 녹색 지대)","dig":"(구덩이를) 파다"}},{"id":35,"lv":"하","type":"p","topic":"문화","title":"Chuseok in Korea","s":[["Chuseok is a big holiday in Korea.","추석은 한국의 큰 명절이다."],["It comes in September or October.","추석은 9월이나 10월에 온다."],["On Chuseok, people visit their hometowns and meet their families.","추석에 사람들은 고향을 방문해 가족을 만난다."],["They thank their ancestors for the good harvest.","그들은 좋은 수확에 대해 조상님께 감사드린다."],["Families make songpyeon {1}.","가족들은 함께 송편을 만든다."],["Songpyeon is a rice cake shaped like a half moon.","송편은 반달 모양의 떡이다."],["At night, people look at the full moon and {2} a wish.","밤에 사람들은 보름달을 보며 소원을 빈다."],["Chuseok is a time for sharing and thanks.","추석은 나눔과 감사의 시간이다."]],"b":[[["alone","together","quickly"],1,"가족들이 '함께' 만드는 것이므로 together가 알맞습니다."],[["make","do","take"],0,"'소원을 빌다'는 make a wish로 씁니다."]],"g":[["thank A for B","They thank their ancestors for the good harvest.","thank + 사람 + for + 이유는 '~에게 …에 대해 감사하다'라는 뜻입니다.","Thank you for your help."],["과거분사의 형용사 역할","a rice cake shaped like a half moon","shaped like ~는 '~ 모양으로 만들어진'이라는 뜻으로 앞의 명사 rice cake를 꾸며 줍니다.","I have a box shaped like a heart."]],"k":[["holiday","Christmas is my favorite holiday.","크리스마스는 내가 가장 좋아하는 휴일이다."],["hometown","My hometown is Jeonju.","내 고향은 전주다."],["harvest","Farmers are busy at harvest time.","농부들은 수확 철에 바쁘다."],["full moon","The full moon is bright tonight.","오늘 밤 보름달이 밝다."],["wish","Make 께서 손으로 직접 떠 주신 거 알아요."],["It must have taken a long time.","시간이 오래 걸렸겠어요."],["I wear it to school every day.","저는 매일 학교에 그걸 하고 가요."],["My friends say it looks great.","친구들이 멋져 보인다고 해요."],["It is getting colder these days, so please {2} care of yourself.","요즘 점점 추워지니 몸조심하세요."],["I will visit you during the winter vacation.","겨울 방학 동안 찾아뵐게요."],["Love,","사랑을 담아,"],["Minji","민지 올림"]],"b":[[["for","to","with"],0,"make A for B는 'B를 위해 A를 만들다'입니다."],[["take","make","have"],0,"take care of yourself는 '몸조심하다'라는 표현입니다."]],"g":[["Thank you for + 명사","Thank you for the scarf.","Thank you for 뒤에 명사나 동명사를 써서 무엇이 고마운지 말합니다.","Thank you for coming."],["현재진행형으로 변화 나타내기","It is getting colder these days.","be + getting + 비교급은 '점점 ~해지고 있다'는 변화를 나타냅니다.","My English is getting better."]],"k":[["scarf","Wear a scarf. It's cold.","목도리를 해. 추워."],["soft","The pillow is soft.","베개가 푹신하다."],["by hand","She wrote the letter by hand.","그녀는 손으로 편지를 썼다."],["these days","I'm busy these days.","나는 요즘 바쁘다."],["vacation","Summer vacation starts next week.","여름 방학이 다음 주에 시작한다."]],"c":{"must":"~이었음에 틀림없다 (추측)"}},{"id":38,"lv":"하","type":"p","topic":"동물","title":"Penguins","s":[["Penguins are birds, but they cannot fly.","펭귄은 새이지만 날 수 없다."],["Instead, they are excellent swimmers.","대신 그들은 훌륭한 수영 선수다."],["Their wings work like flippers in the water.","그들의 날개는 물속에서 지느러미처럼 움직인다."],["Most penguins live in the south, near Antarctica.","대부분의 펭귄은 남쪽, 남극 근처에 산다."],["It is very cold there, but their thick feathers keep them {1}.","그곳은 매우 춥지만 두꺼운 깃털이 그들을 따뜻하게 지켜 준다."],["Penguins eat fish, squid, and krill.","펭귄은 물고기, 오징어, 크릴새우를 먹는다."],["Father penguins often take care of the eggs.","아빠 펭귄이 종종 알을 돌본다."],["They hold the eggs on their feet for about two {2}.","그들은 약 두 달 동안 알을 발 위에 올려 둔다."],["Penguins are amazing animals!","펭귄은 놀라운 동물이다!"]],"b":[[["warm","wet","hungry"],0,"추운 곳에서 깃털이 몸을 '따뜻하게' 지켜 준다는 뜻이므로 warm입니다."],[["months","month","monthly"],0,"two 뒤에는 복수 명사가 와야 하므로 months입니다."]],"g":[["keep + 목적어 + 형용사","Their thick feathers keep them warm.","keep A + 형용사는 'A를 ~한 상태로 유지하다'라는 뜻입니다.","This coat keeps me warm."],["접속사 but","Penguins are birds, but they cannot fly.","but은 '그러나'라는 뜻으로 서로 반대되는 내용을 이어 줍니다.","I was tired, but I finished my work."]],"k":[["excellent","She is an excellent cook.","그녀는 훌륭한 요리사다."],["wing","The bird opened its wings.","새가 날개를 펼쳤다."],["thick","This book is thick.","이 책은 두껍다."],["feather","The bird has blue feathers.","그 새는 파란 깃털이 있다."],["take care of","I take care of my little sister.","나는 여동생을 돌본다."]],"c":{}},{"id":39,"lv":"상","type":"d","topic":"쇼핑","title":"Choosing a New Phone","s":[["Clerk","Hi there. Are you looking for anything in particular?","안녕하세요. 특별히 찾으시는 게 있나요?"],["Dohyun","Yes, I need a new phone. Mine is so old that the battery dies by lunchtime.","네, 새 휴대폰이 필요해요. 제 건 너무 오래돼서 점심때면 배터리가 다 닳아요."],["Clerk","I see. What do you mainly use your phone for?","그렇군요. 휴대폰을 주로 어디에 쓰세요?"],["Dohyun","I take a lot of photos, and I watch videos on the bus.","사진을 많이 찍고, 버스에서 영상을 봐요."],["Clerk","Then I recommend this model. It has the {1} camera in our store and a large screen.","그럼 이 모델을 추천해요. 저희 매장에서 카메라가 가장 좋고 화면도 커요."],["Dohyun","It looks nice, but how much is it?","좋아 보이는데, 얼마예요?"],["Clerk","It's 900,000 won.","90만 원이에요."],["Dohyun","Wow, that's {2} than I expected. Do you have anything cheaper?","와, 생각보다 훨씬 비싸네요. 더 싼 거 있어요?"],["Clerk","This one is 500,000 won. Its camera isn't as good as the other one's, but the battery lasts longer.","이건 50만 원이에요. 카메라는 다른 것만큼 좋지 않지만 배터리가 더 오래가요."],["Dohyun","Battery life is more important to me. Can I try it?","저한테는 배터리 수명이 더 중요해요. 한번 써 봐도 돼요?"],["Clerk","{3} Take your time.","물론이죠. 천천히 보세요."],["Dohyun","I like it. I'll take this one.","마음에 들어요. 이걸로 할게요."]],"b":[[["best","better","good"],0,"in our store라는 범위가 있으므로 최상급 best입니다."],[["much more expensive","much cheaper","as cheap"],0,"뒤에 더 싼 것을 찾으므로 '훨씬 더 비싸다'가 알맞습니다."],[["Go ahead.","No way.","Hurry up."],0,"써 봐도 되냐는 요청을 허락하는 Go ahead.입니다."]],"g":[["원급 비교 not as ~ as","Its camera isn't as good as the other one's.","not as + 형용사 + as ~는 '~만큼 …하지 않다'라는 뜻입니다. the other one's는 the other one's camera를 줄인 것입니다.","My bag is not as heavy as yours."],["비교급 강조 much + 비교급 + than","That's much more expensive than I expected.","much는 비교급 앞에서 '훨씬'이라는 뜻을 더합니다. than I expected는 '내가 예상한 것보다'입니다.","The test was much easier than I thought."]],"k":[["in particular","Are you looking for anything in particular?","특별히 찾는 거 있니?"],["battery","My phone battery is low.","내 휴대폰 배터리가 얼마 없다."],["mainly","I mainly eat vegetables.","나는 주로 채소를 먹는다."],["recommend","Can you recommend a good book?","좋은 책 추천해 줄래?"],["expect","I didn't expect to see you here.","여기서 너를 볼 줄 몰랐어."]],"c":{"dies":"(배터리가) 다 닳다","life":"(배터리) 수명","model":"(제품의) 모델, 기종"}},{"id":40,"lv":"하","type":"p","topic":"학교","title":"The School Library","s":[["Our school library is on the third floor.","우리 학교 도서관은 3층에 있다."],["It has about ten thousand books.","도서관에는 약 1만 권의 책이 있다."],["It opens at eight in the morning and closes at five.","아침 8시에 열고 5시에 닫는다."],["Students can borrow three books {1} a time.","학생들은 한 번에 세 권의 책을 빌릴 수 있다."],["We must return them in two weeks.","우리는 2주 안에 책을 반납해야 한다."],["There are some rules in the library.","도서관에는 몇 가지 규칙이 있다."],["You must be quiet, and you must not eat {2}.","조용히 해야 하고, 음식을 먹으면 안 된다."],["I go there every lunchtime because it is a peaceful place.","그곳은 평화로운 곳이라서 나는 점심시간마다 간다."]],"b":[[["at","in","on"],0,"at a time은 '한 번에'라는 뜻의 표현입니다."],[["food","foods","a food"],0,"food는 보통 셀 수 없는 명사로 쓰므로 food가 알맞습니다."]],"g":[["조동사 must / must not","You must be quiet, and you must not eat food.","must + 동사원형은 '~해야 한다'는 의무, must not은 '~해서는 안 된다'는 금지를 나타냅니다.","You must not run here."],["서수로 층 말하기","Our school library is on the third floor.","몇 층인지는 on the + 서수(first, second, third) + floor로 말합니다.","My classroom is on the second floor."]],"k":[["floor","The office is on the fifth floor.","사무실은 5층에 있다."],["borrow","Can I borrow your pen?","펜 좀 빌려도 될까?"],["return","Return the book
