ing.","첫째, 쇼핑하러 가기 전에 목록을 만들어라."],["It helps you avoid buying things you don't {2}.","그것은 필요하지 않은 물건을 사지 않도록 도와준다."],["Second, choose products with less packaging.","둘째, 포장이 적은 제품을 골라라."],["Third, buy secondhand items when you can.","셋째, 가능하면 중고 물건을 사라."],["Used books and clothes are cheaper and still in good condition.","중고 책과 옷은 더 싸고 여전히 상태가 좋다."],["Finally, {3} your old things instead of throwing them away.","마지막으로 오래된 물건은 버리는 대신 기부해라."]],"b":[[["shopping","shop","to shop"],0,"전치사 for 뒤에는 동명사가 오므로 shopping입니다."],[["need","sell","make"],0,"'필요하지 않은' 물건을 사지 않게 돕는다는 뜻이므로 need입니다."],[["donate","burn","hide"],0,"버리는 대신 '기부하라(donate)'는 조언입니다."]],"g":[["수동태 + 전치사 + being p.p.","cheap clothes are often thrown away after being worn only a few times","after being + 과거분사는 '~된 후에'라는 수동의 동명사입니다. 옷이 '입혀진' 것이므로 being worn을 씁니다.","He was happy after being chosen."],["help + 목적어 + 동사원형","It helps you avoid buying things.","help A (to) + 동사원형은 'A가 ~하도록 돕다'입니다. 여기서 avoid 뒤에는 동명사 buying이 왔습니다.","This app helps me learn English."]],"k":[["environment","Protect the environment.","환경을 보호해라."],["wrap","She wrapped the gift.","그녀는 선물을 포장했다."],["packaging","Too much packaging is wasteful.","과대 포장은 낭비다."],["secondhand","I bought a secondhand bike.","나는 중고 자전거를 샀다."],["donate","We donated books to the library.","우리는 도서관에 책을 기증했다."]],"c":{"condition":"(물건의) 상태","used":"중고의"}},{"id":43,"lv":"중","type":"p","topic":"인물","title":"Usain Bolt","s":[["Usain Bolt is known as the fastest man in the world.","우사인 볼트는 세계에서 가장 빠른 사람으로 알려져 있다."],["He was born in Jamaica in 1986.","그는 1986년 자메이카에서 태어났다."],["As a child, he loved {1} cricket and soccer.","어린 시절 그는 크리켓과 축구를 하는 것을 정말 좋아했다."],["His coach noticed his speed and told him to try running.","그의 코치가 그의 속도를 알아보고 달리기를 해 보라고 했다."],["Bolt was very tall for a sprinter, so some people thought he could not start fast.","볼트는 단거리 선수치고는 키가 매우 커서 어떤 사람들은 그가 빨리 출발하지 못할 거라고 생각했다."],["However, he trained hard and {2} his long legs into an advantage.","하지만 그는 열심히 훈련했고 긴 다리를 장점으로 바꾸었다."],["In 2009, he ran 100 meters in 9.58 seconds.","2009년에 그는 100미터를 9.58초에 달렸다."],["Nobody has broken that record yet.","아직 아무도 그 기록을 깨지 못했다."],["He won eight Olympic gold medals before he {3}.","그는 은퇴하기 전에 올림픽 금메달 8개를 땄다."],["Bolt says, \"Don't think about the limits.\"","볼트는 \"한계에 대해 생각하지 마라.\"라고 말한다."]],"b":[[["playing","to playing","played"],0,"love는 동명사를 목적어로 쓸 수 있으므로 playing입니다."],[["turned","threw","hid"],0,"turn A into B는 'A를 B로 바꾸다'라는 뜻입니다."],[["retired","started","practiced"],0,"선수 생활을 마치기 전, 즉 '은퇴하기(retired)' 전입니다."]],"g":[["be known as ~","Usain Bolt is known as the fastest man in the world.","be known as는 '~로 알려져 있다'(자격), be known for는 '~ 때문에 알려져 있다'(이유)입니다.","She is known as a great singer."],["tell + 목적어 + to부정사","His coach told him to try running.","tell A to ~는 'A에게 ~하라고 말하다'라는 뜻입니다.","The teacher told us to be quiet."]],"k":[["coach","Our coach is strict.","우리 코치는 엄격하다."],["notice","Did you notice anything strange?","이상한 거 눈치챘니?"],["advantage","Being tall is an advantage in basketball.","키가 큰 것은 농구에서 유리하다."],["record","He broke the world record.","그는 세계 기록을 깼다."],["limit","There is no limit.","한계는 없다."]],"c":{"start":"(경주를) 출발하다","broken":"(기록을) 깬"}},{"id":44,"lv":"상","type":"p","topic":"환경","title":"Cities That Grow Food","s":[["More than half of the world's people now live in cities, and this number is expected to grow.","현재 세계 인구의 절반 이상이 도시에 살고 있으며, 이 수는 늘어날 것으로 예상된다."],["Feeding so many people is becoming a big challenge.","그렇게 많은 사람들을 먹이는 것은 큰 과제가 되고 있다."],["One solution that many cities have tried is urban farming, which means {1} food inside the city.","많은 도시가 시도해 온 한 가지 해결책은 도시 농업인데, 이는 도시 안에서 식량을 기르는 것을 뜻한다."],["People grow vegetables on rooftops, in empty lots, and even inside old buildings.","사람들은 옥상, 빈터, 심지어 오래된 건물 안에서도 채소를 기른다."],["Some vertical farms use special lights instead of sunlight and need much {2} water than traditional farms.","일부 수직 농장은 햇빛 대신 특수 조명을 사용하며 전통적인 농장보다 훨씬 적은 물을 쓴다."],["Urban farming has many advantages.","도시 농업에는 많은 장점이 있다."],["Because the food is grown close to where people live, it doesn't need to be carried long distances by trucks.","식량이 사람들이 사는 곳 가까이에서 길러지기 때문에 트럭으로 먼 거리를 운반할 필요가 없다."],["This reduces air pollution and keeps the vegetables {3}.","이것은 대기 오염을 줄이고 채소를 신선하게 유지해 준다."],["Community gardens also bring neighbors together.","공동체 텃밭은 이웃들을 한데 모으기도 한다."],["In the future, the city you live in might become a big farm.","미래에는 당신이 사는 도시가 거대한 농장이 될지도 모른다."]],"b":[[["growing","to growing","grew"],0,"means 뒤에 '~하는 것'이라는 동명사가 와야 하므로 growing입니다."],[["less","more","fewer"],0,"water는 셀 수 없는 명사이므로 '더 적은'은 less입니다. fewer는 셀 수 있는 명사에 씁니다."],[["fresh","old","expensive"],0,"가까운 곳에서 길러 바로 공급되므로 '신선한(fresh)' 상태가 유지됩니다."]],"g":[["수동태 be expected to / be grown","This number is expected to grow. / the food is grown close to where people live","be expected to ~는 '~할 것으로 예상되다', be grown은 '재배되다'라는 수동태입니다.","It is expected to rain tomorrow."],["목적격 관계대명사 생략","the city you live in","the city (that/which) you live in에서 관계대명사가 생략되었습니다. 전치사 in은 관계사절 끝에 남습니다.","This is the house I grew up in."]],"k":[["challenge","Learning a language is a challenge.","언어를 배우는 것은 도전이다."],["urban","Urban areas are crowded.","도시 지역은 붐빈다."],["rooftop","There is a garden on the rooftop.","옥상에 정원이 있다."],["vertical","Draw a vertical line.","세로줄을 그어라."],["distance","The distance is ten kilometers.","거리는 10킬로미터다."]],"c":{"lots":"(빈) 땅, 부지","feeding":"(사람들을) 먹여 살리는 것"}},{"id":45,"lv":"상","type":"p","topic":"문화","title":"The Olympic Games","s":[["The Olympic Games began in ancient Greece about 2,800 years ago.","올림픽 경기는 약 2,800년 전 고대 그리스에서 시작되었다."],["They were held every four years in a city called Olympia to honor Zeus, the king of the gods.","그것은 신들의 왕인 제우스를 기리기 위해 올림피아라는 도시에서 4년마다 열렸다."],["At first, there was only one event, a running race, and only men were allowed to {1}.","처음에는 달리기 경주라는 단 한 종목만 있었고, 남자들만 참가할 수 있었다."],["During the Games, wars between cities were stopped so that athletes could travel safely.","경기 기간 동안 선수들이 안전하게 이동할 수 있도록 도시 간 전쟁이 중단되었다."],["The modern Olympics started in Athens in 1896, thanks to a French man named Pierre de Coubertin.","근대 올림픽은 피에르 드 쿠베르탱이라는 프랑스인 덕분에 1896년 아테네에서 시작되었다."],["He believed that sports could bring people from different countries {2}.","그는 스포츠가 여러 나라 사람들을 하나로 모을 수 있다고 믿었다."],["The five rings on the Olympic flag represent the five continents that are united by sports.","올림픽 깃발의 다섯 개 고리는 스포츠로 하나가 된 다섯 대륙을 나타낸다."],["Today, more than 10,000 athletes from over 200 countries {3} in the Summer Olympics.","오늘날 200개가 넘는 나라에서 온 1만 명 이상의 선수들이 하계 올림픽에서 경쟁한다."]],"b":[[["take part","take care","take off"],0,"take part는 '참가하다'라는 뜻입니다."],[["together","apart","away"],0,"스포츠가 사람들을 '하나로 모은다(bring together)'는 뜻입니다."],[["compete","complain","collect"],0,"선수들이 올림픽에서 '경쟁한다(compete)'는 뜻입니다."]],"g":[["수동태 과거 were held / were stopped","They were held every four years ... wars between cities were stopped","were + 과거분사는 '~되었다'라는 과거 수동태입니다. 행사를 '여는' 사람보다 행사 자체가 중요할 때 씁니다.","The concert was held in the park."],["to부정사의 부사적 용법(목적) to honor","to honor Zeus, the king of the gods","to + 동사원형은 '~하기 위해'라는 목적을 나타냅니다. 쉼표 뒤 the king of the gods는 Zeus를 다시 설명하는 동격입니다.","They built a statue to honor the hero."]],"k":[["honor","We held a party to honor our coach.","우리는 코치님을 기리기 위해 파티를 열었다."],["athlete","She is a famous athlete.","그녀는 유명한 운동선수다."],["modern","I like modern art.","나는 현대 미술을 좋아한다."],["represent","The red color represents love.","빨간색은 사랑을 나타낸다."],["continent","Asia is the largest continent.","아시아는 가장 큰 대륙이다."]],"c":{"games":"(국제) 경기 대회","event":"(경기) 종목","race":"경주"}},{"id":46,"lv":"중","type":"p","topic":"일상","title":"A Digital Detox Weekend","s":[["Last weekend, my family tried a digital detox.","지난 주말, 우리 가족은 디지털 디톡스를 시도했다."],["That means we didn't use phones, computers, or TV for two days.","그것은 이틀 동안 휴대폰, 컴퓨터, TV를 쓰지 않았다는 뜻이다."],["At first, I felt bored and kept {1} for my phone.","처음에 나는 지루했고 자꾸 휴대폰에 손을 뻗었다."],["But soon, we found other things to do.","하지만 곧 우리는 할 다른 일들을 찾았다."],["We played board games and went hiking in the mountains.","우리는 보드게임을 하고 산으로 하이킹을 갔다."],["My dad taught me how to play chess.","아빠는 내게 체스 두는 법을 가르쳐 주셨다."],["In the evening, we cooked dinner together and talked for hours.","저녁에는 함께 저녁을 요리하고 몇 시간 동안 이야기를 나눴다."],["I learned many things about my parents that I didn't know {2}.","나는 전에는 몰랐던 부모님에 대한 많은 것을 알게 되었다."],["On Sunday night, I slept {3} than usual.","일요일 밤에는 평소보다 더 잘 잤다."],["We decided to have a digital detox once a month.","우리는 한 달에 한 번 디지털 디톡스를 하기로 했다."]],"b":[[["reaching","to reach","reach"],0,"keep + -ing는 '계속 ~하다'라는 뜻이므로 reaching입니다."],[["before","later","yet"],0,"'전에는 몰랐던'이라는 뜻이므로 before입니다."],[["better","good","best"],0,"than usual 앞이므로 well의 비교급 better입니다."]],"g":[["keep + 동명사","I kept reaching for my phone.","keep -ing는 '계속해서 ~하다'라는 뜻입니다. keep 뒤에는 to부정사가 오지 않습니다.","He kept talking during the movie."],["목적격 관계대명사 that","many things about my parents that I didn't know before","that이 앞의 명사(things)를 꾸미며 관계사절 안에서 know의 목적어 역할을 합니다.","The cake that she made was delicious."]],"k":[["bored","I'm bored. Let's go out.","심심해. 나가자."],["reach","He reached for the cup.","그는 컵에 손을 뻗었다."],["board game","We played a board game.","우리는 보드게임을 했다."],["hike","We hiked up the hill.","우리는 언덕을 걸어 올라갔다."],["usual","He came later than usual.","그는 평소보다 늦게 왔다."]],"c":{"detox":"디톡스, (해로운 것) 끊기","means":"~라는 뜻이다"}},{"id":47,"lv":"중","type":"p","topic":"인물","title":"Helen Keller","s":[["Helen Keller was born in the United States in 1880.","헬렌 켈러는 1880년 미국에서 태어났다."],["When she was a baby, she became very sick.","아기였을 때 그녀는 몹시 아팠다."],["After that, she could not see or hear.","그 후로 그녀는 보지도 듣지도 못하게 되었다."],["Because she could not understand the world, she often got angry.","세상을 이해할 수 없었기 때문에 그녀는 자주 화를 냈다."],["When Helen was seven, a teacher named Anne Sullivan came to {1} her.","헬렌이 일곱 살 때 앤 설리번이라는 선생님이 그녀를 가르치러 왔다."],["Anne spelled words into Helen's hand.","앤은 헬렌의 손바닥에 단어의 철자를 써 주었다."],["One day, Anne put Helen's hand under running water and spelled \"water.\"","어느 날 앤은 헬렌의 손을 흐르는 물 아래에 대고 'water'라고 썼다."],["Suddenly, Helen {2} that everything had a name.","갑자기 헬렌은 모든 것에 이름이 있다는 것을 깨달았다."],["She learned quickly and later went to college.","그녀는 빠르게 배웠고 나중에 대학에 갔다."],["She spent her life {3} people with disabilities.","그녀는 장애가 있는 사람들을 도우며 일생을 보냈다."]],"b":[[["teach","teaches","taught"],0,"to부정사(to + 동사원형)로 '가르치러'라는 목적을 나타내므로 teach입니다."],[["forgot","realized","worried"],1,"모든 것에 이름이 있다는 것을 '깨달았다(realized)'가 알맞습니다."],[["help","to help","helping"],2,"spend + 시간 + -ing는 '~하면서 시간을 보내다'입니다."]],"g":[["과거분사의 후치 수식","a teacher named Anne Sullivan","named ~는 '~라는 이름의'라는 뜻으로, 과거분사가 뒤에서 앞의 명사를 꾸밉니다.","I have a dog named Max."],["spend + 시간 + -ing","She spent her life helping people with disabilities.","spend + 시간/돈 + 동사-ing는 '~하는 데 시간(돈)을 쓰다'라는 뜻입니다.","I spent two hours doing my homework."]],"k":[["born","I was born in 2012.","나는 2012년에 태어났다."],["understand","I don't understand this question.","나는 이 질문을 이해하지 못한다."],["spell","How do you spell your name?","네 이름 철자가 어떻게 되니?"],["suddenly","Suddenly, it started to rain.","갑자기 비가 내리기 시작했다."],["realize","I realized my mistake.","나는 내 실수를 깨달았다."]],"c":{"running":"흐르는","disabilities":"장애"}},{"id":48,"lv":"상","type":"p","topic":"과학","title":"The Science of Rainbows","s":[["Rainbows are one of the most beautiful sights in nature, but they are not objects that you can touch.","무지개는 자연에서 가장 아름다운 광경 중 하나이지만, 만질 수 있는 물체는 아니다."],["They are made when sunlight passes through tiny drops of water in the air.","무지개는 햇빛이 공기 중의 작은 물방울을 통과할 때 만들어진다."],["Sunlight looks white, but it is actually a mix of all the colors.","햇빛은 하얗게 보이지만 실제로는 모든 색이 섞인 것이다."],["When light enters a raindrop, it bends, and each color bends at a slightly {1} angle.","빛이 빗방울에 들어가면 굴절되는데, 색마다 조금씩 다른 각도로 굴절된다."],["This separates the light into red, orange, yellow, green, blue, indigo, and violet.","이것이 빛을 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라로 나눈다."],["To see a rainbow, the sun must be {2} you, and the rain must be in front of you.","무지개를 보려면 해가 당신 뒤에 있고 비가 앞에 있어야 한다."],["That's why rainbows often appear in the late afternoon after a shower.","그래서 무지개는 소나기가 온 뒤 늦은 오후에 자주 나타난다."],["Interestingly, no two people see exactly the same rainbow, because each person's eyes receive light from {3} raindrops.","흥미롭게도 똑같은 무지개를 보는 두 사람은 없는데, 각자의 눈이 서로 다른 빗방울에서 오는 빛을 받기 때문이다."],["If you look carefully, you might even see a second, fainter rainbow above the first one.","주의 깊게 보면 첫 번째 무지개 위에 더 흐린 두 번째 무지개를 볼 수도 있다."]],"b":[[["different","same","straight"],0,"색마다 '다른(different)' 각도로 굴절되기 때문에 색이 나뉩니다."],[["behind","above","under"],0,"뒤에 '비는 앞에'라고 했으므로 해는 '뒤에(behind)' 있어야 합니다."],[["different","the same","no"],0,"똑같은 무지개를 보는 사람이 없는 이유는 '서로 다른(different)' 빗방울의 빛을 받기 때문입니다."]],"g":[["수동태 are made","They are made when sunlight passes through tiny drops of water.","be + 과거분사는 '~되다'라는 수동태입니다. 무지개는 스스로 만드는 것이 아니라 '만들어지는' 것입니다.","Cheese is made from milk."],["비교급 형용사 fainter","a second, fainter rainbow above the first one","faint(희미한)의 비교급 fainter는 '더 희미한'이라는 뜻입니다. 비교 대상이 분명할 때는 than 없이 쓰기도 합니다.","I want a bigger room."]],"k":[["sight","The sunset was a beautiful sight.","노을은 아름다운 광경이었다."],["object","What is that object on the table?","탁자 위에 있는 저 물건은 뭐니?"],["slightly","The price went up slightly.","가격이 약간 올랐다."],["separate","Separate the eggs.","달걀을 분리해라."],["appear","A man appeared at the door.","한 남자가 문에 나타났다."]],"c":{"shower":"소나기","bends":"(빛이) 굴절되다, 꺾이다","drops":"(물)방울"}},{"id":49,"lv":"중","type":"d","topic":"병원","title":"At the Dentist","s":[["Dentist","Hello, Minho. What brings you here today?","안녕, 민호야. 오늘은 어떻게 왔니?"],["Minho","My tooth hurts when I eat something cold.","차가운 걸 먹으면 이가 아파요."],["Dentist","Let me take a look. Open your mouth wide, please.","한번 보자. 입을 크게 벌려 볼래."],["Minho","Is it bad?","심한가요?"],["Dentist","You have a small cavity. Do you eat a lot of {1}?","충치가 조금 있구나. 단 걸 많이 먹니?"],["Minho","Well, I drink soda almost every day.","음, 거의 매일 탄산음료를 마셔요."],["Dentist","That's the problem. Sugar is bad for your teeth.","그게 문제야. 설탕은 이에 나쁘단다."],["Minho","Will it hurt to fix it?","치료하면 아플까요?"],["Dentist","{2} It will only take twenty minutes.","걱정하지 마. 20분이면 끝나."],["Minho","Okay. What should I do to keep my teeth healthy?","알겠어요. 이를 건강하게 지키려면 어떻게 해야 해요?"],["Dentist","Brush your teeth after every meal and try {3} less soda.","식사 후마다 이를 닦고 탄산음료를 덜 마시도록 노력하렴."]],"b":[[["sweets","vegetables","water"],0,"충치의 원인을 묻고 있으므로 '단것(sweets)'이 알맞습니다."],[["Don't worry.","Yes, a lot.","I don't know."],0,"뒤에 '20분이면 된다'며 안심시키므로 Don't worry.입니다."],[["to drink","drink","drank"],0,"try to + 동사원형은 '~하려고 노력하다'입니다."]],"g":[["What brings you here?","What brings you here today?","직역하면 '무엇이 너를 여기로 데려왔니?'로, 병원이나 가게에서 '어떻게 오셨어요?'라고 묻는 표현입니다.","What brings you to Seoul?"],["try to + 동사원형","Try to drink less soda.","try to ~는 '~하려고 노력하다', try -ing는 '시험 삼아 ~해 보다'라는 뜻입니다.","I'll try to come early."]],"k":[["tooth","I lost a tooth.","이가 하나 빠졌다."],["wide","Open the door wide.","문을 활짝 열어라."],["cavity","I have two cavities.","나는 충치가 두 개 있다."],["fix","Can you fix my computer?","내 컴퓨터 고쳐 줄 수 있니?"],["meal","Don't skip meals.","식사를 거르지 마라."]],"c":{"fix":"(충치를) 치료하다","look":"take a look = 한번 보다"}},{"id":50,"lv":"하","type":"p","topic":"동물","title":"My Dog Coco","s":[["I have a small dog.","나는 작은 개를 한 마리 키운다."],["Her name is Coco.","그녀의 이름은 코코이다."],["She is three years old and has soft white fur.","코코는 세 살이고 부드러운 흰 털을 가지고 있다."],["Coco loves to play with a red ball.","코코는 빨간 공을 가지고 노는 것을 정말 좋아한다."],["When I come home from school, she runs to the door and {1} her tail.","내가 학교에서 집에 오면 코코는 문으로 달려와서 꼬리를 흔든다."],["Every evening, my dad and I take her for a walk in the park.","매일 저녁 아빠와 나는 코코를 데리고 공원에 산책을 간다."],["Coco is sometimes noisy, but she is very {2}.","코코는 가끔 시끄럽지만 아주 영리하다."],["She can sit, wait, and shake hands.","코코는 앉기, 기다리기, 악수하기를 할 수 있다."],["She is my best friend.","코코는 나의 가장 친한 친구이다."]],"b":[[["wag","wags","wagged"],1,"주어 she가 3인칭 단수이고 앞의 runs와 시제를 맞추므로 wags입니다."],[["smart","lazy","angry"],0,"뒤에서 앉기, 기다리기, 악수를 할 수 있다고 했으므로 '영리한(smart)'이 알맞습니다."]],"g":[["시간의 접속사 when","When I come home from school, she runs to the door.","when은 '~할 때'라는 뜻으로 두 문장을 이어 줍니다. when 절이 앞에 오면 쉼표를 찍습니다.","When it rains, I stay at home."],["조동사 can","She can sit, wait, and shake hands.","can + 동사원형은 '~할 수 있다'는 능력을 나타냅니다. 주어가 3인칭이어도 동사원형을 씁니다.","My sister can swim very well."]],"k":[["fur","The cat has gray fur.","그 고양이는 회색 털을 가지고 있다."],["tail","The dog moved its tail.","그 개는 꼬리를 움직였다."],["take a walk","Let's take a walk after dinner.","저녁 먹고 산책하자."],["noisy","The classroom is noisy.","교실이 시끄럽다."],["shake hands","They shook hands and smiled.","그들은 악수하고 웃었다."]],"c":{}},{"id":51,"lv":"중","type":"p","topic":"문화","title":"The Day of the Dead","s":[["The Day of the Dead is a special holiday in Mexico.","망자의 날은 멕시코의 특별한 명절이다."],["It takes place on November 1 and 2.","이 명절은 11월 1일과 2일에 열린다."],["The name may sound scary, but it is actually a happy {1}.","이름이 무섭게 들릴 수도 있지만 사실은 즐거운 축제이다."],["People believe that the spirits of their family members come back to visit them.","사람들은 가족의 영혼이 그들을 찾아 돌아온다고 믿는다."],["To welcome them, families build small tables at home.","그들을 맞이하기 위해 가족들은 집에 작은 제단을 만든다."],["They decorate them with flowers, candles, photos, and the dead person's favorite food.","그들은 꽃, 초, 사진, 그리고 고인이 좋아하던 음식으로 그것을 장식한다."],["Bright orange flowers are used {2} the spirits can find their way home.","영혼이 집으로 오는 길을 찾을 수 있도록 밝은 주황색 꽃을 사용한다."],["People also eat sweet bread and sugar skulls.","사람들은 달콤한 빵과 설탕 해골도 먹는다."],["It is a time for {3} loved ones, not for being sad.","그때는 슬퍼하는 시간이 아니라 사랑하는 사람들을 기억하는 시간이다."]],"b":[[["festival","accident","exam"],0,"무섭게 들리지만 '즐거운 축제'라는 대조이므로 festival입니다."],[["so that","because of","even if"],0,"so that + 주어 + can은 '~할 수 있도록'이라는 목적을 나타냅니다."],[["remembering","remember","to remember"],0,"전치사 for 뒤에는 동명사가 오므로 remembering입니다."]],"g":[["수동태 be + 과거분사","Bright orange flowers are used.","be + 과거분사는 '~되다, ~받다'라는 수동의 뜻입니다. 행동을 하는 사람보다 대상이 중요할 때 씁니다.","English is spoken in many countries."],["so that ~ can","so that the spirits can find their way home","so that + 주어 + can + 동사원형은 '~가 …할 수 있도록'이라는 목적을 나타냅니다.","Speak loudly so that everyone can hear you."]],"k":[["take place","The festival takes place in May.","그 축제는 5월에 열린다."],["spirit","They believe in spirits.","그들은 영혼을 믿는다."],["welcome","Welcome to our school!","우리 학교에 온 걸 환영해!"],["decorate","We decorated the room with balloons.","우리는 풍선으로 방을 꾸몄다."],["skull","A skull is the bone of the head.","두개골은 머리의 뼈다."]],"c":{"tables":"(제사용) 제단, 상","dead":"죽은 (사람)"}},{"id":52,"lv":"중","type":"p","topic":"건강","title":"The Power of Sleep","s":[["Many teenagers do not get enough sleep.","많은 십 대들이 충분한 잠을 자지 않는다."],["They stay up late to study, play games, or use their phones.","그들은 공부하거나 게임을 하거나 휴대폰을 쓰느라 늦게까지 깨어 있다."],["However, sleep is very important for growing bodies and brains.","하지만 잠은 자라나는 몸과 뇌에 매우 중요하다."],["While you sleep, your brain {1} what you learned during the day.","자는 동안 뇌는 낮에 배운 것을 정리한다."],["Your body also grows and repairs itself.","몸도 자라고 스스로를 회복한다."],["Experts say that teenagers need eight to ten hours of sleep every night.","전문가들은 십 대가 매일 밤 8~10시간의 잠이 필요하다고 말한다."],["If you don't sleep enough, you may feel tired and find it hard {2}.","잠을 충분히 자지 않으면 피곤하고 집중하기 어렵다고 느낄 수 있다."],["Here is a tip for better sleep.","더 잘 자기 위한 팁이 있다."],["Turn off your phone thirty minutes {3} you go to bed.","잠자리에 들기 30분 전에 휴대폰을 꺼라."],["The light from the screen keeps your brain awake.","화면에서 나오는 빛이 뇌를 깨어 있게 만든다."]],"b":[[["organizes","forgets","hides"],0,"자는 동안 뇌가 배운 것을 '정리한다(organizes)'가 알맞습니다."],[["to focus","focusing","focus"],0,"find it hard to ~는 '~하는 것이 어렵다고 느끼다'로, it은 가목적어이고 to부정사가 진짜 목적어입니다."],[["before","after","while"],0,"잠자리에 들기 '전에' 휴대폰을 끄라는 뜻이므로 before입니다."]],"g":[["접속사 while","While you sleep, your brain organizes what you learned.","while은 '~하는 동안'이라는 뜻으로 두 일이 같은 시간에 일어남을 나타냅니다.","While I was cooking, the phone rang."],["관계대명사 what","your brain organizes what you learned","what은 '~하는 것'이라는 뜻으로 선행사를 포함한 관계대명사입니다. the thing(s) which로 바꿀 수 있습니다.","This is what I wanted."]],"k":[["teenager","My brother is a teenager.","우리 형은 십 대다."],["stay up","Don't stay up too late.","너무 늦게까지 깨어 있지 마."],["brain","The brain controls the body.","뇌는 몸을 조절한다."],["expert","Ask an expert.","전문가에게 물어봐."],["awake","Coffee keeps me awake.","커피는 나를 깨어 있게 한다."]],"c":{"repairs":"회복시키다, 고치다","tip":"조언, 비결"}},{"id":53,"lv":"하","type":"p","topic":"환경","title":"The Clean-Up Day","s":[["Last Sunday, my family joined a beach clean-up.","지난 일요일, 우리 가족은 해변 청소 활동에 참여했다."],["About fifty people came to the beach.","약 50명의 사람들이 해변에 왔다."],["Everyone got gloves and a big bag.","모두가 장갑과 큰 봉투를 받았다."],["We picked up plastic bottles, cans, and old fishing nets.","우리는 플라스틱 병, 캔, 그리고 낡은 그물을 주웠다."],["I was {1} because there was so much trash.","쓰레기가 너무 많아서 나는 놀랐다."],["A man told us that sea animals often eat plastic.","한 남자가 바다 동물들이 종종 플라스틱을 먹는다고 말해 주었다."],["Some of them get sick and die.","그들 중 일부는 병들어 죽는다."],["After three hours, the beach looked clean {2}.","세 시간 뒤, 해변은 다시 깨끗해 보였다."],["I will use less plastic from now on.","나는 앞으로 플라스틱을 덜 쓸 것이다."]],"b":[[["surprised","excited","bored"],0,"쓰레기가 너무 많은 것을 보고 '놀랐다(surprised)'가 알맞습니다."],[["never","again","already"],1,"청소 후 해변이 '다시' 깨끗해졌다는 뜻이므로 again이 맞습니다."]],"g":[["There was/were ~","There was so much trash.","There + be동사는 '~이 있다'라는 뜻입니다. 셀 수 없는 명사(trash, water)와 단수에는 was, 복수에는 were를 씁니다.","There were many people in the park."],["접속사 that (목적어절)","A man told us that sea animals often eat plastic.","tell/say/think + that + 문장에서 that절은 '~라는 것을'이라는 뜻으로 목적어 역할을 합니다.","I think that he is right."]],"k":[["join","Can I join your team?","너희 팀에 들어가도 되니?"],["pick up","Pick up the trash, please.","쓰레기를 주워 주세요."],["trash","Put the trash in the bin.","쓰레기를 쓰레기통에 넣어라."],["sick","I was sick yesterday.","나는 어제 아팠다."],["less","Eat less sugar.","설탕을 덜 먹어라."]],"c":{}},{"id":54,"lv":"하","type":"d","topic":"길 묻기","title":"Where Is the Library?","s":[["Tom","Excuse me. Where is the city library?","실례합니다. 시립 도서관이 어디 있나요?"],["Woman","Go straight two blocks and {1} left.","두 블록 직진한 다음 왼쪽으로 도세요."],["Tom","Two blocks and then left?","두 블록 가서 왼쪽이요?"],["Woman","Yes. It's next to the post office.","네. 우체국 옆에 있어요."],["Tom","Is it far from here?","여기서 먼가요?"],["Woman","No, it isn't. It takes about five minutes on foot.","아니요. 걸어서 5분쯤 걸려요."],["Tom","Is it open on Sundays?","일요일에도 여나요?"],["Woman","Yes, but it closes {2} five o'clock.","네, 하지만 5시에 닫아요."],["Tom","Thank you so much.","정말 감사합니다."],["Woman","You're welcome. Have a nice day.","천만에요. 좋은 하루 보내세요."]],"b":[[["turn","turns","turned"],0,"길 안내는 명령문이므로 동사원형 turn을 씁니다."],[["in","on","at"],2,"구체적인 시각 앞에는 전치사 at을 씁니다."]],"g":[["길 안내 명령문","Go straight two blocks and turn left.","명령문은 주어 없이 동사원형으로 시작합니다. 길을 알려 줄 때 Go straight, Turn left/right를 씁니다.","Turn right at the bank."],["시간이 걸리다 It takes","It takes about five minutes on foot.","It takes + 시간은 '시간이 ~ 걸리다'라는 뜻입니다. on foot은 '걸어서', by bus는 '버스로'입니다.","It takes ten minutes by bus."]],"k":[["straight","Walk straight for one block.","한 블록 똑바로 걸어가세요."],["next to","Sit next to me.","내 옆에 앉아."],["post office","I sent a letter at the post office.","나는 우체국에서 편지를 보냈다."],["on foot","I go to school on foot.","나는 걸어서 학교에 간다."],["close","The store closes at nine.","그 가게는 9시에 닫는다."]],"c":{}},{"id":55,"lv":"하","type":"d","topic":"여행","title":"At the Airport","s":[["Officer","Good morning. May I see your passport?","안녕하세요. 여권을 보여 주시겠어요?"],["Sora","Here it is.","여기 있습니다."],["Officer","What is the purpose of your visit?","방문 목적이 무엇인가요?"],["Sora","I'm here to {1} my aunt.","이모를 만나러 왔어요."],["Officer","How long are you going to stay?","얼마나 머무르실 건가요?"],["Sora","For two weeks.","2주 동안이요."],["Officer","Is this your first time in Australia?","호주는 처음이신가요?"],["Sora","Yes, it is. I am very excited.","네, 처음이에요. 정말 설레요."],["Officer","Where will you stay?","어디에서 머무르실 건가요?"],["Sora","At my aunt's house in Sydney.","시드니에 있는 이모 댁에서요."],["Officer","Okay. {2}","좋습니다. 즐거운 여행 되세요."],["Sora","Thank you very much.","정말 감사합니다."]],"b":[[["visit","visited","visiting"],0,"to 뒤에는 동사원형이 오므로 visit입니다. to부정사가 '~하러'라는 목적을 나타냅니다."],[["Enjoy your trip.","Show me your ticket.","You can't come in."],0,"입국 심사가 끝나고 인사하는 장면이므로 Enjoy your trip.이 알맞습니다."]],"g":[["정중한 부탁 May I ~?","May I see your passport?","May I + 동사원형?은 '~해도 될까요?'라는 정중한 허락 요청입니다. Can I ~?보다 더 공손합니다.","May I use your phone?"],["기간 묻기 How long ~?","How long are you going to stay?","How long ~?은 '얼마나 오래'라는 기간을 묻습니다. 대답은 For + 기간으로 합니다.","How long did you wait? For an hour."]],"k":[["passport","Don't lose your passport.","여권을 잃어버리지 마."],["purpose","What is the purpose of this meeting?","이 회의의 목적이 무엇인가요?"],["stay","I stayed at a hotel.","나는 호텔에 머물렀다."],["trip","How was your trip?","여행 어땠어?"],["aunt","My aunt is a doctor.","우리 이모는 의사다."]],"c":{}},{"id":56,"lv":"중","type":"p","topic":"과학","title":"Volcanoes","s":[["A volcano is an opening in the Earth's surface.","화산은 지구 표면에 있는 구멍이다."],["Deep under the ground, it is so hot that rocks melt.","땅속 깊은 곳은 너무 뜨거워서 바위가 녹는다."],["This melted rock is called magma.","이 녹은 바위를 마그마라고 부른다."],["When the pressure gets too high, magma pushes up and comes out of the volcano.","압력이 너무 높아지면 마그마가 위로 밀려 올라와 화산 밖으로 나온다."],["Then we call it lava.","그때부터 우리는 그것을 용암이라고 부른다."],["Lava can be {1} than 1,000 degrees Celsius.","용암은 섭씨 1,000도보다 더 뜨거울 수 있다."],["Volcanoes can be very dangerous, but they are also {2}.","화산은 매우 위험할 수 있지만 유용하기도 하다."],["The soil near volcanoes is rich, so farmers can grow crops well.","화산 근처의 흙은 비옥해서 농부들이 작물을 잘 기를 수 있다."],["Some countries use the heat from volcanoes to make electricity.","어떤 나라들은 화산의 열을 이용해 전기를 만든다."],["Jeju Island in Korea was made by volcanoes long ago.","한국의 제주도는 오래전에 화산에 의해 만들어졌다."],["Hallasan is a volcano, but it is not {3} now.","한라산은 화산이지만 지금은 활동하지 않는다."]],"b":[[["hotter","hot","hottest"],0,"뒤에 than이 있으므로 비교급 hotter입니다."],[["useful","useless","tiny"],0,"but 뒤에서 위험과 반대로 좋은 점을 말하므로 '유용한(useful)'이 맞습 write in my diary every night.","나는 매일 밤 일기를 쓴다."],["upset","She was upset about the news.","그녀는 그 소식에 속상했다."],["improve","I want to improve my English.","나는 영어 실력을 높이고 싶다."],["skill","Cooking is a useful skill.","요리는 유용한 기술이다."],["moment","Wait a moment, please.","잠시만 기다려 주세요."]],"c":{"keeping":"keep a diary = 일기를 쓰다","record":"기록"}},{"id":61,"lv":"중","type":"p","topic":"이야기","title":"The Lion and the Mouse","s":[["One day, a lion was sleeping under a tree.","어느 날 사자 한 마리가 나무 아래에서 자고 있었다."],["A little mouse ran across his face.","작은 생쥐 한 마리가 사자의 얼굴 위를 달려 지나갔다."],["The angry lion caught the mouse with his big paw.","화가 난 사자는 큰 앞발로 생쥐를 잡았다."],["\"Please let me go,\" cried the mouse.","\"제발 놓아주세요.\"라고 생쥐가 외쳤다."],["\"If you {1} me, I will help you someday.\"","\"저를 살려 주시면 언젠가 당신을 도와드릴게요.\""],["The lion laughed because he thought a mouse was too small {2} a lion.","사자는 생쥐가 사자를 돕기에는 너무 작다고 생각해서 웃었다."],["But he let the mouse go.","하지만 사자는 생쥐를 놓아주었다."],["A few days later, the lion was caught in a hunter's net.","며칠 뒤, 사자가 사냥꾼의 그물에 걸렸다."],["He roared loudly.","사자는 크게 울부짖었다."],["The mouse heard him and came running.","생쥐가 그 소리를 듣고 달려왔다."],["It {3} through the ropes with its sharp teeth, and the lion was free.","생쥐는 날카로운 이빨로 밧줄을 갉아 끊었고, 사자는 풀려났다."],["Even a small friend can be a great help.","작은 친구도 큰 도움이 될 수 있다."]],"b":[[["save","saves","saved"],0,"조건절에서는 미래의 뜻이라도 현재시제를 쓰며 주어가 you이므로 save입니다."],[["to help","helping","help"],0,"too ~ to부정사 구문이므로 to help입니다."],[["chewed","sang","slept"],0,"이빨로 밧줄을 '갉아 끊었다(chewed)'가 알맞습니다."]],"g":[["사역동사 let + 목적어 + 동사원형","Please let me go.","let A + 동사원형은 'A가 ~하게 허락하다, 두다'라는 뜻입니다. 목적어 뒤에 to 없이 동사원형이 옵니다.","Let me introduce myself."],["수동태 과거 was caught","The lion was caught in a hunter's net.","was/were + 과거분사는 '~되었다, ~당했다'라는 과거의 수동입니다.","The window was broken by the ball."]],"k":[["paw","The cat licked its paw.","고양이가 앞발을 핥았다."],["hunter","The hunter set a trap.","사냥꾼이 덫을 놓았다."],["net","The fish were in the net.","물고기들이 그물 안에 있었다."],["roar","The lion roared.","사자가 울부짖었다."],["sharp","Be careful. The knife is sharp.","조심해. 칼이 날카로워."]],"c":{"free":"자유로운, 풀려난"}},{"id":62,"lv":"하","type":"p","topic":"인물","title":"The Boy Who Planted Trees","s":[["Felix Finkbeiner was a nine-year-old boy in Germany.","펠릭스 핑크바이너는 독일의 아홉 살 소년이었다."],["One day, he learned about climate change at school.","어느 날 그는 학교에서 기후 변화에 대해 배웠다."],["He was worried about the Earth, so he {1} to plant trees.","그는 지구가 걱정되어 나무를 심기로 결심했다."],["He planted his first tree near his school.","그는 학교 근처에 첫 나무를 심었다."],["Then he asked other children to join him.","그런 다음 다른 아이들에게 함께하자고 부탁했다."],["Soon, many children around the world {2} planting trees, too.","곧 전 세계의 많은 아이들도 나무 심기를 시작했다."],["Now, his group has planted millions of trees.","이제 그의 단체는 수백만 그루의 나무를 심었다."],["One small idea changed the world.","작은 생각 하나가 세상을 바꾸었다."]],"b":[[["decided","forgot","stopped"],0,"지구가 걱정되어 나무를 심기로 '결심했다(decided)'가 알맞습니다."],[["started","hated","finished"],0,"곧 많은 아이들이 함께 나무 심기를 '시작했다'는 흐름이므로 started입니다."]],"g":[["decide to + 동사원형","He decided to plant trees.","decide, want, plan, hope 뒤에는 to부정사가 목적어로 옵니다. '~하기로 결심하다'라는 뜻입니다.","I decided to learn Chinese."],["ask + 목적어 + to부정사","He asked other children to join him.","ask A to + 동사원형은 'A에게 ~해 달라고 부탁하다'라는 뜻입니다.","Mom asked me to clean my room."]],"k":[["climate","The climate here is mild.","이곳 기후는 온화하다."],["worried","I'm worried about my test.","나는 시험이 걱정된다."],["soon","See you soon.","곧 보자."],["million","Millions of people watched the game.","수백만 명이 그 경기를 보았다."],["change","Things change fast.","모든 것이 빨리 변한다."]],"c":{}},{"id":63,"lv":"하","type":"p","topic":"일상","title":"My Weekend Plan","s":[["This weekend, I am going to be very busy.","이번 주말에 나는 아주 바쁠 것이다."],["On Saturday morning, I am going to clean my room.","토요일 아침에는 내 방을 청소할 것이다."],["It is really messy now.","지금 방이 정말 지저분하다."],["In the afternoon, I will meet my friends at the park.","오후에는 공원에서 친구들을 만날 것이다."],["We are going to ride our bikes {1} the river.","우리는 강을 따라 자전거를 탈 re very heavy, so how can they stay in the air?","비행기는 매우 무거운데 어떻게 하늘에 떠 있을 수 있을까?"],["The secret is in the shape of their wings.","비밀은 날개의 모양에 있다."],["The top of a wing is curved, and the bottom is flat.","날개의 윗면은 곡선이고 아랫면은 평평하다."],["When a plane moves forward, air flows {1} over the top of the wing than under it.","비행기가 앞으로 나아가면 공기가 날개 아래보다 위에서 더 빠르게 흐른다."],["This makes the air pressure above the wing lower.","이것은 날개 위쪽의 기압을 더 낮게 만든다."],["The higher pressure under the wing pushes it up.","날개 아래의 더 높은 압력이 날개를 위로 밀어 올린다."],["This force is called lift.","이 힘을 양력이라고 부른다."],["Engines are also important {2} they push the plane forward.","엔진도 중요한데, 비행기를 앞으로 밀어 주기 때문이다."],["Without speed, there is no lift.","속도가 없으면 양력도 없다."],["That's why planes need a long runway to {3} off.","그래서 비행기는 이륙하기 위해 긴 활주로가 필요하다."]],"b":[[["faster","slower","fast"],0,"뒤에 than이 있으므로 비교급 faster입니다. 위쪽 공기가 더 빠르게 흐릅니다."],[["because","although","unless"],0,"엔진이 중요한 이유를 설명하므로 because입니다."],[["take","get","make"],0,"take off는 '이륙하다'라는 뜻입니다."]],"g":[["비교급 + than","Air flows faster over the top of the wing than under it.","형용사·부사의 비교급 + than은 '~보다 더 …한/하게'라는 뜻입니다.","A cheetah runs faster than a lion."],["That's why ~","That's why planes need a long runway.","That's why + 주어 + 동사는 '그래서 ~하다, 그것이 ~하는 이유다'라는 뜻으로 앞 내용의 결과를 말합니다.","I was sick. That's why I was absent."]],"k":[["secret","Can you keep a secret?","비밀 지킬 수 있니?"],["curved","The road is curved.","그 길은 굽어 있다."],["flat","The land is flat.","그 땅은 평평하다."],["force","Gravity is a force.","중력은 힘이다."],["runway","The plane is on the runway.","비행기가 활주로에 있다."]],"c":{"lift":"양력 (위로 뜨게 하는 힘)","top":"윗면","bottom":"아랫면"}},{"id":69,"lv":"중","type":"p","topic":"음식","title":"The History of Chocolate","s":[["Chocolate is one of the most popular sweets in the world.","초콜릿은 세계에서 가장 인기 있는 단것 중 하나이다."],["But it was not always sweet.","하지만 초콜릿이 늘 달았던 것은 아니다."],["About 3,000 years ago, people in Central America made a drink from cacao beans.","약 3천 년 전, 중앙아메리카 사람들은 카카오 콩으로 음료를 만들었다."],["The drink was bitter and {1}.","그 음료는 쓰고 매웠다."],["The Aztecs believed that cacao was a gift from the gods.","아즈텍 사람들은 카카오가 신이 준 선물이라고 믿었다."],["They even used cacao beans as {2}.","그들은 심지어 카카오 콩을 돈으로 사용했다."],["In the 1500s, Spanish explorers brought cacao to Europe.","1500년대에 스페인 탐험가들이 카카오를 유럽으로 가져왔다."],["Europeans added sugar and milk to the drink, and it became very popular.","유럽인들은 그 음료에 설탕과 우유를 넣었고, 그것은 큰 인기를 얻었다."],["Later, in 1847, a British company made the first chocolate bar.","그 후 1847년, 한 영국 회사가 최초의 판 초콜릿을 만들었다."],["Since then, people have enjoyed {3} chocolate in many forms.","그 이후로 사람들은 다양한 형태로 초콜릿 먹는 것을 즐겨 왔다."]],"b":[[["spicy","sweet","soft"],0,"원래 음료는 달지 않았다고 했고 bitter(쓴)와 함께 쓰이므로 spicy(매운)입니다."],[["money","toys","medicine"],0,"카카오 콩을 화폐, 즉 '돈(money)'으로 썼습니다."],[["eating","to eating","eat"],0,"enjoy는 동명사를 목적어로 취하므로 eating입니다."]],"g":[["현재완료 계속 since then","Since then, people have enjoyed eating chocolate.","have + 과거분사 + since ~는 과거의 한 시점부터 지금까지 계속된 일을 나타냅니다.","Since then, we have been best friends."],["as (~로서)","They even used cacao beans as money.","전치사 as는 '~로서, ~로'라는 뜻으로 자격이나 용도를 나타냅니다.","She works as a nurse."]],"k":[["popular","This song is very popular.","이 노래는 아주 인기 있다."],["bitter","This medicine tastes bitter.","이 약은 맛이 쓰다."],["believe","I believe you.","나는 너를 믿어."],["explorer","The explorer found a new island.","그 탐험가는 새 섬을 발견했다."],["form","Water has three forms.","물은 세 가지 형태가 있다."]],"c":{"bar":"(초콜릿) 판, 막대"}},{"id":70,"lv":"하","type":"d","topic":"병원","title":"At the Nurse's Office","s":[["Nurse","Come in. What's wrong?","들어오렴. 어디가 아프니?"],["Junho","I have a headache, and I feel cold.","머리가 아프고 추워요."],["Nurse","Let me check your temperature.","체온을 재 볼게."],["Junho","Is it high?","높아요?"],["Nurse","Yes, it's thirty-eight degrees. You have a {1}.","응, 38도구나. 열이 있네."],["Junho","Oh, no. I have a test next period.","아, 안 돼요. 다음 시간에 시험이 있어요."],["Nurse","I'm afraid you should go home and rest.","안타깝지만 집에 가서 쉬는 게 좋겠어."],["Junho","Okay. Can you call my mom?","알겠어요. 엄마께 전화해 주실 수 있나요?"],["Nurse","{2} Lie down here until she comes.","물론이지. 엄마 오실 때까지 여기 누워 있으렴."],["Junho","Thank you. You are very kind.","감사합니다. 정말 친절하세요."]],"b":[[["fever","cold","cough"],0,"체온이 38도로 높다고 했으므로 '열(fever)'이 알맞습니다."],[["Sure.","No, I can't.","I'm sorry."],0,"뒤에서 엄마가 오실 때까지 누워 있으라고 했으므로 부탁을 들어주는 Sure.가 맞습니다."]],"g":[["증상 말하기 have a + 병명","I have a headache.","have a headache(두통), have a fever(열), have a cold(감기)처럼 have a + 증상으로 아픈 곳을 말합니다.","I have a stomachache."],["조동사 should","You should go home and rest.","should + 동사원형은 '~하는 게 좋겠다, ~해야 한다'라는 충고를 나타냅니다. I'm afraid를 앞에 붙이면 말투가 부드러워집니다.","You should drink a lot of water."]],"k":[["headache","I have a bad headache.","나는 두통이 심하다."],["temperature","Check the temperature of the water.","물의 온도를 확인해라."],["degree","It is ten degrees outside.","밖은 10도이다."],["rest","You need some rest.","너는 휴식이 좀 필요해."],["lie down","Lie down on the bed.","침대에 누워라."]],"c":{"period":"(수업) 교시","afraid":"I'm afraid ~ = 유감이지만 ~이다"}},{"id":71,"lv":"상","type":"p","topic":"이야기","title":"The Necklace","s":[["Mathilde was a beautiful young woman who always dreamed of a rich life.","마틸드는 늘 부유한 삶을 꿈꾸던 아름다운 젊은 여성이었다."],["One day, she and her husband were invited to a fancy party, but she had nothing to wear.","어느 날 그녀와 남편은 화려한 파티에 초대받았지만, 그녀는 입을 것이 없었다."],["So she {1} a diamond necklace from her rich friend, Madame Forestier.","그래서 그녀는 부자 친구인 포레스티에 부인에게서 다이아몬드 목걸이를 빌렸다."],["At the party, she was the most admired woman in the room.","파티에서 그녀는 그곳에서 가장 찬사를 받는 여성이었다."],["However, when she got home, she realized that the necklace was {2}.","하지만 집에 돌아왔을 때 그녀는 목걸이가 없어졌다는 것을 깨달았다."],["She and her husband borrowed a huge amount of money and bought a similar necklace to return to her friend.","그녀와 남편은 엄청난 돈을 빌려 친구에게 돌려줄 비슷한 목걸이를 샀다."],["For the next ten years, they worked day and night to pay back the debt.","그 후 10년 동안 그들은 빚을 갚기 위해 밤낮으로 일했다."],["Mathilde's hands became rough, and she looked much older than her age.","마틸드의 손은 거칠어졌고 그녀는 나이보다 훨씬 늙어 보였다."],["One day, she met Madame Forestier and told her the whole story.","어느 날 그녀는 포레스티에 부인을 만나 모든 이야기를 털어놓았다."],["Her friend was shocked. \"Oh, my poor Mathilde! Mine was fake. It was worth {3} five hundred francs!\"","친구는 충격을 받았다. \"아, 불쌍한 마틸드! 내 건 가짜였어. 기껏해야 500프랑짜리였다고!\""]],"b":[[["borrowed","lent","sold"],0,"친구'에게서' 빌린 것이므로 borrowed입니다. lend는 '빌려주다'입니다."],[["missing","shining","cheap"],0,"목걸이가 '없어졌다(missing)'는 것을 깨달았다는 뜻입니다."],[["at most","at least","at first"],0,"가짜라서 '기껏해야(at most)' 500프랑이었다는 뜻입니다."]],"g":[["수동태 were invited / was admired","she and her husband were invited to a fancy party / the most admired woman","be invited는 '초대받다'라는 수동태입니다. admired처럼 과거분사가 명사 앞에서 '~받는'이라는 뜻으로 꾸밀 수도 있습니다.","We were invited to the wedding."],["-thing + to부정사 / 형용사적 용법","she had nothing to wear / a similar necklace to return to her friend","to부정사가 명사 뒤에서 '~할'이라는 뜻으로 앞의 명사를 꾸밉니다.","I have a lot of homework to do."]],"k":[["fancy","We ate at a fancy restaurant.","우리는 고급 식당에서 먹었다."],["necklace","She wore a pearl necklace.","그녀는 진주 목걸이를 했다."],["similar","Our ideas are similar.","우리 생각은 비슷하다."],["debt","He paid off his debt.","그는 빚을 다 갚았다."],["fake","This bag is fake.","이 가방은 가짜다."]],"c":{"rough":"(손이) 거친","francs":"프랑 (옛 프랑스 화폐 단위)","madame":"~ 부인 (프랑스어 호칭)"}},{"id":72,"lv":"하","type":"p","topic":"학교","title":"Sports Day","s":[["Yesterday was Sports Day at our school.","어제는 우리 학교 체육대회 날이었다."],["All the students wore T-shirts in their class colors.","모든 학생이 자기 반 색깔의 티셔츠를 입었다."],["Our class color was blue.","우리 반 색깔은 파란색이었다."],["In the morning, we had a relay race.","오전에 우리는 이어달리기를 했다."],["I was the last runner, so I was very {1}.","나는 마지막 주자여서 아주 긴장했다."],["When I got the baton, I ran as fast as I could.","배턴을 받았을 때 나는 할 수 있는 한 빨리 달렸다."],["We finished second!","우리는 2등을 했다!"],["In the afternoon, we played tug of war and {2}.","오후에는 줄다리기를 해서 이겼다."],["Everyone cheered and jumped.","모두가 환호하며 뛰었다."],["It was the most exciting day of the year.","그날은 일 년 중 가장 밤에 빛난다."],["shape","The cookie has a star shape.","그 쿠키는 별 모양이다."],["seem","He seems tired.","그는 피곤해 보인다."],["special","Today is a special day.","오늘은 특별한 날이다."]],"c":{"once":"한 번","suits":"(특수) 옷, 복장"}},{"id":74,"lv":"상","type":"d","topic":"여행","title":"A Problem at the Hotel","s":[["Clerk","Good evening. How may I help you?","안녕하세요. 무엇을 도와드릴까요?"],["Mr. Han","Hi. I'm staying in room 507, and there's a problem with the air conditioner.","안녕하세요. 507호에 묵고 있는데 에어컨에 문제가 있어요."],["Clerk","I'm sorry to hear that. What seems to be the problem?","불편을 드려 죄송합니다. 어떤 문제가 있으신가요?"],["Mr. Han","It's making a loud noise, and the room isn't getting any {1}.","소리가 크게 나고 방이 전혀 시원해지지 않아요."],["Clerk","I apologize. I'll send someone to fix it right away.","죄송합니다. 바로 고칠 사람을 보내겠습니다."],["Mr. Han","How long will it take? My kids are really tired and want to sleep.","얼마나 걸릴까요? 아이들이 정말 피곤해서 자고 싶어 해요."],["Clerk","It could take about an hour. {2} we move you to another room instead?","한 시간 정도 걸릴 수도 있어요. 대신 다른 방으로 옮겨 드릴까요?"],["Mr. Han","That would be better. Is there a room with a view of the sea?","그게 더 낫겠네요. 바다가 보이는 방이 있나요?"],["Clerk","Let me check. Yes, room 812 is available, and it's even {3} than your current room.","확인해 보겠습니다. 네, 812호가 비어 있는데 지금 방보다 훨씬 더 넓어요."],["Mr. Han","Perfect. Do I have to pay extra for it?","좋네요. 추가 요금을 내야 하나요?"],["Clerk","No, sir. It's free because of the trouble we've caused.","아닙니다. 저희가 불편을 끼쳐 드려서 무료입니다."],["Mr. Han","{4} Thank you for your help.","정말 친절하시네요. 도와주셔서 감사합니다."]],"b":[[["cooler","warmer","darker"],0,"에어컨이 고장 나서 방이 '시원해지지(cooler)' 않는다는 뜻입니다."],[["Shall","Must","Did"],0,"Shall we ~?는 '~할까요?'라는 제안 표현입니다."],[["larger","smaller","noisier"],0,"더 좋은 방을 제안하는 흐름이므로 '더 넓은(larger)'입니다."],[["That's very kind of you.","That's not my problem.","I can't believe it."],0,"무료로 좋은 방을 준 것에 감사하는 말이므로 That's very kind of you.입니다."]],"g":[["get + 비교급 (변화)","The room isn't getting any cooler.","get + 비교급은 '점점 더 ~해지다'입니다. not any + 비교급은 '조금도 더 ~하지 않다'라는 뜻입니다.","It's getting darker outside."],["목적격 관계대명사 생략 + 현재완료","because of the trouble we've caused","the trouble (that) we've caused에서 목적격 관계대명사가 생략되었습니다. we've caused는 현재완료로 '우리가 일으킨'이라는 뜻입니다.","This is the best movie I've ever seen."]],"k":[["air conditioner","Turn on the air conditioner.","에어컨을 켜라."],["apologize","I apologize for being late.","늦어서 죄송합니다."],["available","Is this seat available?","이 자리 비어 있나요?"],["current","What is your current address?","현재 주소가 어떻게 되세요?"],["extra","There is no extra charge.","추가 요금은 없습니다."]],"c":{"view":"전망, 경치","trouble":"불편, 문제"}},{"id":75,"lv":"상","type":"p","topic":"인물","title":"The Wright Brothers","s":[["For thousands of years, people dreamed of flying like birds.","수천 년 동안 사람들은 새처럼 나는 것을 꿈꿨다."],["The first people who made that dream come true were Wilbur and Orville Wright.","그 꿈을 처음 실현시킨 사람들은 윌버와 오빌 라이트였다."],["The two brothers owned a small bicycle shop in Ohio.","두 형제는 오하이오에서 작은 자전거 가게를 운영했다."],["They had never gone to college, but they were {1} and loved to build machines.","그들은 대학에 간 적이 없었지만 호기심이 많았고 기계 만드는 것을 좋아했다."],["They studied how birds turned their wings and tested more than 200 wing shapes in a homemade wind tunnel.","그들은 새가 날개를 어떻게 돌리는지 연구했고 직접 만든 풍동에서 200개가 넘는 날개 모양을 시험했다."],["Many experts said that a flying machine was impossible, but the brothers kept trying {2} many failures.","많은 전문가들이 비행 기계는 불가능하다고 말했지만, 형제는 많은 실패에도 불구하고 계속 시도했다."],["Finally, on December 17, 1903, Orville flew their plane for twelve seconds.","마침내 1903년 12월 17일, 오빌은 그들의 비행기를 12초 동안 날렸다."],["It was a short flight, but it changed history.","그것은 짧은 비행이었지만 역사를 바꾸었다."],["Today, millions of people travel by plane every day, which would not have been possible {3} their hard work.","오늘날 매일 수백만 명이 비행기로 여행하는데, 이것은 그들의 노력이 없었다면 불가능했을 것이다."]],"b":[[["curious","lazy","rich"],0,"대학은 안 갔지만 기계를 좋아했다는 흐름이므로 '호기심 많은(curious)'이 알맞습니다."],[["despite","because of","thanks to"],0,"실패에도 '불구하고' 계속 시도했으므로 despite입니다."],[["without","with","by"],0,"'그들의 노력이 없었다면'이라는 뜻이므로 without입니다."]],"g":[["사역동사 make + 목적어 + 동사원형","The first people who made that dream come true","make A + 동사원형은 'A가 ~하게 만들다'입니다. come true는 '실현되다'라는 뜻입니다.","The movie made me cry."],["과거완료 경험 had never p.p.","They had never gone to college.","had + 과거분사는 과거의 한 시점까지의 경험이나 완료를 나타냅니다. had never ~는 '(그때까지) 한 번도 ~한 적이 없었다'입니다.","I had never seen snow before I moved to Canada."]],"k":[["dream of","She dreams of becoming a pilot.","그녀는 조종사가 되는 것을 꿈꾼다."],["homemade","I love homemade cookies.","나는 집에서 만든 쿠키를 정말 좋아한다."],["tunnel","The train went through a tunnel.","기차가 터널을 통과했다."],["failure","Failure is a part of success.","실패는 성공의 일부다."],["despite","We went out despite the rain.","우리는 비에도 불구하고 나갔다."]],"c":{"tunnel":"wind tunnel = 풍동 (바람을 일으키는 시험 장치)"}},{"id":76,"lv":"하","type":"p","topic":"문화","title":"Saying Hello Around the World","s":[["People say hello in different ways around the world.","전 세계 사람들은 다양한 방식으로 인사한다."],["In Korea, people usually bow to older people.","한국에서 사람들은 보통 어른에게 고개 숙여 인사한다."],["In the United States, people often shake hands.","미국에서는 사람들이 흔히 악수를 한다."],["In France, friends kiss each other on the {1}.","프랑스에서는 친구끼리 볼에 입을 맞춘다."],["In Thailand, people put their hands together and say \"Sawasdee.\"","태국에서는 두 손을 모으고 \"사와디\"라고 말한다."],["In New Zealand, the Maori people touch noses.","뉴질랜드의 마오리족은 코를 맞댄다."],["These greetings look different, {2} they all mean the same thing:","이 인사들은 달라 보이지만 모두 같은 뜻을 지닌다."],["\"I'm happy to see you.\"","\"만나서 반가워요.\""]],"b":[[["cheek","foot","back"],0,"프랑스의 볼 인사(비주)이므로 '볼(cheek)'이 알맞습니다."],[["so","but","because"],1,"'달라 보인다'와 '같은 뜻이다'는 반대되는 내용이므로 but입니다."]],"g":[["each other","Friends kiss each other on the cheek.","each other는 '서로'라는 뜻의 대명사로 동사의 목적어 자리에 옵니다.","We help each other."],["감정 형용사 + to부정사","I'm happy to see you.","happy, glad, sad 같은 감정 형용사 뒤의 to부정사는 '~해서'라는 감정의 이유를 나타냅니다.","I was sad to hear the news."]],"k":[["different","We have different ideas.","우리는 생각이 다르다."],["bow","Bow to your teacher.","선생님께 인사해라."],["touch","Don't touch the paint.","페인트를 만지지 마."],["greeting","Hello is a common greeting.","Hello는 흔한 인사말이다."],["mean","What does this word mean?","이 단어는 무슨 뜻이니?"]],"c":{"maori":"마오리족 (뉴질랜드 원주민)"}},{"id":77,"lv":"중","type":"p","topic":"학교","title":"No Phones in Class?","s":[["Some schools have a rule that students cannot use phones during class.","어떤 학교들은 학생들이 수업 중에 휴대폰을 쓸 수 없다는 규칙이 있다."],["Is this a good idea?","이것은 좋은 생각일까?"],["People who agree with the rule say that phones make it hard to {1}.","이 규칙에 찬성하는 사람들은 휴대폰이 집중을 어렵게 만든다고 말한다."],["Students often check messages or play games instead of listening to the teacher.","학생들은 선생님 말씀을 듣는 대신 메시지를 확인하거나 게임을 하곤 한다."],["Without phones, they talk to each other more during breaks, too.","휴대폰이 없으면 쉬는 시간에도 서로 더 많이 이야기한다."],["{2}, other people think phones can be useful for learning.","반면에 다른 사람들은 휴대폰이 학습에 유용할 수 있다고 생각한다."],["Students can look up words or watch educational videos.","학생들은 단어를 찾아보거나 교육 영상을 볼 수 있다."],["Parents also want to contact their children in an emergency.","부모들도 긴급한 상황에서 자녀에게 연락하고 싶어 한다."],["Maybe the best answer is to use phones only when teachers {3} it.","어쩌면 가장 좋은 답은 선생님이 허락할 때만 휴대폰을 쓰는 것일지도 모른다."],["What do you think?","당신은 어떻게 생각하는가?"]],"b":[[["focus","sleep","relax"],0,"휴대폰이 수업에 '집중하는(focus)' 것을 어렵게 만든다는 뜻입니다."],[["On the other hand","For example","As a result"],0,"앞과 반대되는 의견을 소개하므로 On the other hand(반면에)입니다."],[["allow","forget","stop"],0,"선생님이 '허락할(allow)' 때만 쓰자는 절충안입니다."]],"g":[["make + it + 형용사 + to부정사","Phones make it hard to focus.","make it hard to ~는 '~하는 것을 어렵게 만들다'라는 뜻입니다. it은 가목적어이고 to부정사가 진짜 목적어입니다.","The noise made it difficult to sleep."],["instead of + 동명사","instead of listening to the teacher","instead of + 명사/동명사는 '~ 대신에'라는 뜻입니다.","I drank water instead of soda."]],"k":[["agree","I agree with you.","나는 네 말에 동의해."],["break","Let's take a short break.","잠깐 쉬자."],["educational","This game is educational.","이 게임은 교육적이다."],["contact","Please contact me by email.","이메일로 연락 주세요."],["emergency","Call 119 in an emergency.","긴급 상황에서는 119에 전화해라."]],"c":{"breaks":"쉬는 시간","look":"look up = (사전 등에서) 찾아보다"}},{"id":78,"lv":"하","type":"p","topic":"과학","title":"Why Do Leaves Change Color?","s":[["In fall, many leaves turn yellow, orange, and red.","가을에 많은 나뭇잎이 노란색, 주황색, 빨간색으로 변한다."],["Why does this happen?","왜 이런 일이 일어날까?"],["Leaves have a green color called chlorophyll.","나뭇잎에는 엽록소라고 불리는 초록색 색소가 있다."],["It helps trees make food from {1}.","엽록소는 나무가 햇빛으로 양분을 만들도록 돕는다."],["In fall, the days get shorter and colder.","가을에는 낮이 점점 짧아지고 추워진다."],["Trees stop making food, so the green color goes away.","나무가 양분 만들기를 멈추기 때문에 초록색이 사라진다."],["Then we can see the other colors in the leaves.","그러면 우리는 잎 속의 다른 색들을 볼 수 있다."],["These colors were there all summer, but the green {2} them.","이 색들은 여름 내내 거기 있었지만 초록색이 그것들을 가렸다."]],"b":[[["sunlight","snow","wind"],0,"식물은 햇빛을 이용해 양분을 만듭니다."],[["hid","showed","made"],0,"초록색이 다른 색을 '가렸다'는 의미이므로 hide의 과거형 hid가 알맞습니다."]],"g":[["help + 목적어 + 동사원형","It helps trees make food.","help + 사람/사물 + 동사원형(또는 to부정사)은 '~가 …하도록 돕다'라는 뜻입니다.","My dad helped me fix my bike."],["get + 비교급","The days get shorter and colder.","get + 비교급은 '점점 더 ~해지다'라는 변화를 나타냅니다.","The weather is getting warmer."]],"k":[["leaf","A leaf fell on my head.","나뭇잎 하나가 내 머리 위로 떨어졌다."],["happen","What happened to you?","너 무슨 일 있었니?"],["sunlight","Plants need sunlight.","식물은 햇빛이 필요하다."],["stop","Please stop talking.","말을 그만해 주세요."],["hide","The cat hid under the bed.","고양이는 침대 밑에 숨었다."]],"c":{"food":"(식물의) 양분","called":"~라고 불리는"}},{"id":79,"lv":"상","type":"p","topic":"환경","title":"The Great Pacific Garbage Patch","s":[["Between California and Hawaii, there is a huge area of floating trash.","캘리포니아와 하와이 사이에 떠다니는 쓰레기로 이루어진 거대한 지역이 있다."],["It is called the Great Pacific Garbage Patch, and it is about three times larger than France.","그것은 태평양 거대 쓰레기 지대라고 불리며, 프랑스보다 약 세 배 더 크다."],["Ocean currents move in a circle there, so trash that is thrown into the sea {1} in the middle.","그곳에서는 해류가 원을 그리며 움직이기 때문에 바다에 버려진 쓰레기가 가운데에 모인다."],["Most of it is plastic, which has been broken into tiny pieces by sunlight and waves.","그 대부분은 플라스틱인데, 햇빛과 파도에 의해 아주 작은 조각으로 부서져 왔다."],["Because the pieces are so small, it is {2} to clean them up with nets.","조각들이 너무 작아서 그물로 치우기가 거의 불가능하다."],["Scientists have found that many sea animals mistake plastic for food.","과학자들은 많은 바다 동물이 플라스틱을 먹이로 착각한다는 것을 발견했다."],["Turtles, for example, often eat plastic bags because they look like jellyfish.","예를 들어 거북이는 비닐봉지가 해파리처럼 보여서 자주 먹는다."],["Some organizations have been working to remove the trash, but the best solution is to stop plastic from {3} the ocean in the first place.","일부 단체들이 쓰레기를 치우려고 노력해 왔지만, 가장 좋은 해결책은 애초에 플라스틱이 바다에 들어가지 않도록 막는 것이다."],["Using less plastic is something {4} everyone can do.","플라스틱을 덜 쓰는 것은 모두가 할 수 있는 일이다."]],"b":[[["collects","disappears","melts"],0,"해류가 원을 그리며 돌아 쓰레기가 가운데에 '모인다(collects)'는 뜻입니다."],[["almost impossible","very easy","quite cheap"],0,"조각이 너무 작으므로 그물로 치우기가 '거의 불가능하다'가 알맞습니다."],[["entering","to enter","enter"],0,"stop A from -ing는 'A가 ~하지 못하게 막다'이므로 entering입니다."],[["that","who","what"],0,"something을 꾸미는 목적격 관계대명사는 that입니다. -thing 뒤에는 which보다 that을 주로 씁니다."]],"g":[["배수 비교 three times + 비교급 + than","It is about three times larger than France.","배수사(two times, three times) + 비교급 + than은 '~보다 몇 배 더 …한'이라는 뜻입니다. three times as large as France로도 쓸 수 있습니다.","This room is two times bigger than mine."],["현재완료 수동태 has been p.p.","Most of it is plastic, which has been broken into tiny pieces.","has/have been + 과거분사는 '(지금까지) ~되어 왔다'라는 현재완료 수동입니다. 쉼표 뒤 which는 앞의 plastic에 설명을 덧붙입니다.","The road has been closed since Monday."]],"k":[["floating","There were floating leaves on the pond.","연못에 떠다니는 잎들이 있었다."],["current","The current is strong here.","이곳은 물살이 세다."],["mistake A for B","I mistook him for his brother.","나는 그를 그의 형으로 착각했다."],["organization","She works for a health organization.","그녀는 보건 단체에서 일한다."],["in the first place","Why did you go there in the first place?","애초에 너는 왜 거기 갔니?"]],"c":{"patch":"(특정한) 지대, 구역","currents":"해류"}},{"id":80,"lv":"중","type":"p","topic":"문화","title":"Thanksgiving in America","s":[["Thanksgiving is one of the biggest holidays in the United States.","추수감사절은 미국에서 가장 큰 명절 중 하나이다."],["It is celebrated on the fourth Thursday of November.","추수감사절은 11월 넷째 목요일에 기념된다."],["The holiday started in 1621, {1} early settlers and Native Americans shared a meal after a good harvest.","이 명절은 초기 정착민과 아메리카 원주민이 풍성한 수확 후 함께 식사를 나눈 1621년에 시작되었다."],["Today, families gather to eat a big dinner together.","오늘날 가족들은 함께 푸짐한 저녁을 먹기 위해 모인다."],["The main dish is usually roast turkey.","주요리는 보통 칠면조 구이다."],["People also eat mashed potatoes, corn, and pumpkin pie.","사람들은 으깬 감자, 옥수수, 호박 파이도 먹는다."],["Before eating, many families take turns saying what they are {2} for.","식사 전에 많은 가족들이 돌아가며 감사한 일을 말한다."],["The next day is called Black Friday.","그다음 날은 블랙 프라이데이라고 불린다."],["On that day, stores have big sales, so many people go shopping {3} in the morning.","그날 상점들은 큰 할인을 해서 많은 사람들이 아침 일찍 쇼핑을 간다."]],"b":[[["when","where","which"],0,"앞의 연도(1621)를 꾸미며 '~한 때'라는 시간의 관계부사이므로 when입니다."],[["thankful","afraid","sorry"],0,"감사를 나누는 명절이므로 be thankful for(~에 감사하다)입니다."],[["early","late","slowly"],0,"할인을 위해 아침 '일찍(early)' 쇼핑을 갑니다."]],"g":[["관계부사 when","in 1621, when early settlers and Native Americans shared a meal","when은 시간을 나타내는 선행사(1621) 뒤에서 '그때 ~했다'라고 설명을 덧붙입니다.","I remember the day when we first met."],["take turns + 동명사","Many families take turns saying what they are thankful for.","take turns -ing는 '번갈아 ~하다'라는 뜻입니다. what they are thankful for는 '그들이 감사하는 것'입니다.","We took turns reading the story."]],"k":[["celebrate","We celebrated his birthday.","우리는 그의 생일을 축하했다."],["settler","The settlers built houses.","정착민들은 집을 지었다."],["gather","People gathered in the square.","사람들이 광장에 모였다."],["turkey","We eat turkey at Thanksgiving.","우리는 추수감사절에 칠면조를 먹는다."],["thankful","I'm thankful for my friends.","나는 친구들에게 감사하다."]],"c":{"native":"원주민의 (Native Americans = 아메리카 원주민)","sales":"할인 판매, 세일"}},{"id":81,"lv":"중","type":"p","topic":"과학","title":"Why Is the Sky Blue?","s":[["Have you ever wondered why the sky is blue?","하늘이 왜 파란지 궁금해 본 적이 있는가?"],["Sunlight looks white, but it is actually made of many colors.","햇빛은 하얗게 보이지만 사실은 여러 색으로 이루어져 있다."],["You can see these colors in a rainbow.","무지개에서 이 색들을 볼 수 있다."],["When sunlight enters the air, it hits tiny pieces of gas.","햇빛이 공기에 들어오면 아주 작은 기체 입자에 부딪힌다."],["Blue light {1} more than other colors because its waves are short.","파란빛은 파장이 짧기 때문에 다른 색보다 더 많이 흩어진다."],["So blue light spreads all over the sky, and our eyes see it everywhere.","그래서 파란빛이 하늘 전체로 퍼지고, 우리 눈은 어디서나 그것을 보게 된다."],["Then why is the sky red at sunset?","그렇다면 해 질 녘에는 왜 하늘이 빨갈까?"],["In the evening, sunlight has to travel a {2} way through the air.","저녁에는 햇빛이 공기를 통과해 더 먼 길을 가야 한다."],["Most of the blue light disappears {3} it reaches us.","파란빛의 대부분은 우리에게 닿기 전에 사라진다."],["Only red and orange light is left.","빨간빛과 주황빛만 남는다."]],"b":[[["scatters","scatter","scattering"],0,"주어 Blue light가 단수이고 현재 사실이므로 scatters입니다."],[["longer","shorter","faster"],0,"저녁에는 햇빛이 비스듬히 들어와 '더 먼(longer)' 길을 갑니다."],[["after","before","because"],1,"우리에게 '닿기 전에' 사라진다는 뜻이므로 before입니다."]],"g":[["간접의문문","Have you ever wondered why the sky is blue?","의문사가 문장 안으로 들어가면 '의문사 + 주어 + 동사' 순서가 됩니다. why is the sky blue → why the sky is blue","Do you know where he lives?"],["be made of","It is actually made of many colors.","be made of ~는 '~으로 이루어져 있다, ~으로 만들어지다'라는 뜻입니다.","This table is made of wood."]],"k":[["wonder","I wonder what time it is.","지금 몇 시인지 궁금하다."],["actually","Actually, I'm not hungry.","사실 나는 배고프지 않아."],["rainbow","Look at the rainbow!","무지개 좀 봐!"],["spread","The news spread quickly.","소식이 빠르게 퍼졌다."],["disappear","The sun disappeared behind the clouds.","해가 구름 뒤로 사라졌다."]],"c":{"waves":"(빛의) 파장, 파동","way":"길, 거리","left":"남은 (be left = 남다)"}},{"id":82,"lv":"상","type":"p","topic":"동물","title":"Elephants Never Forget","s":[["Elephants are the largest land animals on Earth, and they also have one of the best memories in the animal world.","코끼리는 지구에서 가장 큰 육지 동물이며, 동물 세계에서 가장 뛰어난 기억력을 가진 동물 중 하나이기도 하다."],["An elephant's brain weighs about five kilograms, which is heavier than that of any other land animal.","코끼리의 뇌는 약 5킬로그램으로, 다른 어떤 육지 동물의 뇌보다 무겁다."],["Elephants live in family groups that are led by the oldest female.","코끼리는 가장 나이 많은 암컷이 이끄는 가족 무리를 지어 산다."],["She remembers where water can be found, even during long dry seasons that happen only {1} every few decades.","그녀는 수십 년에 한 번만 일어나는 긴 건기 동안에도 어디서 물을 찾을 수 있는지 기억한다."],["Scientists have discovered that groups with older leaders are {2} to survive hard times.","과학자들은 나이 든 리더가 있는 무리가 힘든 시기를 더 잘 견딘다는 것을 발견했다."],["Elephants can also recognize the voices of dozens of other elephants, and they remember friends that they have not seen for years.","코끼리는 수십 마리의 다른 코끼리 목소리를 알아볼 수 있고, 몇 년 동안 보지 못한 친구들도 기억한다."],["Sadly, elephants are often killed for their ivory tusks.","슬프게도 코끼리는 상아 엄니 때문에 자주 죽임을 당한다."],["When an old leader is lost, the whole family {3}.","나이 든 리더를 잃으면 가족 전체가 고통받는다."],["Protecting elephants means protecting their knowledge, too.","코끼리를 보호하는 것은 그들의 지식을 보호하는 것이기도 하다."]],"b":[[["once","twice","never"],0,"'수십 년에 한 번' 일어나는 일이므로 once입니다."],[["more likely","less likely","too weak"],0,"나이 든 리더가 물이 있는 곳을 기억하므로 생존할 '가능성이 더 높다(more likely)'입니다."],[["suffers","celebrates","grows"],0,"리더를 잃으면 가족 전체가 '고통받는다(suffers)'는 뜻입니다."]],"g":[["수동태 be led by","family groups that are led by the oldest female","be + 과거분사 + by ~는 '~에 의해 …되다'입니다. 관계사절 안에서도 수동태를 쓸 수 있습니다.","The team is led by a young captain."],["비교 대상의 반복을 피하는 that of","heavier than that of any other land animal","비교할 때 앞에 나온 명사(brain)를 반복하지 않으려고 that of ~를 씁니다. 비교급 + than any other + 단수명사는 최상급의 뜻입니다.","The population of Seoul is larger than that of Busan."]],"k":[["memory","She has a good memory.","그녀는 기억력이 좋다."],["weigh","The baby weighs three kilograms.","그 아기는 몸무게가 3킬로그램이다."],["female","The female bird sits on the eggs.","암컷 새가 알을 품는다."],["recognize","I didn't recognize you.","너를 못 알아봤어."],["tusk","Elephants use their tusks to dig.","코끼리는 땅을 파는 데 엄니를 사용한다."]],"c":{"likely":"~할 가능성이 있는","lost":"잃은 (be lost = 잃게 되다)","decades":"수십 년 (decade = 10년)"}},{"id":83,"lv":"중","type":"p","topic":"편지","title":"Advice for a New Student","s":[["Dear Sumin,","수민에게,"],["I heard that you are moving to a new school next week.","다음 주에 새 학교로 전학 간다고 들었어."],["I know how you feel because I changed schools last year.","나도 작년에 전학을 해서 네 기분을 알아."],["At first, I was nervous and didn't talk to anyone.","처음에 나는 긴장해서 아무에게도 말을 걸지 않았어."],["But then I found some {1} ways to make friends.","그런데 친구를 사귀는 몇 가지 좋은 방법을 찾았지."],["First, smile and say hello to your classmates.","첫째, 반 친구들에게 웃으며 인사해."],["Second, join a club that you are interested {2}.","둘째, 관심 있는 동아리에 들어가."],["It is easier to talk with people who like the same things.","같은 것을 좋아하는 사람들과 이야기하는 게 더 쉬워."],["Third, don't be afraid of {3} questions.","셋째, 질문하는 것을 두려워하지 마."],["People like to help others.","사람들은 남을 돕는 걸 좋아해."],["I'm sure you will do well.","너는 분명 잘할 거야."],["Your friend, Hayun","너의 친구, 하윤이가"]],"b":[[["useful","boring","strange"],0,"친구를 사귀는 데 '유용한(useful)' 방법입니다."],[["in","at","on"],0,"be interested in ~은 '~에 관심이 있다'라는 뜻입니다."],[["asking","ask","to asking"],0,"전치사 of 뒤에는 동명사가 오므로 asking입니다."]],"g":[["가주어 it ~ to부정사","It is easier to talk with people who like the same things.","to부정사 주어가 길면 it을 주어 자리에 두고 to부정사를 뒤로 보냅니다. 이때 it은 해석하지 않습니다.","It is fun to learn new things."],["주격 관계대명사 who/that","people who like the same things","who는 사람 선행사를, that은 사람과 사물 모두를 꾸미는 관계대명사입니다. 뒤에 동사가 바로 옵니다.","I have a friend who lives in Canada."]],"k":[["move","We moved to Daegu.","우리는 대구로 이사했다."],["classmate","She is my classmate.","그녀는 우리 반 친구다."],["club","I'm in the art club.","나는 미술 동아리에 있다."],["interested","I'm interested in space.","나는 우주에 관심이 있다."],["sure","Are you sure?","확실하니?"]],"c":{"changed":"change schools = 전학하다","do":"do well = 잘 해내다"}},{"id":84,"lv":"중","type":"d","topic":"전화","title":"Ordering a Pizza","s":[["Clerk","Hello, Tony's Pizza. May I take your order?","안녕하세요, 토니스 피자입니다. 주문하시겠어요?"],["Eric","Yes. I'd like to order a large pepperoni pizza.","네. 라지 페퍼로니 피자 하나 주문할게요."],["Clerk","Would you like anything to drink?","음료도 드릴까요?"],["Eric","Two bottles of cola, please. How long will it take?","콜라 두 병 주세요. 얼마나 걸려요?"],["Clerk","It will take about thirty minutes. Can I have your address?","30분쯤 걸려요. 주소를 알려 주시겠어요?"],["Eric","It's 25 Maple Street, apartment 302.","메이플 가 25번지, 302호예요."],["Clerk","Okay. Your total is twenty dollars. Will you pay by card or {1} cash?","네. 총 20달러입니다. 카드로 하시겠어요, 현금으로 하시겠어요?"],["Eric","By card. Oh, can you {2} the onions?","카드로요. 아, 양파는 빼 줄 수 있어요?"],["Clerk","{3} I'll tell the cook.","물론이죠. 요리사에게 말할게요."],["Eric","Thank you so much.","정말 고마워요."]],"b":[[["in","on","at"],0,"'현금으로'는 in cash, '카드로'는 by card로 씁니다."],[["leave out","put on","pick up"],0,"leave out은 '빼다, 넣지 않다'라는 뜻입니다."],[["No problem.","That's too bad.","I don't think so."],0,"요청을 들어주고 요리사에게 말하겠다고 하므로 No problem.이 맞습니다."]],"g":[["I'd like to + 동사원형","I'd like to order a large pepperoni pizza.","I'd like to ~는 I would like to의 줄임말로 '~하고 싶습니다'라는 정중한 요청입니다. I want to보다 공손합니다.","I'd like to book a room."],["-thing + to부정사","Would you like anything to drink?","anything, something 같은 -thing 대명사 뒤의 to부정사는 '~할'이라는 뜻으로 앞을 꾸밉니다.","I need something to eat."]],"k":[["order","Are you ready to order?","주문하시겠어요?"],["address","What's your email address?","이메일 주소가 뭐니?"],["total","The total is 50 dollars.","합계는 50달러입니다."],["cash","I paid in cash.","나는 현금으로 냈다."],["leave out","Don't leave out any words.","단어를 하나도 빠뜨리지 마."]],"c":{"take":"take your order = 주문을 받다; take time = 시간이 걸리다"}},{"id":85,"lv":"하","type":"p","topic":"일상","title":"A Rainy Day","s":[["This morning, it was raining hard.","오늘 아침 비가 세차게 내리고 있었다."],["I forgot my umbrella at home.","나는 우산을 집에 두고 왔다."],["When school finished, I stood at the door and looked at the rain.","학교가 끝났을 때 나는 문 앞에 서서 비를 바라보았다."],["I didn't know {1} to do.","나는 무엇을 해야 할지 몰랐다."],["Then my friend Minsu came and said, \"Let's share my umbrella.\"","그때 친구 민수가 와서 \"내 우산 같이 쓰자.\"라고 말했다."],["His umbrella was small, so our shoulders got wet.","그의 우산은 작아서 우리 어깨가 젖었다."],["But we laughed and talked all the way home.","하지만 우리는 집에 오는 내내 웃으며 이야기했다."],["I {2} him a hot chocolate at the store.","나는 가게에서 그에게 핫초코를 사 주었다."],["Rainy days are not so bad.","비 오는 날도 그렇게 나쁘지 않다."]],"b":[[["what","who","where"],0,"what to do는 '무엇을 해야 할지'라는 뜻입니다."],[["bought","buy","buys"],0,"과거 이야기이므로 buy의 과거형 bought입니다."]],"g":[["과거진행형","It was raining hard.","was/were + 동사-ing는 '~하고 있었다'라는 과거의 진행 중인 동작을 나타냅니다.","I was reading a book at nine."],["의문사 + to부정사","I didn't know what to do.","what/where/when + to + 동사원형은 '무엇을/어디서/언제 ~해야 할지'라는 뜻입니다.","Tell me where to go."]],"k":[["forget","Don't forget your homework.","숙제 잊지 마."],["umbrella","Take an umbrella with you.","우산 가지고 가."],["shoulder","He put his hand on my shoulder.","그는 내 어깨에 손을 얹었다."],["wet","My shoes are wet.","내 신발이 젖었다."],["all the way","I ran all the way to school.","나는 학교까지 내내 달렸다."]],"c":{}},{"id":86,"lv":"상","type":"p","topic":"과학","title":"Black Holes","s":[["A black hole is a place in space where gravity is so strong that nothing can escape from it, not even light.","블랙홀은 중력이 너무 강해서 빛조차도 빠져나올 수 없는 우주의 한 장소이다."],["That is why it looks completely black.","그래서 블랙홀은 완전히 검게 보인다."],["Most black holes are formed when a very large star {1} at the end of its life.","대부분의 블랙홀은 아주 큰 별이 생의 마지막에 붕괴할 때 만들어진다."],["The star's material is pressed into a tiny space, which makes its gravity extremely powerful.","별의 물질이 아주 작은 공간으로 압축되는데, 이로 인해 중력이 극도로 강해진다."],["Because black holes cannot be seen directly, scientists study them by watching how they affect stars and gas {2} them.","블랙홀은 직접 볼 수 없기 때문에 과학자들은 블랙홀이 주변의 별과 가스에 어떻게 영향을 주는지 관찰하여 연구한다."],["In 2019, the first picture of a black hole was taken by a team of more than 200 scientists.","2019년, 200명이 넘는 과학자들로 이루어진 팀이 블랙홀의 첫 사진을 찍었다."],["They used eight telescopes around the world {3} worked together like one giant telescope.","그들은 하나의 거대한 망원경처럼 함께 작동하는 전 세계 8대의 망원경을 사용했다."],["The black hole in the picture is about 6.5 billion times {4} than our sun.","사진 속 블랙홀은 우리 태양보다 약 65억 배 더 무겁다."]],"b":[[["collapses","shines","grows"],0,"별이 생의 마지막에 '붕괴할(collapses)' 때 블랙홀이 됩니다."],[["around","inside","without"],0,"블랙홀 '주변의(around)' 별과 가스를 관찰합니다."],[["that","who","where"],0,"사물(telescopes)을 꾸미는 주격 관계대명사 that입니다."],[["heavier","lighter","smaller"],0,"블랙홀은 태양보다 훨씬 '무겁다(heavier)'는 내용입니다. 뒤에 than이 있어 비교급을 씁니다."]],"g":[["관계부사 where","a place in space where gravity is so strong that nothing can escape","where는 장소 선행사(a place) 뒤에서 '그곳에서는 ~하다'라는 뜻으로 꾸며 줍니다. 안에 so ~ that 구문도 쓰였습니다.","This is the town where I grew up."],["수동태 과거 + by","The first picture of a black hole was taken by a team of more than 200 scientists.","was/were + 과거분사 + by ~는 '~에 의해 …되었다'라는 과거 수동태입니다.","The song was written by a teenager."]],"k":[["gravity","Gravity pulls things down.","중력은 물체를 아래로 끌어당긴다."],["escape","The bird escaped from the cage.","새가 새장에서 빠져나갔다."],["completely","I completely forgot.","나는 완전히 잊어버렸다."],["affect","Weather affects my mood.","날씨는 내 기분에 영향을 준다."],["telescope","We looked at the moon through a telescope.","우리는 망원경으로 달을 보았다."]],"c":{"material":"물질","billion":"10억"}},{"id":87,"lv":"하","type":"p","topic":"광고","title":"Summer Camp for Kids","s":[["Do you love nature and adventure?","자연과 모험을 좋아하나요?"],["Join Green Hill Summer Camp!","그린힐 여름 캠프에 참가하세요!"],["The camp is for students from ten to fifteen years old.","캠프는 10세에서 15세 학생들을 위한 것입니다."],["It runs from July 25 to July 29.","캠프는 7월 25일부터 7월 29일까지 열립니다."],["You can go hiking, swim in the lake, and {1} under the stars.","하이킹을 하고, 호수에서 수영하고, 별빛 아래에서 캠핑을 할 수 있어요."],["Our teachers will teach you how to make a fire safely.","선생님들이 불을 안전하게 피우는 법을 가르쳐 드릴 거예요."],["The price is 200,000 won, and it {2} all meals.","가격은 20만 원이고 모든 식사가 포함됩니다."],["Sign up on our website by July 10.","7월 10일까지 웹사이트에서 신청하세요."]],"b":[[["camp","camps","camped"],0,"can 뒤에 go, swim과 나란히 오므로 동사원형 camp입니다."],[["includes","forgets","sells"],0,"가격에 식사가 '포함된다(includes)'는 뜻이 자연스럽습니다."]],"g":[["how to + 동사원형","Our teachers will teach you how to make a fire.","how to + 동사원형은 '~하는 방법'이라는 뜻으로 명사처럼 쓰입니다.","Can you show me how to use this?"],["미래 표현 will","Our teachers will teach you.","will + 동사원형은 앞으로 일어날 일을 나타냅니다. 부정은 will not(won't)입니다.","It will rain tomorrow."]],"k":[["nature","I love nature.","나는 자연을 사랑한다."],["adventure","Life is an adventure.","인생은 모험이다."],["lake","We swam in the lake.","우리는 호수에서 수영했다."],["safely","Drive safely.","안전하게 운전해."],["sign up","I signed up for the class.","나는 그 수업에 신청했다."]],"c":{"runs":"(행사가) 열리다, 진행되다"}},{"id":88,"lv":"상","type":"p","topic":"건강","title":"Can Laughter Make You Healthier?","s":[["You may have heard the saying, \"Laughter is the best medicine.\"","\"웃음은 최고의 명약이다.\"라는 말을 들어 본 적이 있을 것이다."],["Is it really true?","그것은 정말 사실일까?"],["Studies have shown that laughing has many benefits for both our minds and bodies.","연구에 따르면 웃음은 우리의 마음과 몸 모두에 많은 이점이 있다."],["When we laugh, our brain releases chemicals that make us feel happy and {1}.","우리가 웃으면 뇌는 우리를 행복하고 편안하게 만드는 화학 물질을 내보낸다."],["Laughing also reduces stress hormones, which can make us sick when there are too many of them.","웃음은 또한 스트레스 호르몬을 줄이는데, 이 호르몬이 너무 많으면 우리를 아프게 할 수 있다."],["In addition, a good laugh works your stomach muscles and increases blood flow, just like light exercise {2}.","게다가 크게 웃으면 가벼운 운동처럼 복부 근육이 움직이고 혈류가 늘어난다."],["Some hospitals even have \"laughter programs\" for patients who are recovering from serious illnesses.","몇몇 병원에는 심각한 병에서 회복 중인 환자들을 위한 '웃음 프로그램'까지 있다."],["The best part is that laughter is free and {3}.","가장 좋은 점은 웃음이 공짜이고 전염된다는 것이다."],["When one person laughs, the people around them usually start laughing, too.","한 사람이 웃으면 보통 주변 사람들도 웃기 시작한다."],["So why not watch a funny movie with your friends tonight?","그러니 오늘 밤 친구들과 재미있는 영화를 보는 게 어떨까?"]],"b":[[["relaxed","worried","angry"],0,"행복한 감정과 함께 오는 '편안한(relaxed)'이 알맞습니다."],[["does","makes","is"],0,"앞의 동사구(works ... and increases ...)를 대신하는 대동사 does입니다."],[["contagious","expensive","dangerous"],0,"뒤에 한 사람이 웃으면 주변도 웃는다고 했으므로 '전염되는(contagious)'입니다."]],"g":[["현재완료 경험 may have heard","You may have heard the saying.","may have + 과거분사는 '~했을지도 모른다'라는 과거에 대한 추측입니다.","He may have missed the bus."],["대동사 do/does","just like light exercise does","앞에 나온 동사를 반복하지 않으려고 do/does/did로 대신합니다. 여기서 does = works your muscles and increases blood flow","She runs faster than I do."]],"k":[["laughter","Laughter filled the room.","웃음소리가 방을 가득 채웠다."],["benefit","Exercise has many benefits.","운동에는 많은 이점이 있다."],["release","The factory released smoke.","공장이 연기를 내뿜었다."],["reduce","Reduce the amount of salt.","소금의 양을 줄여라."],["recover","She recovered from the flu.","그녀는 독감에서 회복했다."]],"c":{"works":"(근육을) 움직이게 하다","saying":"속담, 격언","why":"why not ~? = ~하는 게 어때?"}},{"id":89,"lv":"중","type":"p","topic":"건강","title":"Why We Should Drink Water","s":[["About sixty percent of your body is water.","당신 몸의 약 60퍼센트는 물이다."],["Water helps carry food to your cells and keeps your body temperature normal.","물은 영양분을 세포로 운반하는 것을 돕고 체온을 정상으로 유지해 준다."],["Every day, you lose water when you sweat, breathe, and go to the bathroom.","매일 당신은 땀을 흘리고 숨 쉬고 화장실에 갈 때 물을 잃는다."],["So you need to drink water {1}.","그래서 물을 규칙적으로 마셔야 한다."],["If you don't drink enough, you may get a headache or feel {2}.","충분히 마시지 않으면 두통이 생기거나 어지러울 수 있다."],["Many people drink soda or juice instead of water.","많은 사람들이 물 대신 탄산음료나 주스를 마신다."],["However, these drinks have a lot of sugar.","하지만 이런 음료에는 설탕이 많이 들어 있다."],["Water is the healthiest choice.","물이 가장 건강한 선택이다."],["Try {3} a water bottle with you all day.","하루 종일 물병을 가지고 다니도록 해라."],["It will remind you to drink more.","그것은 당신에게 물을 더 마시라고 상기시켜 줄 것이다."]],"b":[[["regularly","rarely","never"],0,"물을 잃으니 '규칙적으로(regularly)' 마셔야 합니다."],[["dizzy","happy","strong"],0,"물이 부족하면 '어지러울(dizzy)' 수 있습니다."],[["carrying","carry","carried"],0,"try -ing는 '(시험 삼아) ~해 보다'라는 뜻입니다."]],"g":[["remind + 목적어 + to부정사","It will remind you to drink more.","remind A to ~는 'A에게 ~할 것을 상기시키다'라는 뜻입니다.","Please remind me to call Mom."],["최상급 the + -iest","Water is the healthiest choice.","y로 끝나는 형용사는 y를 i로 바꾸고 -est를 붙여 최상급을 만듭니다. healthy → healthiest","This is the easiest question."]],"k":[["percent","Ten percent of the students are absent.","학생의 10퍼센트가 결석했다."],["cell","Our bodies are made of cells.","우리 몸은 세포로 이루어져 있다."],["sweat","I sweat a lot in summer.","나는 여름에 땀을 많이 흘린다."],["breathe","Breathe deeply.","깊게 숨 쉬어라."],["remind","This song reminds me of you.","이 노래는 너를 생각나게 한다."]],"c":{"food":"영양분","normal":"정상인"}},{"id":90,"lv":"하","type":"p","topic":"과학","title":"Our Amazing Heart","s":[["Put your hand on your chest.","가슴에 손을 얹어 보아라."],["Can you feel your heart?","심장이 느껴지는가?"],["Your heart is about the size of your fist.","심장은 대략 주먹만 한 크기이다."],["It works all day and all night without {1}.","심장은 쉬지 않고 밤낮으로 일한다."],["It beats about one hundred thousand times a day.","심장은 하루에 약 10만 번 뛴다."],["Each beat sends blood to every part of your body.","박동이 한 번 칠 때마다 피를 몸 구석구석으로 보낸다."],["Blood carries oxygen and food to your body.","피는 몸에 산소와 영양분을 나른다."],["To keep your heart {2}, exercise often and eat healthy food.","심장을 튼튼하게 유지하려면 자주 운동하고 건강한 음식을 먹어라."]],"b":[[["resting","rests","rest"],0,"전치사 without 뒤에는 동명사가 오므로 resting입니다."],[["strong","weak","small"],0,"운동하고 건강한 음식을 먹는 목적은 심장을 '튼튼하게(strong)' 하는 것입니다."]],"g":[["전치사 + 동명사","It works without resting.","전치사(without, before, after, by 등) 뒤에 동사가 올 때는 -ing 형태(동명사)로 씁니다.","He left without saying goodbye."],["빈도·횟수 표현 a day","It beats about one hundred thousand times a day.","숫자 + times + a day/a week는 '하루에/일주일에 ~번'이라는 뜻입니다. 여기서 a는 '~마다'입니다.","I brush my teeth three times a day."]],"k":[["chest","He has a pain in his chest.","그는 가슴에 통증이 있다."],["fist","Make a fist.","주먹을 쥐어라."],["beat","My heart is beating fast.","내 심장이 빠르게 뛰고 있다."],["blood","Blood is red.","피는 빨갛다."],["exercise","I exercise every morning.","나는 매일 아침 운동한다."]],"c":{"food":"(몸에 필요한) 영양분"}},{"id":91,"lv":"중","type":"p","topic":"일상","title":"Learning to Cook","s":[["Last month, my mom got a new job, and she started coming home late.","지난달 엄마가 새 직장을 얻으셔서 늦게 귀가하기 시작하셨다."],["My brother and I decided {1} dinner on weekdays.","형과 나는 평일에 저녁을 요리하기로 했다."],["At first, we only knew how to make instant noodles.","처음에 우리는 라면 끓이는 법밖에 몰랐다."],["So we watched cooking videos online and tried easy recipes.","그래서 우리는 인터넷으로 요리 영상을 보고 쉬운 요리법을 시도했다."],["Our first curry was too salty, and the rice was {2}.","첫 카레는 너무 짰고 밥은 덜 익었다."],["But we didn't give up.","하지만 우리는 포기하지 않았다."],["Every day we got a little better.","매일 우리는 조금씩 나아졌다."],["Now we can make pasta, fried rice, and soybean paste soup.","이제 우리는 파스타, 볶음밥, 된장찌개를 만들 수 있다."],["Last Friday, Mom came home and found dinner on the table.","지난 금요일 엄마는 집에 오셔서 식탁에 차려진 저녁을 보셨다."],["She was so {3} that she hugged us both.","엄마는 너무 감동하셔서 우리 둘을 안아 주셨다."],["Cooking is now my favorite hobby.","요리는 이제 내가 가장 좋아하는 취미이다."]],"b":[[["to cook","cooking","cook"],0,"decide는 to부정사를 목적어로 취하므로 to cook입니다."],[["hard","sweet","perfect"],0,"실패한 요리 이야기이므로 밥이 '딱딱했다(hard)'가 알맞습니다."],[["moved","bored","scared"],0,"아이들이 차린 저녁을 보고 '감동해서' 안아 주었으므로 moved입니다."]],"g":[["start + 동명사/to부정사","She started coming home late.","start, begin, like, love는 동명사와 to부정사를 모두 목적어로 쓸 수 있고 뜻이 거의 같습니다.","It started raining. = It started to rain."],["so ~ that ...","She was so moved that she hugged us both.","so + 형용사 + that + 주어 + 동사는 '너무 ~해서 …했다'라는 결과를 나타냅니다.","The test was so easy that everyone passed."]],"k":[["weekday","I study on weekdays.","나는 평일에 공부한다."],["recipe","This recipe is simple.","이 요리법은 간단하다."],["salty","The soup is too salty.","국이 너무 짜다."],["hug","She hugged her dog.","그녀는 강아지를 안아 주었다."],["hobby","My hobby is cooking.","내 취미는 요리다."]],"c":{"hard":"(밥이) 덜 익어 딱딱한","moved":"감동한"}},{"id":92,"lv":"중","type":"p","topic":"동물","title":"Animals That Sleep All Winter","s":[["Some animals sleep through the cold winter.","어떤 동물들은 추운 겨울 내내 잠을 잔다."],["This long sleep is called hibernation.","이 긴 잠을 겨울잠이라고 부른다."],["In winter, it is hard for animals {1} enough food.","겨울에는 동물들이 충분한 먹이를 찾기가 어렵다."],["So they eat a lot in the fall and store fat in their bodies.","그래서 그들은 가을에 많이 먹어 몸에 지방을 저장한다."],["Then they find a safe place, like a cave or a hole in the ground.","그런 다음 동굴이나 땅속 구멍 같은 안전한 장소를 찾는다."],["During hibernation, their hearts beat very {2}, and their bodies get cold.","겨울잠을 자는 동안 그들의 심장은 아주 천천히 뛰고 체온은 낮아진다."],["This helps them save energy.","이것은 그들이 에너지를 아끼도록 돕는다."],["Bears, bats, and frogs are famous for hibernating.","곰, 박쥐, 개구리는 겨울잠으로 유명하다."],["When spring comes, they wake up {3} and look for food.","봄이 오면 그들은 배고픈 채로 깨어나 먹이를 찾는다."]],"b":[[["to find","finding","find"],0,"it is hard for 사람 to ~ 구문이므로 to find입니다."],[["slowly","quickly","loudly"],0,"에너지를 아끼려고 심장이 '천천히(slowly)' 뜁니다."],[["hungry","full","angry"],0,"겨울 내내 먹지 않았으니 '배고픈(hungry)' 상태로 깹니다."]],"g":[["it ~ for 목적어 to부정사","It is hard for animals to find enough food.","to부정사의 행동을 하는 사람(의미상 주어)은 for + 목적어로 나타냅니다.","It is easy for me to swim."],["be famous for ~","Bears, bats, and frogs are famous for hibernating.","be famous for + 명사/동명사는 '~로 유명하다'라는 뜻입니다.","Jeonju is famous for bibimbap."]],"k":[["through","He worked through the night.","그는 밤새 일했다."],["store","Squirrels store nuts.","다람쥐는 견과를 저장한다."],["fat","Butter has a lot of fat.","버터에는 지방이 많다."],["cave","Bats live in caves.","박쥐는 동굴에 산다."],["hole","There is a hole in my sock.","내 양말에 구멍이 났다."]],"c":{"cold":"(몸이) 차가워진"}},{"id":93,"lv":"상","type":"p","topic":"환경","title":"Fast Fashion","s":[["Have you ever bought a T-shirt because it was cheap, only to wear it once or twice?","싸다는 이유로 티셔츠를 샀다가 겨우 한두 번 입고 만 적이 있는가?"],["This is called \"fast fashion.\"","이것을 '패스트 패션'이라고 부른다."],["Clothing companies make trendy clothes quickly and sell them at low prices, so people buy more clothes than ever before.","의류 회사들은 유행하는 옷을 빠르게 만들어 싼 가격에 팔기 때문에 사람들은 그 어느 때보다 많은 옷을 산다."],["However, fast fashion has serious effects on the environment.","하지만 패스트 패션은 환경에 심각한 영향을 미친다."],["It takes about 2,700 liters of water to make one cotton T-shirt, which is enough for one person {1} for two and a half years.","면 티셔츠 한 장을 만드는 데 약 2,700리터의 물이 드는데, 이는 한 사람이 2년 반 동안 마실 수 있는 양이다."],["In addition, many cheap clothes are made of plastic fibers, which release tiny pieces into the water when they {2}.","게다가 많은 값싼 옷은 플라스틱 섬유로 만들어지는데, 이 섬유는 세탁될 때 아주 작은 조각들을 물속으로 내보낸다."],["Millions of tons of clothing are thrown away every year, and most of it ends up in landfills.","매년 수백만 톤의 옷이 버려지며, 그 대부분은 결국 쓰레기 매립지로 간다."],["What can we do?","우리는 무엇을 할 수 있을까?"],["We can buy fewer but {3} clothes and wear them longer.","우리는 옷을 더 적게, 하지만 더 질 좋은 것으로 사서 더 오래 입을 수 있다."]],"b":[[["to drink","drinking","drinks"],0,"enough for + 사람 + to부정사는 '(사람)이 ~하기에 충분한'이므로 to drink입니다."],[["are washed","wash","washing"],0,"옷은 '세탁되는' 대상이므로 수동태 are washed입니다."],[["better","worse","cheaper"],0,"더 적게 사되 '더 좋은(better)' 옷을 사서 오래 입자는 제안입니다."]],"g":[["결과의 to부정사 only to","bought a T-shirt because it was cheap, only to wear it once or twice","only to + 동사원형은 '(결국) ~하고 말았다'라는 실망스러운 결과를 나타냅니다.","He ran to the station, only to miss the train."],["비교급 + than ever before","people buy more clothes than ever before","비교급 + than ever (before)는 '그 어느 때보다 더 ~한'이라는 뜻입니다.","She is happier than ever."]],"k":[["trendy","She wears trendy clothes.","그녀는 유행하는 옷을 입는다."],["effect","The medicine had a good effect.","그 약은 좋은 효과가 있었다."],["cotton","This shirt is 100% cotton.","이 셔츠는 면 100%다."],["fiber","Nylon is a plastic fiber.","나일론은 플라스틱 섬유다."],["landfill","The landfill is full of trash.","매립지가 쓰레기로 가득하다."]],"c":{"fashion":"패션, 유행 (fast fashion = 빠르게 만들고 버려지는 옷)","takes":"(시간·양이) 들다"}},{"id":94,"lv":"상","type":"d","topic":"학교","title":"The Student Council Election","s":[["Jiho","Are you really running for student council president?","너 정말 학생회장 선거에 나가?"],["Nari","Yes. I've been thinking about it for weeks, and I
